version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      tree-sitter:
        patterns:
          - "github.com/tree-sitter/*"
          - "github.com/fwcd/tree-sitter-*"
      all-others:
        update-types:
          - minor
          - patch
    ignore:
      # onnxruntime_go bindings are tightly coupled to the ORT shared library
      # version (ORT_API_VERSION in the C header). Bumping the bindings requires
      # a matching ORT library bump in scripts/fetch-deps.sh and must not break
      # darwin/amd64 (Mac Intel), which is pinned to ORT 1.23.1 (last x86_64
      # release). Review manually — do not auto-merge.
      - dependency-name: "github.com/yalue/onnxruntime_go"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # codeql-action/init and codeql-action/analyze are one action in two
      # halves, pinned to the same SHA in codeql.yml. CodeQL refuses to run when
      # they disagree, so a PR that bumps only one of them fails with
      # "CodeQL job status was configuration error" and cannot be merged on its
      # own — and merging it anyway would break the analysis on main until its
      # sibling landed. Measured 2026-08-17 on two such PRs, both red.
      # One group, one PR, both halves moving together.
      codeql:
        patterns:
          - "github/codeql-action*"
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 5

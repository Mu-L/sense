# The gold group carrying the margin: its delta is the headline number.
# Named explicitly here because it used to be a convention held in prose.
discriminator: dependents
rows:
  # Gold is the must-find audit of what depends on the account record. FOUR groups, ONE of
  # which scores. `write-path` (4) and `guards` (4) were added by the expansion, are
  # NON-SCORING, and are the targets of steps 3 and 5; every one of their eight files appears
  # in the `direct_callers` list of the shown blast payload quoted under SEAM PROFILE, and
  # every line below was opened and read by hand at its pin. No file is repeated across
  # groups. Nothing was added to `dependents`: untested gold that never faced a baseline
  # cannot enter the group whose number the mini-bench measured.
  #   - `contract` (10, NON-SCORING anchors): the class file, the concern that declares the
  #     lookup entry points, and eight files that make up the outside-identifier resolution
  #     path. These are step 1's targets. Both arms reach them and they do NOT score; they
  #     are here so step 1's cost is charged without step 1 handing anything to step 2, and
  #     so no file step 1 leads to can be cashed in the scored group.
  #   - `dependents` (20, THE DISCRIMINATOR): one row per FILE, across 15 distinct
  #     directories. Not one of them is on the resolution path step 1 traces, and not one
  #     takes its dependency through the concern's lookup entry points (`find_local`,
  #     `find_remote`, `representative`) - every file that does is in the `contract` group
  #     above. Every row appears in the shown blast payload quoted in the header, and every
  #     line below was opened and read by hand.
  # Stated plainly, so no later cycle has to rediscover it: all 20 files contain the literal
  # token `Account`, and one `grep -rn` returns all 20 paths with line numbers. That is
  # forced - plan step 3 requires gold to come from the shown payload, and the payload is a
  # token-occurrence set - and cycle 8 measured that curating for darkness does not help
  # anyway. The discriminator this draft rests on is the enclosing routine, which grep's
  # output carries for none of the 20.
  - {id: contract-model, group: contract, match: [app/models/account.rb], relation: "app/models/account.rb:65 `class Account < ApplicationRecord` - the contract under rework; line 97 `include Account::FinderConcern` is where the lookup surface is mixed in"}
  - {id: 'c:finder-concern', group: contract, match: [app/models/concerns/account/finder_concern.rb], relation: "app/models/concerns/account/finder_concern.rb:27 `def find_remote(username, domain)` - the class-level entry point every outside-identifier lookup bottoms out in"}
  - {id: 'c:resolve-service', group: contract, match: [app/services/resolve_account_service.rb], relation: "app/services/resolve_account_service.rb:27 `@account ||= Account.find_remote(@username, @domain)` - the webfinger resolve path, the obvious front door onto the lookup surface"}
  - {id: 'c:fetch-remote-actor', group: contract, match: [app/services/activitypub/fetch_remote_account_service.rb], relation: "app/services/activitypub/fetch_remote_account_service.rb:7 `return actor if actor.nil? || actor.is_a?(Account)` - remote actor fetching type-tests the fetched object against the class before returning it"}
  - {id: 'c:process-account', group: contract, match: [app/services/activitypub/process_account_service.rb], relation: "app/services/activitypub/process_account_service.rb:21 `def call(username, domain, json, options = {})` - builds or updates the record from a fetched actor document; the network end of the path"}
  - {id: 'c:entity-cache', group: contract, match: [app/lib/entity_cache.rb], relation: "app/lib/entity_cache.rb:15 `Rails.cache.fetch(to_key(:mention, username, domain), expires_in: MAX_EXPIRATION) { Account.select(:id, :username, :domain, :url).find_remote(username, domain) }` - the cache that short-circuits the lookup for mentions"}
  - {id: 'c:tag-manager-uris', group: contract, match: [app/lib/activitypub/tag_manager.rb], relation: "app/lib/activitypub/tag_manager.rb:260 `Account.local.with_username(usernames).or(Account.local.where(id: ids))` - translates a batch of federation URIs back into local records"}
  - {id: 'c:activity-from-uri', group: contract, match: [app/lib/activitypub/activity.rb], relation: "app/lib/activitypub/activity.rb:75 `ActivityPub::TagManager.instance.uri_to_resource(uri, Account)` - inbound activity handling hands the class itself in as the resource type to resolve to"}
  - {id: 'c:json-ld-helper', group: contract, match: [app/helpers/json_ld_helper.rb], relation: "app/helpers/json_ld_helper.rb:233 `on_behalf_of ||= Account.representative` - unsigned fetches fall back to the instance representative record to sign with"}
  - {id: 'c:account-owned-concern', group: contract, match: [app/controllers/concerns/account_owned_concern.rb], relation: "app/controllers/concerns/account_owned_concern.rb:21 `@account = username_param.present? ? Account.find_local!(username_param) : Account.local.find(account_id_param)` - the controller concern that resolves a route parameter to the record"}
  - {id: 'd:admin-audit-scope', group: dependents, match: [app/controllers/admin/action_logs_controller.rb], relation: "app/controllers/admin/action_logs_controller.rb:9 `@auditable_accounts = Account.auditable.select(:id, :username).order(username: :asc)` - inside `Admin::ActionLogsController#index`, whose job is rendering the audit log; it touches the class only to populate the filter dropdown"}
  - {id: 'd:admin-set-user', group: dependents, match: [app/controllers/admin/base_controller.rb], relation: "app/controllers/admin/base_controller.rb:21 `@user = Account.find(params[:account_id]).user || raise(ActiveRecord::RecordNotFound)` - inside `Admin::BaseController#set_user`, whose job is loading a USER for the admin area; it goes through the account record to get there"}
  - {id: 'd:followers-sync-prefix', group: dependents, match: [app/controllers/activitypub/followers_synchronizations_controller.rb], relation: "app/controllers/activitypub/followers_synchronizations_controller.rb:20 `signed_request_account.uri[Account::URL_PREFIX_RE]` - inside `#uri_prefix`, whose job is partitioning a follower collection for synchronisation; it reads a constant off the class to slice the URI"}
  - {id: 'd:inbox-unknown-actor', group: dependents, match: [app/controllers/activitypub/inboxes_controller.rb], relation: "app/controllers/activitypub/inboxes_controller.rb:30 `... && !Account.exists?(uri: json['actor'])` - inside `#unknown_affected_account?`, whose job is deciding whether to drop an inbound delivery; the class check is the last clause of a five-clause boolean"}
  - {id: 'd:single-user-mode', group: dependents, match: [app/controllers/application_controller.rb], relation: "app/controllers/application_controller.rb:108 `@single_user_mode ||= Rails.configuration.x.single_user_mode && Account.without_internal.exists?` - inside `#single_user_mode?`, whose job is a site-wide layout and routing switch; it settles it with an existence check on a class scope"}
  - {id: 'd:favourited-by-accounts', group: dependents, match: [app/controllers/api/v1/statuses/favourited_by_accounts_controller.rb], relation: "app/controllers/api/v1/statuses/favourited_by_accounts_controller.rb:22 `Account` heading a chain into `.without_suspended.includes(:favourites, :account_stat, :user).references(:favourites)` - inside `#default_accounts`, whose job is paginating one post's favourites"}
  - {id: 'd:reblogged-by-accounts', group: dependents, match: [app/controllers/api/v1/statuses/reblogged_by_accounts_controller.rb], relation: "app/controllers/api/v1/statuses/reblogged_by_accounts_controller.rb:22 `Account.without_suspended.includes(:statuses, :account_stat, :user).references(:statuses)` - inside `#default_accounts`, whose job is paginating one post's reblogs"}
  - {id: 'd:statuses-index-local-votes', group: dependents, match: [app/lib/importer/statuses_index_importer.rb], relation: "app/lib/importer/statuses_index_importer.rb:74 `Poll.joins(:votes).where(votes: { account: Account.local }).select(polls: [:id, :status_id])` - inside `#local_votes_scope`, whose job is deciding which POSTS get reindexed for search; the class scope is the locality filter"}
  - {id: 'd:feed-manager-active', group: dependents, match: [app/lib/feed_manager.rb], relation: "app/lib/feed_manager.rb:21 `Account.joins(:user).merge(User.signed_in_recently).find_each(&block)` - inside `#with_active_accounts`, whose job is home-timeline maintenance; it enumerates the class to decide whose feeds are worth keeping warm"}
  - {id: 'd:extractor-mention-re', group: dependents, match: [app/lib/extractor.rb], relation: "app/lib/extractor.rb:28 `text.scan(Account::MENTION_RE) do |screen_name, _|` - inside `#extract_mentions_or_lists_with_indices`, whose job is parsing text entities; it borrows the class's mention regexp to do it"}
  - {id: 'd:space-usage-avatar-sum', group: dependents, match: [app/lib/admin/metrics/dimension/space_usage_dimension.rb], relation: "app/lib/admin/metrics/dimension/space_usage_dimension.rb:44 `Account.sum(Arel.sql('COALESCE(avatar_file_size, 0) + COALESCE(header_file_size, 0)'))` - inside `#media_size`, whose job is a storage dashboard figure; the class contributes one of six summed terms"}
  - {id: 'd:activity-create-delivered-to', group: dependents, match: [app/lib/activitypub/activity/create.rb], relation: "app/lib/activitypub/activity/create.rb:170 `@delivered_to_account ||= Account.find(@options[:delivered_to_account_id])` - inside `#delivered_to_account`, whose job is inserting a newly created post into the right home feed"}
  - {id: 'd:friends-of-friends', group: dependents, match: [app/models/account_suggestions/friends_of_friends_source.rb], relation: "app/models/account_suggestions/friends_of_friends_source.rb:10 `Account.find_by_sql([<<~SQL.squish, { id: account.id, limit: limit }])` - inside `#source_query`, whose job is ranking follow suggestions; it hangs a thirty-line raw query off the class"}
  - {id: 'd:suggestions-base-scope', group: dependents, match: [app/models/account_suggestions/source.rb], relation: "app/models/account_suggestions/source.rb:13 `Account` heading a chain into `.searchable.where(discoverable: true).without_silenced.without_memorial...` - inside `#base_account_scope`, whose job is the shared eligibility filter every suggestion source starts from"}
  - {id: 'd:action-log-filter', group: dependents, match: [app/models/admin/action_log_filter.rb], relation: "app/models/admin/action_log_filter.rb:114 `account = Account.find_or_initialize_by(id: value)` - inside `#scope_for`, whose job is turning an audit-log filter parameter into a query; it builds an UNSAVED record purely to match a polymorphic target"}
  - {id: 'd:account-batch-form', group: dependents, match: [app/models/form/account_batch.rb], relation: "app/models/form/account_batch.rb:69 `Account.where(id: account_ids)` - inside `#accounts`, whose job is a moderation bulk-action form; it resolves checked ids back to records"}
  - {id: 'd:instance-user-count', group: dependents, match: [app/presenters/instance_presenter.rb], relation: "app/presenters/instance_presenter.rb:54 `User.confirmed.joins(:account).merge(Account.without_suspended).count` - inside `#user_count`, whose job is the public instance profile; it merges a class scope into a User query to get the published figure"}
  - {id: 'd:serializer-decorator-model-name', group: dependents, match: [app/serializers/rest/account_serializer.rb], relation: "app/serializers/rest/account_serializer.rb:29 `Account.model_name` - inside `AccountDecorator.model_name`, a SimpleDelegator class method whose job is keeping serialization keys stable for a moved account"}
  - {id: 'd:note-length-mention-re', group: dependents, match: [app/validators/note_length_validator.rb], relation: "app/validators/note_length_validator.rb:19 `new_text.gsub!(Account::MENTION_RE, '@\\2')` - inside `#countable_text`, whose job is length validation; it strips mentions with the class's regexp before counting graphemes"}
  - {id: 'd:self-destruct-inboxes', group: dependents, match: [app/workers/scheduler/self_destruct_scheduler.rb], relation: "app/workers/scheduler/self_destruct_scheduler.rb:54 `@inboxes ||= Account.inboxes` - inside `#inboxes`, whose job is fanning out shutdown notices; the class scope supplies the delivery targets"}
  - {id: 'w:account-deletion-worker', group: write-path, match: [app/workers/admin/account_deletion_worker.rb], relation: "app/workers/admin/account_deletion_worker.rb:9 `delete_account = Account.find(account_id)`, guarded on line 10 by `return unless delete_account.unavailable?` - inside `Admin::AccountDeletionWorker#perform`; teardown is handed off asynchronously (`sidekiq_options queue: 'pull', lock: :until_executed` on line 6) and is passed only an id, so it re-looks-up the record"}
  - {id: 'w:unsuspension-worker', group: write-path, match: [app/workers/admin/unsuspension_worker.rb], relation: "app/workers/admin/unsuspension_worker.rb:9 `UnsuspendAccountService.new.call(Account.find(account_id))` - inside `Admin::UnsuspensionWorker#perform`; the reverse of teardown, also deferred to the pull queue and also id-in / record-out"}
  - {id: 'w:merge-worker', group: write-path, match: [app/workers/merge_worker.rb], relation: "app/workers/merge_worker.rb:10 `@from_account = Account.find(from_account_id)` inside `MergeWorker#perform`, with the destination resolved at line 27 inside `#merge_into_home!` - folding one record's material into another's feeds, run in the background against the primary"}
  - {id: 'w:update-distribution', group: write-path, match: [app/workers/activitypub/update_distribution_worker.rb], relation: "app/workers/activitypub/update_distribution_worker.rb:12 `@account = Account.find(account_id)` - inside `ActivityPub::UpdateDistributionWorker#perform`; what runs around an update, telling other servers the record changed, debounced (line 4) and deferred to the push queue"}
  - {id: 'g:signature-verification', group: guards, match: [app/controllers/concerns/signature_verification.rb], relation: "app/controllers/concerns/signature_verification.rb:48 `signed_request_actor.is_a?(Account) ? signed_request_actor : nil` - inside `SignatureVerification#signed_request_account`; the kind-check that turns a verified signer into nil rather than handing a non-person on to the caller"}
  - {id: 'g:interactions-following', group: guards, match: [app/models/concerns/account/interactions.rb], relation: "app/models/concerns/account/interactions.rb:123 `other_id = other_account.is_a?(Account) ? other_account.id : other_account` - inside `Account::Interactions#following?`; the relationship check accepts either a record or a bare id and normalises before touching the preloaded relation"}
  - {id: 'g:authorize-interactions', group: guards, match: [app/controllers/authorize_interactions_controller.rb], relation: "app/controllers/authorize_interactions_controller.rb:11 `when Account` - inside `AuthorizeInteractionsController#show`, dispatching on what the looked-up resource turned out to be; line 27 rescues a missing one into `not_found` instead of an error"}
  - {id: 'g:account-approval', group: guards, match: [app/controllers/api/v1/accounts_controller.rb], relation: "app/controllers/api/v1/accounts_controller.rb:95 `raise(ActiveRecord::RecordNotFound) if @account.local? && @account.user_pending?` - inside `Api::V1::AccountsController#check_account_approval`; the record exists and is still refused, because it is not cleared yet"}

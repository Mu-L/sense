name: Mastodon work session - audit the account-record contract before a rework
repo: mastodon
contract_symbol: Account
contract_file: app/models/account.rb
# SEVEN-STEP WORK SESSION (plans/03-expand.md), CYCLE 10 - expanded from the two-step
# probe after its mini-bench returned PROCEED. The probe scenario is kept byte-for-byte at
# scenarios/mastodon.yaml.probe-2step.bak (md5 ac1e88b09fcbec13d9497de1f7eee388).
#
# ------------------------------------------------------------------------------------
# THE MINI-BENCH THAT AUTHORISED THIS EXPANSION - quoted from
# results/loop/mastodon/minibench.md, both arms, once, at the real wall, unscored
# ------------------------------------------------------------------------------------
#   group        baseline (per run)   sense (per run)   delta
#   contract     9/10, 10/10          10/10, 10/10      +0.05
#   dependents   4/20, 5/20           14/20, 20/20      +0.62   <== the discriminator
#   overall cited-recall  baseline mean 0.47  |  sense mean 0.90  delta +0.43
# Baseline `dependents` = 0.225, at or below the 0.50 ceiling; delta = 0.85 - 0.225 =
# +0.625, at or above the +0.50 bar. Both window conditions hold. Baseline run-2 hit its
# hard cap (wall 401 of 400, exit 124) and still scored 5/20; both sense runs exited 0 with
# 120s+ of wall unspent. That run is x1-per-question and unscored: it decided that this
# question is expanded, and nothing else.
#
# WHAT THE EXPANSION MAY NOT MOVE, and did not: step 4's name, prompt and checks are the
# probe's step 2 byte-for-byte, and the `dependents` group is unchanged - same 20 rows,
# same lines, same relations. Diff against the .bak above to confirm. Everything added is
# a NON-SCORING group: `write-path` (step 3) and `guards` (step 5).
#
# WHY THERE IS NO `specs` GROUP, though the plan lists one: laws.md, A GOLD ROW MUST BE
# CITEABLE IN THE FORM THE ASK DEMANDS - the banked Status control's two spec rows scored
# "mentioned 2/2 in 8 of 10 runs, cited 0/2 in 10 of 10", both arms, both models, because
# step 7 asks for specs to ADD and an artifact that does not exist yet has no line to cite.
# Step 7 still asks for the tests; they are not golded. `guards` replaces it: every guard
# row below is an existing line a run can pin.
#
# Single-prompt session bench (bench/drivers/bench-sense-local.sh): every step is presented
# in ONE prompt and worked in order. Rendered to the agent: the description + each step's
# name and prompt ONLY (checks and gold are NEVER shown). Everything rendered is kept
# NEUTRAL - it states the task, never the answer's shape, file paths, class or method
# names, counts, or which tool to reach for.
#
# ------------------------------------------------------------------------------------
# THE TRAJECTORY, EVERY CYCLE, AND WHICH SIDE OF THE WINDOW IT FELL ON
# ------------------------------------------------------------------------------------
# The window is BOTH conditions at once: baseline `dependents` at or below 0.50 AND sense
# at least +0.50 above it. FAR = the baseline cleared the question itself. NEAR = the
# baseline was held under 0.50 and our arm failed to open a gap.
#
#   cycle 1  mastodon.yaml.class-call-sites.bak   base 0.8125  sense 1.0000  d +0.1875  FAR
#   cycle 2  mastodon.yaml.line-not-file.bak      base 0.158   sense 0.158   d  0.000   NEAR
#            (baseline half CLEARED at 3 of 19; the sense arm never called blast on the
#            class - step 1 anchored it on five finder method names and it never came back up)
#   cycle 3  mastodon.yaml.table-altitude.bak     base 0.091   sense 0.091   d  0.000   NEAR
#            (baseline half CLEARED at 2 of 22; both arms audited the accounts TABLE,
#            because the description said "stored" and "rows in")
#   cycle 4  mastodon.yaml.names-the-class.bak    base 1.000   sense 1.000   d  0.000   FAR
#   cycle 5  mastodon.yaml.not-the-call-form.bak  base 1.000   sense 1.000   d  0.000   FAR
#   cycle 6  (author phase, `Account#local?`)     no run                                n/a
#            NO-ANCHOR reached from a per-row grep census - a screen used as a gate, which
#            laws.md forbids in any form. It decided nothing and is not counted.
#   cycle 7  mastodon.yaml.line-pin-no-shape.bak  base 1.000   sense 1.000   d  0.000   FAR
#   cycle 8  mastodon.yaml.inherited-helpers.bak  base 1.000   sense 1.000   d  0.000   FAR
#            (the ANCHOR MOVE: `Account` retired for `ApplicationController`, gold 19 of 19
#            token-DARK files. The baseline read the base file once, printed the inherited
#            helper names, grepped those, took 19 of 19 in 21 calls.)
#   cycle 9  mastodon.yaml.assembly-map.bak       base 1.000   sense 0.9375  d -0.0625  FAR
#            (the EXPENSIVE STEP 1: a seventeen-file assembly map. The baseline hit its hard
#            cap - wall 242 of 242, exit 124 - and still had 16 of 16, from ONE
#            `grep -rn '\bAccount\b'` spooled to a file and sliced by directory prefix.)
#
# Two NEAR, seven FAR. WHICH SIDE THIS DRAFT CORRECTS FROM: the FAR side, and by a full
# 0.50. Intended landing: baseline at or below ~0.45, sense at or above ~0.95.
#
# ------------------------------------------------------------------------------------
# WHAT THE NINE CYCLES HAVE ALREADY CLOSED - do not re-run these levers
# ------------------------------------------------------------------------------------
#  a. REWORDING THE MECHANISM. Named, withheld, re-named: cycles 4, 5 and 7 measured
#     1.000, 1.000, 1.000. Withholding the call shapes cost the baseline four extra Bash
#     calls and bought zero rows (cycle 7's own report).
#  b. TOKEN-DARK GOLD. Cycle 8 built the strongest possible version - 19 of 19 gold files
#     with ZERO occurrences of the anchor's name - and the baseline took all 19.
#  c. MOVING THE ANCHOR. Also cycle 8. Same number, 1.000.
#  d. PINNING THE LINE RATHER THAN THE FILE. Closed by the scorer, not by a run.
#     `bench/lib/gold.py:_cited` credits a gold path followed by ANY line number; the
#     specific line is never compared to gold's. "Which LINE, not which file" (cycle 7's
#     whole thesis) is not a thing the metric can see.
#  e. RAISING THE COST OF STEP 1. Cycle 9. The baseline ran out of wall and still had
#     every row, because one grep answers the whole group whenever it is run.
#  f. CURATING FOR DISTANCE FROM THE DENSE AREAS. Also cycle 9: 16 rows drawn only from
#     areas the blast payload reports at one or two callers. The baseline's route does not
#     walk areas in density order; it slices one spooled grep by directory prefix, so
#     sparse areas cost it nothing.
#
# ------------------------------------------------------------------------------------
# THE STRUCTURAL FACT THIS DRAFT IS BUILT AGAINST - quoted, not estimated
# ------------------------------------------------------------------------------------
# Three things are true at once and together they explain all seven FAR cycles:
#
#   1. Every `direct_callers` entry in the shown blast payload for this anchor carries
#      `"relation":"calls Account"`, and `affected_via_composition`, `affected_via_includes`
#      and `affected_subclasses` are all `[]`. So the shown payload IS a token-occurrence
#      set, and plan step 3 requires every gold row to come from it. Gold on this anchor
#      is therefore a subset of the token occurrences by construction. It cannot be dark.
#   2. `bench/lib/scorer.py` dropped gold_f1: recall only. Over-citing costs nothing.
#   3. `gold.py:_cited` needs a gold path plus any line number. `grep -rn` prints exactly
#      that.
#
# So the baseline's terminal route - one repo-wide grep, spooled, sliced, cited straight
# out of grep's own output, zero to three Reads per run in every cycle measured - is a
# superset of any gold this plan permits on this anchor, and it is free.
#
# The one thing that route never produces is stated below. This draft asks for that and
# nothing else.
#
# ------------------------------------------------------------------------------------
# THE AXIS
# ------------------------------------------------------------------------------------
# WHAT THE ANSWER IS, THAT IS NOT A LIST OF THE PLACES A NAME APPEARS:
#   for each dependent, the ENCLOSING ROUTINE the dependency sits inside - the method, or
#   the class-body position, that owns the line and whose behaviour actually changes. A
#   search prints the matching line, its path and its number; it never prints the
#   definition that encloses the match. To name the enclosing routine you have to open the
#   file and read upward, or ask something that already holds the structure.
#
# That is a real asymmetry in this instrument's payload, not a wording trick. Quoted from
# the mcp_probe output recorded under SEAM PROFILE below, the shown blast set gives the
# enclosing routine on every row, for free:
#     {"symbol":"Admin::BaseController#set_user","file":"app/controllers/admin/base_controller.rb", ...}
#     {"symbol":"Importer::StatusesIndexImporter#local_votes_scope", ...}
#     {"symbol":"REST::AccountSerializer::AccountDecorator.model_name", ...}
# and `grep -rn '\bAccount\b'` gives, for the same three rows:
#     app/controllers/admin/base_controller.rb:21:      @user = Account.find(params[:account_id]).user || ...
#     app/lib/importer/statuses_index_importer.rb:74:    Poll.joins(:votes).where(votes: { account: Account.local })...
#     app/serializers/rest/account_serializer.rb:29:        Account.model_name
# Not one of the three grep lines contains the name of the routine it is inside.
#
# THE MECHANISM SENTENCE, which the next phase measures: a dependent reaches the record
# class once, in the middle of doing some other job, from inside a routine whose own name
# is about that other job and never about the record - so the line that takes the
# dependency and the routine that owns it are about two different subjects, and the line
# alone does not say whose behaviour changes when the contract moves.
#
# THE SECOND LEVER, carried over because it is the only one with a measured NEAR: step 1
# points the arm at ONE narrow sub-surface of the contract - how the record is looked up
# and resolved when the system holds only an external identifier for it. Cycles 2 and 3
# are the only two runs in which the baseline finished under 0.50, and both had a step 1
# that left the arm holding a narrower subject than the audit needed. Both then failed on
# the SENSE side, for causes that are named and fixed here:
#   - cycle 2: the sense arm never blasted the class. Fixed by step 2 naming the record
#     class as a whole, explicitly and as a single subject, rather than a method surface.
#   - cycle 3: both arms read "stored" / "rows in" as the database table. Fixed by cutting
#     every storage word from the description; nothing here says stored, row, table or
#     column.
# Every file step 1 leads to is in the NON-SCORING `contract` group, so step 1's own
# targets cannot be cashed in step 2.
#
# THE HONEST RISK, stated before the run, per QUOTE IT OR YOU HAVE NOT VERIFIED IT:
# the scorer cannot enforce the enclosing-routine demand. `_cited` credits path plus any
# line number, so an arm that dumps grep output and omits every routine name still scores
# the row. The bet is behavioural - that an arm told a bare file:line does not count will
# produce the subset it actually opened rather than a spooled grep - and it is a bet, not
# a measured effect. Only the judge's map_quality and justification see the demand
# directly. If the next run comes back at baseline 1.00 with a transcript showing zero
# Reads again, this lever is spent, and the honest reading is that this plan's constraints
# (gold must come from a payload that is a token-occurrence set; recall-only scoring)
# cannot open a window on this anchor - which is a routed lever for the human, not a kill
# this phase may make.
#
# ------------------------------------------------------------------------------------
# SEAM PROFILE - recorded, never a gate
# ------------------------------------------------------------------------------------
#   python3 bench/lib/seam_hunt.py $CLONE Account --propose
#     app caller files : 0   SCATTER (dirs) : 0
#     GREP-NOISE       : 'Account' in 257 app files   PRECISION=0.00
#     VERDICT          : colocated(0dir) + GREP-NOISY + RESOLVER-GAP?
#   The 0.00 is a resolver gap in seam_hunt's caller query for a Ruby class, not darkness:
#   the MCP blast on the same symbol returns 200 direct callers over 30 areas. PRECISION is
#   therefore UNUSABLE as a rank on this anchor; it is recorded, not relied on. The two
#   profiled alternates: ApplicationRecord PRECISION=0.11 (14 caller files, 8 dirs, 125
#   grep files) and TagManager PRECISION=0.00 (same resolver gap, 141 grep files).
#   ApplicationRecord yields 14 files, barely over the twelve-row floor, and every one of
#   its rows writes the token too; it is not an improvement, and the anchor is kept per
#   ITERATE ON THE QUESTION, KEEP THE ANCHOR.
#
#   python3 bench/lib/mcp_probe.py $CLONE '[{"name":"sense_blast","arguments":
#     {"symbol":"Account","file":"app/models/account.rb"}}]'
#     "risk":"high","risk_factors":["200 direct callers"]
#     "affected_symbols":336,"affected_files":61,"production_affected":60,"test_affected":4
#     "direct_callers_by_area": 30 areas
#     "affected_subclasses":[],"affected_via_composition":[],"affected_via_includes":[]
#   All 20 `dependents` rows below appear in that shown payload. Checked one by one.
#
#   python3 bench/lib/ring_sweep.py $CLONE --top 12
#     0 candidate(s) above the bar - all twelve anchors at rows 0, files 0, vias 0.
#   The ring is EMPTY, so the "what HOLDS X" kind is off the menu on this repo, as laws.md
#   records for both Ruby repos swept. This is KIND ONE in its shape - an occurrence-list
#   question - and the sentence under THE AXIS says what its ANSWER is that the occurrence
#   list does not contain.
#
#   python3 bench/lib/inverse_frequency.py mastodon .../claude-opus-5/validation
#   ranks the BANKED `Status` scenario (sha256:f576efebe028db23, 23 rows, `status-model` as
#   its contract row), NOT this one. No run on disk has ever scored the row set below under
#   this question, so the free / hard / discriminating classification has nothing to say
#   here, and no row below was cut or kept on its authority. Recorded so the next cycle does
#   not mistake that ranking for evidence about these rows.
#
#   MEMORIZATION: python3 bench/lib/memorization_probe.py $CLONE Account
#     closed-book recall 0.323 (30 of 93 members named), samples 0.28 / 0.29 / 0.323
#     hits: USERNAME_RE, MENTION_RE, URL_PREFIX_RE, INSTANCE_ACTOR_ID, NOTE_LENGTH_LIMIT,
#           acct, inboxes, dormant, from_text, keypair, ...
#   What comes back recited is the contract's own MEMBER NAMES. The probe named no dependent
#   file, and no file:line for anything; no gold row below is a member of the class - every
#   one is a third-party file citing it. Per MEMORIZATION IS A GOLD-TIME CONSTRAINT a famous
#   repo is not disqualified and no row here is recited. Noted as a live risk on the two
#   rows whose credit is a recited constant (`Account::MENTION_RE`, `Account::URL_PREFIX_RE`):
#   the constant NAME is free to both arms; the enclosing routine is not.
description: |
  You are a maintainer about to rework the class that represents a person on this
  service - the one every other part of the codebase reaches for when it needs to know
  who someone is, whether they are here or on another server. The rework will change what
  that class hands back to the code that asks it questions. Before you touch it you have
  to know how the rest of the system gets hold of one of these when all it has is an
  identifier from outside, how one is built and taken apart again, what confirms it is a
  real and current one before work runs against it, and everywhere else in the codebase
  that would have to change with it. Work through the tasks below one at a time; each
  builds on what you learned in the previous one, and the budget the earlier ones cost you
  is the budget the later ones have left. Throughout, an answer that points at a place must
  say which routine that place is inside, and give an exact file:line a teammate could jump
  straight to, plus one phrase on why it matters. A bare filename does not count, a
  file:line with no routine named around it does not count, and a missed dependent is a
  regression shipped.
steps:
  - name: Orient in the codebase
    prompt: "Task: orient yourself. In a few sentences plus file:line references, what is this project, how is the code organized, and where does the record that stands for a person sit - the one the rest of the system keeps having to ask about - along with the shared pieces its behaviour is assembled from? Hand the next agent a map so they can act with small, targeted lookups, not a fresh exploration of the codebase. No Explore agents. "
    checks:
      - type: response_richness
        value: '3'
        required: true
        description: Project shape and the record's place in it, with paths
      - type: mcp_tool_used
        value: sense_search
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_conventions
        required: false
        layer: adoption
  - name: Map the account-record contract
    prompt: "Task: orient, and be thorough - the rest of the ticket is built on this. Start with the one part of this class's job that the whole federation side leans on: getting hold of one of these records when all the system has is an identifier that arrived from outside, in whatever form the outside world happened to send it. Trace that path end to end. Show every entry point that turns an outside identifier into one of these records, every place along the path that caches or short-circuits it, every place it goes out to the network to build a record it did not have, and every place it hands something else back because the identifier turned out not to be a person at all. For each one give the file:line, the name of the routine it lives in, and one phrase on what it contributes to that path. Then say, in a few sentences, what a rework would have to preserve for that path to keep working. A place named without the routine it lives in does not count, and neither does a routine named without the file:line where it is defined. "
    checks:
      - type: response_richness
        value: '8'
        required: true
        description: Resolution path traced through the routines that make it up, each located
      - type: mcp_tool_used
        value: sense_graph
        required: false
        layer: adoption
  - name: Trace how one of these records is built up and taken apart
    prompt: "Task: trace the lifecycle. Follow one of these records from the point where the system decides it needs one it does not have yet, through it being brought into existence and later updated, and on to the point where it is put beyond use again - withdrawn, wound down, or folded into another one - and say what runs around each of those moments. For every layer give the file:line and the name of the routine it lives in, and mark which parts run inline, in the request that triggered them, and which are handed off to run later in the background. Where something is handed off, say what it is handed the record by - the record itself, or something it can be looked up from again - because that is what a rework of the contract has to keep working. "
    checks:
      - type: response_richness
        value: '4'
        required: true
        description: Lifecycle traced through its routines, inline vs deferred marked
      - type: mcp_tool_used
        value: sense_graph
        required: false
        layer: adoption
  - name: Audit every dependent of the account-record contract
    prompt: "Task: this is the core of the ticket, and you are working it with the budget the first part already cost you. Widen back out from that one path to the class as a whole, as a single subject, and find EVERY place in the codebase that would have to change with it, so the rework cannot silently break one. Be exhaustive and group them by area. Most of what you are looking for is not doing this class's job at all: it is in the middle of some other job entirely, it reaches for this class exactly once to settle a question that other job needs answered, and the routine it does that from is named after the other job and never after this one. So the answer you owe is not where the dependency sits but WHOSE behaviour changes: for every dependent, name the routine the dependency is inside, give its file:line, and say in one phrase what that routine would start getting wrong if the class stopped handing back what it hands back today. A file:line with no routine named around it does not count, a routine you cannot state the consequence for does not count, and a missed dependent is a regression shipped. "
    checks:
      - type: response_richness
        value: '6'
        required: true
        description: Dependents attributed to the enclosing routine, with the consequence named
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption
  - name: Trace the guards that confirm a real, current record
    prompt: "Task: work runs against one of these records all over the codebase, and some of what it is handed is not one at all, or is one that is no longer usable. Trace how the code satisfies itself, before it acts, that what it holds really is one of these and is still a current one: where the incoming thing is checked for being the right kind of thing at all, where a missing one is turned into a refusal rather than an error further down, and where one that exists but has been withdrawn or is not yet cleared is stopped from being acted on. Give the file:line and the enclosing routine for each guard, and say in one phrase what it is protecting the caller from. "
    checks:
      - type: response_richness
        value: '3'
        required: true
        description: Guards located at their routines, with what each protects against
      - type: mcp_tool_used
        value: sense_graph
        required: false
        layer: adoption
  - name: Assess the blast radius of the contract change
    prompt: "Task: you are about to change what this class hands back. Assess the full blast radius across everything you have found: which dependents are at risk, which are most likely to break, and what must be re-verified afterwards. Rank by risk and say what drives the ranking - separate the ones that would fail loudly and immediately from the ones that would keep running and quietly return something different, which are the expensive ones. Use file:line throughout and name the routine that carries each risk, not just the file it is in. A missed high-risk dependent is the one that pages someone. "
    checks:
      - type: response_richness
        value: '6'
        required: true
        description: Dependents ranked by risk at their routines, not relisted
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption
  - name: Produce the change + verification map
    prompt: "Task: produce the complete map for landing this safely: the pieces of the contract itself you will edit, every dependent that has to be reviewed or touched grouped by area, and the tests that would have to be updated or added to cover the behaviour that moves. Use file:line and the enclosing routine throughout, so a teammate could land the change from your map alone without re-exploring the codebase. "
    checks:
      - type: response_richness
        value: '6'
        required: true
        description: An actionable map - edits, dependents by area, and the test surface
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption
scoring:
  weights:
    correctness: 0.70
    efficiency: 0.30

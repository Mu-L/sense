  - {id: 'd:assignment-endpoint', group: dependents, match: [app/controllers/api/v1/accounts/conversations/assignments_controller.rb], relation: "app/controllers/api/v1/accounts/conversations/assignments_controller.rb:16 `resource = Conversations::AssignmentService.new(` - inside `#set_agent`; `@conversation` arrives from a parent controller's before_action and the whole assignment write happens one link down, inside the service. Payload row: {via Conversations::AssignmentService, hops 2}"}
  - {id: 'd:captain-search', group: dependents, match: [enterprise/app/services/captain/tools/copilot/search_conversations_service.rb], relation: "enterprise/app/services/captain/tools/copilot/search_conversations_service.rb:52 `Conversations::PermissionFilterService.new(` - inside `#permissible_conversations`, the assistant tool's own hand-off to the same access-decision link from a third tree; `#get_conversations` at :35 starts from whatever the service hands back and narrows it further"}

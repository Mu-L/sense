  - {id: 'd:instagram-builder', group: dependents, match: [app/builders/messages/instagram/base_message_builder.rb], relation: "app/builders/messages/instagram/base_message_builder.rb:60 `@conversation ||= set_conversation_based_on_inbox_config` - inside `#conversation`; the chain runs :60 -> `#set_conversation_based_on_inbox_config` at :63 -> `#find_conversation_scope` at :71 or `#build_conversation`, and only the last link queries the record. Payload row: {via #set_conversation_based_on_inbox_config, hops 3}"}
  - {id: 'd:messenger-scope-override', group: dependents, match: [app/builders/messages/instagram/messenger/message_builder.rb], relation: "app/builders/messages/instagram/messenger/message_builder.rb:25 `def find_conversation_scope` - the subclass hook the parent's `#set_conversation_based_on_inbox_config` calls; the Messenger variant narrows the match to instagram_direct_message threads at :27, so the parent's behaviour changes here without the parent naming this file"}

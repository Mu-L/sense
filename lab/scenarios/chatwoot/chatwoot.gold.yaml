  - {id: 'd:enterprise-update-params', group: dependents, match: [enterprise/app/controllers/enterprise/api/v1/accounts/conversations_controller.rb], relation: "enterprise/app/controllers/enterprise/api/v1/accounts/conversations_controller.rb:19 `super.merge(params.permit(:sla_policy_id))` - inside `#permitted_update_params` of a module folded into the dashboard controller; the write itself is `super`'s, one link down, and this line widens what may be written without touching the record"}

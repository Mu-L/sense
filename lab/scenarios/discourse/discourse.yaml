#      in its blast payload and did not carry them into the answer at path:line."
#
#   So: the ANCHOR is kept, the GOLD SET is kept unchanged, and STEP 2's closing paragraph
#   is rewritten. Everything before that paragraph - the mechanism sentence that makes this
#   the periphery question rather than a call-site question - is cycle 4's and cycle 7's
#   wording verbatim, because it is the part that measured 0.3333 against the plain arm
#   twice and must not be disturbed.
#
#   What changes: the answer must be CLOSED over the set the arm assembled, not covered
#   against the contract. The arm assembles its candidates first, works them in the order it
#   assembled them, pins each before moving on, and reconciles at the end - how many it
#   assembled against how many it pinned, naming any difference at file:line. A candidate
#   it rules out still costs a file:line and a clause, so dropping is more expensive than
#   keeping. Cycle 7's step 2 already carried a per-area anti-summary clause ("treat an area
#   as finished only when every dependent inside it is listed separately"); it did not fire,
#   because the three dropped rows were the TAIL of a long payload rather than a
#   half-finished area. Closure is scored over the whole set, not per area.
#
#   Intended landing: baseline unchanged at or near 4/12 = 0.33, ours from 9/12 to 11-12/12,
#   delta +0.58 to +0.67. The arithmetic of a partial fix is stated too, because it is what
#   makes this a small correction and not a gamble: recovering ONE of the three dropped rows
#   gives 10/12 and lands the delta on +0.5000 exactly; TWO gives +0.5833; three gives
#   +0.6667. Every partial outcome except zero clears the bar.
#
# WHICH ROWS THE BASELINE HAS MISSED CONSISTENTLY, AND WHICH IT WAS GIFTED
#   Two independent rankings, both quoted, both scoped to the headline model.
#
#   (a) The cycle-4/validation gold, thirteen runs (baseline x1, sense x12):
#
#     python3 bench/lib/inverse_frequency.py discourse \
#       verticals/ruby-rails/results/claude-opus-5/validation
#
#     row                              group        overall  baseline   sense
#     d:search-rake                    dependents     6/13       0/1     6/12
#     d:templates-rake                 dependents     6/13       0/1     6/12
#     d:bulk-import-merger             dependents     8/13       0/1     8/12
#     d:import-scripts-base            dependents     8/13       0/1     8/12
#     d:migrations-importer-categories dependents     9/13       0/1     9/12
#     d:migrations-optimizer           dependents     9/13       0/1     9/12
#     d:slack-migration                dependents     9/13       1/1     8/12
#     ... every other row              -             10/13       1/1     9/12
#     never cited by any arm : 0      cited by every run : 0
#
#   (b) THIS gold set, as measured by cycle 7 (baseline x1, sense x1):
#
#     python3 bench/lib/inverse_frequency.py discourse "$RDIR"      # sha f4283b9e2d348040
#
#     d:migrations-optimizer           dependents     0/2        0/1     0/1
#     d:slack-migration                dependents     0/2        0/1     0/1
#     d:templates-rake                 dependents     0/2        0/1     0/1
#     d:bulk-import-merger             dependents     1/2        0/1     1/1
#     d:import-scripts-base            dependents     1/2        0/1     1/1
#     d:migrations-importer-categories dependents     1/2        0/1     1/1
#     d:search-rake                    dependents     1/2        0/1     1/1
#     d:templates-topic-query          dependents     1/2        0/1     1/1
#     d:data-explorer-parameter        dependents     2/2        1/1     1/1
#     d:narrative-bot                  dependents     2/2        1/1     1/1
#     d:reindex-search-job             dependents     2/2        1/1     1/1
#     d:semantic-categorizer           dependents     2/2        1/1     1/1
#
#   Read the two together, which is the point of quoting both:
#   - Eight rows have never been cited by any baseline run on either gold set. They are the
#     discriminator and they are all kept.
#   - The three rows sitting at sense 0/1 in (b) are NOT unreachable. Ranking (a) puts them
#     at sense 6/12, 8/12 and 9/12 on twelve runs of the seven-step form, so they are
#     material the arm reaches routinely and dropped once here. That is the tail-truncation
#     this draft's step 2 attacks, and it is why no row is cut for being unreached.
#   - `d:reindex-search-job` is the one row a baseline has taken on BOTH gold sets (1/1 and
#     1/1). It is the closest thing here to a free row and it is the first candidate for a
#     cut - but the plan floors `dependents` at twelve, the shown blast payload holds no
#     unused file in the trees no baseline route searches (see below), and cutting it would

#
# WHICH SIDE THIS DRAFT CORRECTS FROM, AND HOW FAR IT INTENDS TO MOVE
#   From SENSE TOO LOW, by 0.0833. That is a much smaller correction than cycles 5 and 6
#   needed, and it is aimed at a single named failure rather than at the shape of the
#   question, so the move is deliberately SMALL. The baseline half is left alone: at 0.3333
#   it is comfortably inside the window with 0.6667 of headroom, and every attempt this loop
#   has made to push it lower (cycles 5, 6) cost our own arm more than it cost the plain arm.
#
#   The diagnosis on disk is unusually clean and it is quoted rather than reconstructed
#   (results/loop/discourse/minibench.md, "What the next question must defeat"):
#
#     "The lever here is not the baseline and not the anchor. Both diagnostics that would
#      normally route a rewrite came back clean: the baseline sits at 0.3333 with a
#      laborious 18-search route, and `sense_blast` returned every one of the three missed

# The gold group carrying the margin: its delta is the headline number.
# Named explicitly here because it used to be a convention held in prose.
discriminator: dependents
rows:
  # Each target carries `relation`: the TRUE way it reaches the Relation contract,
  # verified from rails source. `relation` is the reference the reference-aware
  # relationship audit (lib/relationship_audit.py) scores an answer against — it is
  # NEVER rendered to the agent (only name/prompt are; see header). It lets the judge
  # mark, per dependent, both covered (named?) and related (correct relation stated?),
  # so a confident-but-incomplete answer can no longer read as complete.
  # the contract itself + the query-interface modules a change must reckon with (all
  # in the ls-able relation/ subdir; both arms reach these — non-discriminator anchor)
  - {id: relation-model, group: contract, match: [active_record/relation.rb], relation: "the ActiveRecord::Relation object itself — the contract under change"}
  - {id: query-methods, group: contract, match: [relation/query_methods.rb], relation: "QueryMethods builds the where/joins/select clauses mixed into Relation"}
  - {id: finder-methods, group: contract, match: [relation/finder_methods.rb], relation: "FinderMethods (find/first/last/exists?) runs against the Relation"}
  - {id: spawn-methods, group: contract, match: [relation/spawn_methods.rb], relation: "SpawnMethods#spawn/merge clone a Relation when it is chained"}
  - {id: delegation, group: contract, match: [relation/delegation.rb], relation: "Delegation generates the class-specific Relation methods and delegates to the model class"}
  # NON-DISCRIMINATOR context: dependents that reach Relation through its well-known
  # PUBLIC surface (a `=== Relation` test, collection_cache_key, signed-id finders,
  # named scopes, the Enumerable#pick mirror, the rails query renderer). A frontier
  # model has these memorized from training, so BOTH arms cite them — they do not
  # separate. Kept as honest context, not as the discriminator.
  - {id: 'ctx:sanitization', group: context, match: [active_record/sanitization.rb], relation: "replace_bind_variable case-tests `ActiveRecord::Relation === value` to inline a relation's SQL as a bind value"}
  - {id: 'ctx:integration', group: context, match: [active_record/integration.rb], relation: "collection_cache_key computes a cache key/version over a Relation (`all`)"}
  - {id: 'ctx:encryption-queries', group: context, match: [encryption/extended_deterministic_queries.rb], relation: "intercepts Relation query building to rewrite where-values for encrypted deterministic columns"}
  - {id: 'ctx:signed-id', group: context, match: [active_record/signed_id.rb], relation: "RelationMethods extends Relation with find_signed / find_signed! finders"}
  - {id: 'ctx:scoping-named', group: context, match: [scoping/named.rb], relation: "named scopes are class methods that return a Relation"}
  - {id: 'ctx:enumerable-coreext', group: context, match: [core_ext/enumerable.rb], relation: "CROSS-GEM (ActiveSupport): Enumerable#pick mirrors Relation#pick"}
  - {id: 'ctx:query-command', group: context, match: [commands/query/query_command.rb], relation: "CROSS-GEM (Railties): the rails query command renders a Relation result as a table"}
  # THE DISCRIMINATOR (`dependents`): dependents that BUILD a relation and never name
  # it — `klass.unscoped`, `self.scope`, `association.scope`, a relation-backed
  # collection. This is the axis the adversary probe disclaimed verbatim ("the only
  # greps that would find them (`\ball\b`, `where(`, `scope`) return thousands of lines
  # and are unusable at session cost"), and it is the grep-DARK residue: measured on the
  # pin, `grep -rl "ActiveRecord::Relation"` = 14 files and `grep -rlw Relation` = 34
  # files, and NONE of the rows below is in either set. Each one is in the output
  # `sense_blast ActiveRecord::Relation --file relation.rb` SHOWS over MCP, and each
  # call site was read by hand (2026-08-01) — the blast set also contains `.any?`/
  # `.none?` dispatch noise (array_inquirer, tag_helper, remote_ip) which is NOT gold.
  # NO measured delta is claimed: this vertical has never run a cell.
  - {id: 'dep:association', group: dependents, match: [associations/association.rb], relation: "find_target takes `self.scope` — a Relation built from the reflection — and runs the association query through it; the word Relation never appears"}
  - {id: 'dep:association-scope', group: dependents, match: [associations/association_scope.rb], relation: "AssociationScope#scope starts from `klass.unscoped` and chains extending!/add_constraints/limit! onto that Relation"}
  - {id: 'dep:hmt-association', group: dependents, match: [associations/has_many_through_association.rb], relation: "through_scope_attributes reads `scope.where_values_hash(...)`, i.e. consumes the Relation's accumulated where-clause"}
  - {id: 'dep:preloader-assoc', group: dependents, match: [associations/preloader/association.rb], relation: "the association preloader builds a Relation to eager-load an association's records"}
  - {id: 'dep:preloader-through', group: dependents, match: [associations/preloader/through_association.rb], relation: "through_scope builds `through_reflection.klass.unscoped` and merges the reflection scope's values into it"}
  - {id: 'dep:join-dependency', group: dependents, match: [associations/join_dependency.rb], relation: "make_constraints builds the join constraints a Relation compiles for eager-loading/joins — reaches Relation by building it, FQN absent"}
  - {id: 'dep:uniqueness', group: dependents, match: [validations/uniqueness.rb], relation: "build_relation starts from `klass.unscoped` and calls bind_attribute/none! on that Relation to run the uniqueness query"}
  - {id: 'dep:collection-renderer', group: dependents, match: [renderer/collection_renderer.rb], relation: "CROSS-GEM (Action View): preload! calls `@relation.preload_associations(@collection)` on a Relation handed in from the caller"}
  - {id: 'dep:variant-record', group: dependents, match: [active_storage/variant_with_record.rb], relation: "CROSS-GEM (Active Storage): create_or_find_record goes through the `blob.variant_records` relation-backed collection"}
  - {id: 'dep:where-clause', group: contract, match: [relation/where_clause.rb], relation: "WhereClause is the where-condition algebra a Relation accumulates and merges (and/or/invert/except)"}
  - {id: 'dep:from-clause', group: contract, match: [relation/from_clause.rb], relation: "FromClause is the FROM source a Relation carries and merges when chained"}
  # DEMOTED from `dependents` 2026-08-01: both are reached by the probe's own greps
  # (connection_handling by `grep -rl "ActiveRecord::Relation"`, predicate_builder by
  # `grep -rlw Relation`), so they are dead shapes as discriminators. They remain true
  # dependents, kept as honest context.
  - {id: 'ctx:connection-handling', group: context, match: [active_record/connection_handling.rb], relation: "with_role_and_shard executes a relation's queries under a selected connection role/shard"}
  - {id: 'ctx:predicate-builder', group: context, match: [relation/predicate_builder.rb], relation: "PredicateBuilder turns a where(...) argument into the predicate nodes a Relation compiles"}

- id: d:migrations-optimizer
  group: dependents
  relation: migrations/lib/uploader/tasks/optimizer.rb:43 `@category_id = Category.last.id` inside `Migrations::Uploader::Tasks::Optimizer#initialize_discourse_resources`
    (def at :40) - the upload optimiser grabs one arbitrary container up front, beside the avatar sizes
    and the system user, purely to have something to attach its synthetic uploads to; it would start resolving
    a different record, or nil on an empty install, if the default ordering or the store shape moved under
    it. Baseline 0 of 2 measured runs.
- id: d:migrations-importer-categories
  group: dependents

#   either, for the same reason.
#
# MEMORIZATION
#   `memorization_probe.py $CLONE Server --json` returns ok:false, "closed-book recall 0.579
#   (62 members named) >= 0.3". What is recited is the MEMBER LIST OF THE Server MODEL ITSELF.
#   A famous repo is not disqualified; a memorized gold ROW is. Not one of the thirteen
#   `dependents` rows is a member of Server; every one is a line in another file, pinned by

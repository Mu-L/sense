name: Coolify work session - audit the server contract before a rework
repo: coolify
contract_symbol: Server
contract_file: app/Models/Server.php

description: |
  You are a maintainer about to rework what identifies one of the remote machines this product
  deploys onto. Today a machine is a row with a number, a short handle, a display name and a
  network address, and code all over the product treats any one of those as a durable way of
  getting back to it later. The rework breaks that: the record is replaced wholesale, so a
  machine can be renamed, re-addressed, retired and stood in for by a different one, and a
  piece of identity taken today is no longer guaranteed to mean the same machine when it is
  read back tomorrow.
  Before you touch it you have to know two things: how a machine's identity is established,
  changed and torn down today, and every place that kept one of those pieces past the moment
  it had the machine itself - the places that will silently point at the wrong machine, or at
  no machine, without a single line of them changing.
  Throughout, an answer that points at a place must give an exact file:line a teammate could
  jump straight to, plus one phrase on why it matters. A bare filename does not count, a set
  of names offered together with one shared reason and no location on any of them does not
  count, and a missed dependent is a regression shipped.

steps:
  - name: Orient in the codebase
    prompt: >
      Task: orient, and be exact - the rest of the ticket is built on this and nothing later
      will send you back for it.
      Start by fixing the subject. Exactly one type in this product stands for one of these
      machines, and the whole ticket is about that one type and nothing else. Name it and give
      the file:line where it is defined, before anything else, and treat it from here on as a
      single subject rather than as a word to look for.
      Then orient around it, and keep this part short. How is this product laid out - in
      whatever terms the tree itself uses, not in categories I have handed you - and which
      parts of that layout is the subject touched from at all? Name each part once, with a
      single example located at file:line, and say in a phrase what kind of work that part
      does. Do not roll out the contents of any part: this is the map and not the inventory,
      and a long list here earns nothing.
      Finish by separating what you opened and read from what you are taking on the strength
      of a name or a familiar convention, and name anything you could not settle.
      Work the codebase yourself, in this session. No Explore agents.
    checks:
      - type: response_richness
        value: "8"
        required: true
        description: The one type that stands for a machine named at the file:line where it is defined, plus the shape of the product around it - each part of the layout named once with one located example and a phrase on the work it does, and read separated from assumed
      - type: mcp_tool_used
        value: sense_status
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_search
        required: false
        layer: adoption
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption

  - name: Map the server contract
    prompt: >
      Task: the contract itself. What this type is made of, and what identity means on it.
      Everything later in the ticket is read off this part, so it is worth being slow here.
      First, what the type is built out of. The shared behaviour it mixes in, the pieces it is
      composed of, and the other records it declares a relationship to - each with the
      file:line where the declaration sits and one phrase on what it brings in. Separate the
      things it pulls in for its own use from the things that hang off it and exist only
      because it does; that direction matters later and it is cheap to get right now.
      Then identity, precisely. Name each field that identifies one of these machines and give
      the file:line where it is declared or cast. Where those fields are normalised, trimmed or
      derived as the record is written, and what the write does with the previous value of one
      of them when it changes. Where a lookup by identity is served out of a per-request cache
      rather than the store, what empties that cache, and when it is emptied. Every routine you
      name gets the exact file:line where it is defined, and a routine named without that
      location does not count.
      Close in a few sentences: what would a rework of identity have to preserve for this
      contract to keep meaning what it means today?
    checks:
      - type: response_richness
        value: "10"
        required: true
        description: The type's composition - mixed-in behaviour, composed pieces, declared relationships, each located and characterised, and the ones it depends on separated from the ones that depend on it - plus every identifying field located, the write-time normalisation of those fields, and the per-request identity cache with what empties it and when
      - type: mcp_tool_used
        value: sense_graph
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption

  - name: Trace the write path and the teardown
    prompt: >
      Task: how one of these machines comes into existence, and how it goes away. In order,
      with file:line throughout.
      Creation first. What runs when a record for one of these machines is written for the
      first time, in the order it runs, and what gets seeded from it - and for each seeded
      thing say which of two kinds it is: does it hold a link back to the machine, or does it
      hold a COPY of one of the identifying fields? That difference is the most important thing
      in this step, so make the call explicitly on every one of them rather than describing
      them all the same way.
      Then the going away. The removal path, in order: what it takes with it, what it hands to
      something else to remove, and what it leaves behind. Say what is NOT cleaned up and name
      it, rather than reporting that the path looked complete.
      Then cut both paths a second way, by when they run: which parts happen inside the request
      that triggered them, and which are handed off to run later and out of process. For each
      thing handed off, say what travels with it - the machine record itself, or only something
      taken off the machine - because those two are not the same thing to this ticket.
      Now, and briefly, the last part of this step: what a change to that one type would land
      on, as a shape and not as a roll. Assume the type itself changes under the product. I am
      not asking what it uses - the store it is read from, the connection helper it drives, the
      settings beside it - none of that is affected by its own change and none of it is what I
      want. I am asking the other direction: everything in this product that would have to be
      re-examined BECAUSE that type changed under it. That population has a near edge and a far
      side, and the far side is the part of it I will be paying for later. The near edge is the
      code that writes that type's name and is handed one of these machines; it is real, and it
      is the smaller and easier part. Behind it, and reached only through it, is code that was
      handed something a near-edge place took off a machine and passed on - that code never
      writes the type's name anywhere, it is affected all the same, and it is further out than
      one step from the type. An answer that stops at the near edge is not this answer, and
      stopping there is the specific way this part gets failed.
      Establish that whole affected population ONCE, in a single sweep of the entire product
      and to its full depth, not assembled a search at a time. Then report only its shape: the
      areas it lands in, each named once with a single example located at file:line, and how
      far out from the type it reaches. Do not enumerate the places themselves: I am not asking
      for that list here and it earns nothing. What I do want is the population established as
      one set, in a form you can work straight down afterwards, because the next part of this
      ticket is a pass over it and you will not be given the budget to go looking twice.
    checks:
      - type: response_richness
        value: "12"
        required: true
        description: The creation path in order with every seeded record located and ruled a link or a COPY of an identifying field, the removal path in order with what it leaves behind named, both paths split into what runs inline and what is handed off out of process with what travels along, and the affected population established in one sweep and reported as its shape - areas, one located example each, and how far out it reaches
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_graph
        required: false
        layer: adoption
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption

  - name: Audit every dependent of the server contract
    prompt: >
      Task: this is the core of the ticket, and you are working it with the budget the first
      part already cost you. You already established the reach of that one type as a set, in one
      go, and that set is a fixed thing with an edge to it - it is not going to grow now. This
      part is a pass straight down it, in the order you established it, with a judgement at each
      line inside it. It is not a second search, and starting again with fresh words is how this
      gets half done. Take it as settled that the whole record is being replaced, and answer the
      only question that matters after that: what breaks.
      Not the code that is handed one of these machines and works with it while it has it in
      front of it. Whatever share of the product that runs, it will be handed the new record and
      it will be fine, and it is not what I am asking for. What breaks is every place that took
      one identifying piece off a machine, kept that piece after the machine itself was gone
      from its hands, and later trusts it to still mean the same machine when it comes back to
      it - a request later, a restart later, or in another system entirely. That trust is
      exactly what this rework withdraws, and not one of those places changes by a single line
      when it does.
      Test each candidate at the line itself, and only there: is a piece being lifted off a
      machine here and put somewhere the machine itself cannot be carried to, or read back out
      of somewhere after the machine was gone? If instead a machine came in and the code acted
      on it while it had it, that is the ground, and the ground is out.
      One thing about how these places hide, because it decides how you work: almost none of
      them writes the name of that type anywhere near the line that matters. The piece was
      taken off a machine by something else, handed on, and by the time it lands here it is a
      plain value sitting in the middle of a job about something else entirely - so the name
      you fixed in the first part will not lead you to them, and looking for it harder will not
      either. They are inside the reach you already established; they are the part of it where
      the machine itself did not travel.
      How this part is judged, because it is not by how good the places you hand me are. It is
      judged on whether the pass reached the end of the set. Every member of the set you
      established gets a ruling out of you, and there are exactly two rulings it can get. Either
      a piece is being kept there, and it gets the three parts below in full; or it is the
      ground, and it gets its location and the few words that say why it is the ground, and
      nothing more - that side is meant to be cheap, so spend almost nothing on it. A member you
      simply passed over in silence is not an omission, it is a wrong answer, because from here
      it cannot be told apart from one you never reached at all. And do not filter by how sure
      you are: a member you are uncertain about is ruled with the doubt written beside it, never
      dropped. Handing me a short list of the ones you were confident about, with the rest of
      the set unaccounted for, is the specific way this part gets failed - as is closing while a
      member of it is still unruled and you still have working time in front of you.
      For each kept place the answer has three parts and only three: the exact file:line where
      the piece is taken, kept or read back, and the routine that line sits in; how long that
      piece outlives the machine it came from - inside one request, inside one stored record, or
      outside this product entirely; and one phrase on what this place starts getting wrong the
      first time it no longer resolves to the machine it came from. Keep it short: I want the
      coverage, the lifetime and the failure, not the prose.
      Present the kept places organised by area, one section per area, and treat an area as
      finished only when every place inside it is listed separately with its own location; then
      close with the ruled-out members in set order, one line each. If you genuinely run out of
      time, say where in the set you stopped and what was still below that point, rather than
      closing on what you have. A file:line with no lifetime and no failure is half an answer,
      and a group summarised instead of listed reads as a group with nothing in it.
    checks:
      - type: response_richness
        value: "6"
        required: true
        description: A ruling on every member of the population established in the first part - each identity-keeping place located at file:line with the routine it sits in, the lifetime of the piece it keeps and what that place gets wrong once the piece no longer resolves, and each ruled-out member accounted for in one line rather than passed over
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption

  - name: Trace the guards
    prompt: >
      Task: how this product satisfies itself that it is acting on a real, current machine
      before it acts. file:line throughout, and the routine each line sits in.
      Take the places where a machine is looked up, or where a piece kept somewhere is turned
      back into a machine, and work out what confirms the result before anything is done with
      it. Where does a failed lookup raise, and where does it quietly hand back nothing - and
      in the quiet case, what does the calling code then do, having been handed nothing? Where
      is a lookup narrowed to what the caller is entitled to see, and where is it not narrowed
      at all? Where are two identifying pieces compared as plain values to decide that two
      things are the same machine, with no machine present on either side of the comparison?
      And where is a stored judgement about a machine's state read back and acted on as though
      it were current?
      For each: the file:line, the routine it sits in, and one phrase on what that guard
      actually protects against. Where a line of the same shape carries NO guard, say so - the
      absence is the finding in this step, and a list of only the guarded cases hides it.
      Rank nothing yet, that is the next part. Close by separating the guards you read from the
      ones you are asserting from the shape of a call, and name anything you could not settle.
    checks:
      - type: response_richness
        value: "12"
        required: true
        description: Each guard located at file:line with its routine and what it protects against - raising against silently-empty lookups and what the caller does with nothing, entitlement-narrowed against unnarrowed lookups, value-to-value comparisons standing in for identity, stored state read back as current - and the same-shaped lines that carry no guard named as such
      - type: mcp_tool_used
        value: sense_graph
        required: false
        layer: adoption
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption

  - name: Assess the blast radius
    prompt: >
      Task: turn what you now hold - the population, the ruling you gave each member of it, and
      the guards - into a risk order a maintainer can work straight down.
      Rank every place that keeps a piece of a machine, by what happens when that piece stops
      resolving to the machine it came from, and not by how likely you think that is. For each:
      the file:line, its rank, and one sentence justifying that rank - what goes wrong, who or
      what notices, and whether anything at all catches it.
      Then say, for each, how the failure would show up: a lookup that raises and takes
      something down, a silent nothing that the code carries on with, a different machine acted
      on with no complaint at all, or a wrong value that has already left this product and
      cannot be corrected from here. The silent ones outrank the loud ones and you should say
      why in a phrase.
      Then: what has to be re-verified after the rework, and where each re-verification would
      actually be done, at file:line. A missed high-risk dependent is the one that pages
      someone.
      Where you are ranking something you did not open, say so rather than smoothing it into
      the order.
    checks:
      - type: response_richness
        value: "14"
        required: true
        description: Every keeping place ranked by consequence with its file:line and a one-sentence justification, each classified by how the failure surfaces - raising, silently empty, wrong machine acted on quietly, or already outside this product - and the re-verification for each located at file:line
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption

  - name: Plan the change and the verification map
    prompt: >
      Task: write the plan. What you will edit, everything that has to move with it, and what
      proves it moved correctly. This is the artifact a teammate picks up, so nothing in it may
      need re-derivation.
      First the edit itself: every file:line you would change in the contract, in its write
      path and in its removal path, in the order you would change them, and what each change
      is.
      Then everything downstream, grouped by area, one section per area, every place listed
      separately with its own file:line and the change it needs. Where a place needs no change
      but has to be re-read to be sure of that, say so and say why - that is a different claim
      from "unaffected" and I want to see which one you are making.
      Then the tests. Name the tests that already assert something about how a machine is
      identified, resolved, seeded or torn down, each at the file:line of the assertion or the
      setup that would have to change, and say what about it changes. Where nothing existing
      covers a place you ranked high, say that plainly - the gap is part of the answer - and
      describe the test that would close it rather than pointing at a file that does not exist.
      Close with the order of operations: what goes first to keep the product working while the
      rework lands, and what cannot be split from what.
    checks:
      - type: response_richness
        value: "16"
        required: true
        description: The edit itself located line by line and ordered, every downstream place listed separately at its own file:line with the change it needs and needs-no-change distinguished from needs-re-reading, the existing tests that must change each pinned at the assertion or setup line, the uncovered high-risk places named as gaps, and an order of operations
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption


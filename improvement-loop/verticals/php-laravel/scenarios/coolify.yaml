# ============================================================================
# SEVEN-STEP SESSION (plans/cycle-1-craft-the-scenario/03-expand.md)
# ROUND 5 on coolify. Expanded from the measured two-step probe. Anchor unchanged: Server.
#
# WHAT THE MINI-BENCH MEASURED, AND WHAT THIS FILE MAY NOT MOVE
#   results/loop/coolify/minibench.md, verdict PROCEED:
#     baseline 2 of 13 dependents = 0.154   (bar: at or below 0.50)
#     sense    9 of 13 dependents = 0.692
#     delta    7/13 = +0.538                (bar: at least +0.50, cleared by 0.038)
#   Both arms valid, neither watchdogged: `sense wall 289 of 480 exit 0 watchdog None valid

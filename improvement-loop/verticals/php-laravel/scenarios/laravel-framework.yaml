name: Laravel framework work session - audit what reaches for the shared registry
repo: laravel-framework
contract_symbol: Illuminate\Container\Container
contract_file: src/Illuminate/Container/Container.php

description: |
  You are a maintainer of this framework, about to change the one object that every other part
  of it can reach for. Today that object is made once when the application starts, it is put
  somewhere globally reachable, and from then on any code anywhere can ask it for a collaborator
  by name - a class name, or a short string - and get one back, without ever having been handed
  anything and without saying who it is asking.
  That is what changes. In the replacement there is no global reach: an object gets what it
  needs only if it was handed it, and code that wants a collaborator has to declare that it
  wants one. Everything that is handed its collaborators already is fine and stays exactly as
  it is. Everything that reaches out at the moment it needs something has to be reworked, and
  the rework is different in every case, because it depends entirely on what that place is
  fetching and whether it can be handed that thing at all.
  The awkward part is that these places do not look like dependencies. There is no field, no
  constructor parameter and no type on anything. The line sits in the middle of a routine that
  is about something else entirely and is named after that other thing, and what the line names
  is the thing being fetched, not the thing it is being fetched from. Reading a class's
  constructor tells you nothing about whether it does this.
  Before you touch it you have to know two things: what the object is, how the single instance
  is made and put where anything can reach it, and which components are handed one and keep it;
  and then every place in the framework that reaches out for a collaborator at the moment it
  needs one, with what it is fetching named.
  Throughout, an answer that points at a place must give an exact file:line a teammate could
  jump straight to, plus one phrase on why it matters. A bare filename does not count, a set of
  names offered together with one shared reason and no location on any of them does not count,
  and a missed place is a regression shipped.

steps:
  - name: Map the shared registry contract
    prompt: >
      Task: orient, and be exact - the rest of the ticket is built on this and nothing later
      will send you back for it. Two things, and the first is the larger.
      First, the object itself. What does it actually do, grouped by job rather than listed
      routine by routine - how something is registered with it, how something is fetched out
      of it, what happens when the thing asked for was never registered, how one registration
      can be made to depend on who is asking, and how a single instance of it is made globally
      reachable so that code holding nothing at all can still get to it. Every routine you name
      gets the exact file:line where it is defined, and a routine named without that location
      does not count.
      Second, the components that are handed one and keep it. There is a set of objects in this
      framework that receive the instance at construction and hold it in a field of their own,
      declared with a type, and between them they do most of the fetching the framework does on
      purpose. Name them, each at the file:line of the field or the constructor parameter that
      fills it, and for each one say in a phrase what it fetches. These are the ones whose
      dependency is written down where you can see it, and I want them pinned so that the next
      part of the ticket can be about the other kind.
      Then say, briefly, what the other kind looks like - what it looks like when a piece of
      code reaches for this object while holding no handle at all, and why nothing in that
      file's shape gives it away. Say it once, with a single example located at file:line. Do
      not enumerate those places here; I am not asking for that list yet and it earns nothing.
    checks:
      - type: response_richness
        value: "10"
        required: true
        description: The object's own surface grouped by job - registering, fetching, what happens on an unregistered name, making a registration depend on the asker, and how the single instance is made globally reachable - each located at file:line, plus the components handed one and keeping it in a typed field, each pinned to the field or constructor parameter that fills it with a phrase on what it fetches, plus one located example of code reaching for it while holding no handle
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_graph
        required: false
        layer: adoption

  - name: Audit every dependent of the shared registry contract
    prompt: >
      Task: this is the core of the ticket, and you are working it with the budget the first
      part already cost you. Take it as settled that the global reach is going away: an object
      gets what it needs only if it was handed it, and nothing can ask for a collaborator by
      name from wherever it happens to be standing. Answer the only question that matters after
      that: where in this framework does a piece of code reach out for a collaborator at the
      moment it needs one, and what is it reaching for.
      The unit of the answer is a reach, not a component and not a file. A component that is
      handed one and keeps it in a field is not a reach: you pinned those in the first part, and
      naming one again here earns nothing. What I want is the line where code that holds nothing
      goes and gets something.
      Those lines are not where you would look for them. They sit in the middle of a routine
      that is about something else entirely and named after that other thing, doing that
      routine's own job, and what the line names is the collaborator being fetched - never the
      thing it is fetched from. There is no field, no constructor parameter and no type to find.
      One file can hold several such lines in several different routines, and only some of them
      are the ones this ticket has to rework. Expect these in parts of this framework whose own
      subject has nothing to do with wiring or construction. The part of the tree obviously
      about this object holds the object itself and the pieces built directly on it, so it is
      the least interesting place to look.
      For each reach the answer has four parts and only four: the exact file:line and the name
      of the routine it sits in; what is being fetched; whether that routine could instead be
      handed the thing, yes or no, and if no then why not; and one phrase on what breaks for
      that routine if nothing is done. Keep it short: I want the coverage, the target and the
      remedy, not the prose.
      Organise by area, one section per area, and treat an area as finished only when every
      reach inside it is listed separately with its own location. If you run short, say what you
      had still not looked at rather than closing on what you have. A file:line with nothing
      named as the target is half an answer, and a group summarised instead of listed reads as
      a group with nothing in it.
    checks:
      - type: response_richness
        value: "6"
        required: true
        description: Every reach located at the exact file:line with the routine it sits in named, what that line fetches, whether the routine could be handed the thing instead and why not if it could not, and one phrase on what breaks for that routine if nothing is done
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption

scoring:
  weights:
    correctness: 0.7
    efficiency: 0.3

gold:
  # ---- ANCHORS: the contract centre, its interface, the subclass that installs the global
  # ---- instance, the helper that wraps the global reach, and the famous components handed one
  # ---- and keeping it in a typed field. Step 1's answer, and deliberately non-scoring.
  # ---- A FREE ROW IS A GIFT TO THE BASELINE: every one of these is core wiring a frontier
  # ---- model recites closed-book (memorization_probe samples 0.859 / 0.765), so the floor they
  # ---- would put under the plain arm is removed rather than argued with. Every line below was
  # ---- opened and read this session. None of these files appears in `dependents`.
  - id: contract-container
    group: contract
    match: [src/Illuminate/Container/Container.php]
    relation: "src/Illuminate/Container/Container.php:25 `class Container implements ArrayAccess, ContainerContract` - the contract itself; :358 `public function bind($abstract, $concrete = null, $shared = false)` registers, :862 `public function make($abstract, array $parameters = [])` fetches, :1778 `public static function getInstance()` and :1788 `public static function setInstance(?ContainerContract $container = null)` are the global reach the ticket removes"
  - id: c:container-contract
    group: contract
    match: [src/Illuminate/Contracts/Container/Container.php]
    relation: "src/Illuminate/Contracts/Container/Container.php:8 `interface Container extends ContainerInterface`, with :64 `public function bind($abstract, $concrete = null, $shared = false);` and :189 `public function make($abstract, array $parameters = []);` - the type every declared holder writes on its field, which is why the concrete class is named almost nowhere by the components that were handed one"
  - id: c:foundation-application
    group: contract
    match: [src/Illuminate/Foundation/Application.php]
    relation: "src/Illuminate/Foundation/Application.php:39 `class Application extends Container implements ApplicationContract, ...`, whose constructor at :216 calls :282 `static::setInstance($this);` - the single line that makes one instance globally reachable, and the line the ticket's change starts from; it overrides the fetch at :1054 `public function make($abstract, array $parameters = [])`"
  - id: c:helpers-app
    group: contract
    match: [src/Illuminate/Foundation/helpers.php]
    relation: "src/Illuminate/Foundation/helpers.php:132 `function app($abstract = null, array $parameters = [])` doing :135 `return Container::getInstance();` and :138 `return Container::getInstance()->make($abstract, $parameters);` - the global reach wrapped in a two-line helper, the obvious write path, and the first thing any audit finds"
  - id: c:support-manager
    group: contract
    match: [src/Illuminate/Support/Manager.php]
    relation: "src/Illuminate/Support/Manager.php:11 `abstract class Manager` holding :20 `protected $container;` filled at :48 `public function __construct(Container $container)` and reset at :170 `public function setContainer(Container $container)` - handed one and keeps it, in a typed field, and the base class every driver manager in the framework extends"
  - id: c:routing-router
    group: contract
    match: [src/Illuminate/Routing/Router.php]
    relation: "src/Illuminate/Routing/Router.php:38 `class Router implements BindingRegistrar, RegistrarContract` holding :57 `protected $container;` filled from `?Container $container = null` at :144 and reset at :1483 `public function setContainer(Container $container)` - handed one and keeps it; core wiring a maintainer names from memory"
  - id: c:bus-dispatcher
    group: contract
    match: [src/Illuminate/Bus/Dispatcher.php]
    relation: "src/Illuminate/Bus/Dispatcher.php:22 `class Dispatcher implements QueueingDispatcher` holding :31 `protected $container;` filled at :71 `public function __construct(Container $container, ?Closure $queueResolver = null)` - handed one and keeps it, and the component that uses it hardest, since dispatching a job means building it"
  - id: c:database-capsule
    group: contract
    match: [src/Illuminate/Database/Capsule/Manager.php]
    relation: "src/Illuminate/Database/Capsule/Manager.php:13 `class Manager` whose :29 `public function __construct(?Container $container = null)` takes one or makes one - handed one and keeps it, and the framework's own documented example of standing the registry up outside an application"
  - id: c:view-component
    group: contract
    match: [src/Illuminate/View/Component.php]
    relation: "src/Illuminate/View/Component.php:15 `abstract class Component` reaching globally at :114 `return Container::getInstance()->make(static::class, $data);` inside `resolve`, at :200 `Container::getInstance()['config']->get('view.compiled')` and at :416 `static::$factory = Container::getInstance()->make('view');` - the single located EXAMPLE step 1 asks for, deliberately anchored so the discriminator sits on the far side of it"

  # ---- DEPENDENTS: the scored group. 22 rows, ONE FILE EACH, 22 distinct areas, every one a
  # ---- line where code holding no handle reaches for the registry from inside a routine named
  # ---- after its own subject. Every row appears in the `direct_callers` band of the shown MCP
  # ---- blast payload (checked one by one against the printed payload this session). Every line
  # ---- below was opened and read; the credit is what the line does, not a script tally.
  # ---- Eleven of the 22 files print more than one candidate line to the covering search.
  - id: d:log-context-processor

# Per-scenario rubric for the LLM judge layer.
#
# Four criteria per step, weights summing to 1.0: map_quality 0.40 / specificity 0.25
# / justification 0.20 / uncertainty 0.15.
#
# SEVEN-STEP WORK SESSION (plans/cycle-1-craft-the-scenario/03-expand.md).
# SEVEN steps, names verbatim and in the order of scenarios/coolify.yaml (the judge pairs by
# name). No `repo:` key.
#
# EXPANDED from the two-step probe rubric that just passed the mini-bench. The probe's step 2
# block - "Audit every dependent of the server contract", the DISCRIMINATOR - is carried at
# index 4 unchanged, all four criteria verbatim, including the PAIR clause. The probe's step 1
# block, "Map the server contract", is carried at index 2 unchanged. Neither was retyped: both
# were checked byte-for-byte against coolify.rubric.yaml.probe-13row-window-pass.bak (the probe
# rubric this file expands) and against the a23 seven-step rubric this skeleton comes from -
# all four criteria of both steps are IDENTICAL in the two files, so the splice moves nothing.
# The audience block is unchanged and is identical in both as well.
#
# The mini-bench those two blocks were measured under (results/loop/coolify/minibench.md,
# both arms x1, unscored): baseline `dependents` 6/13 = 0.4615, sense 13/13 = 1.0000,
# delta +0.5385. The judge layer does not produce those figures - `dependents` is cited recall
# at path:line - but this rubric scores the same two asks, so moving either block would put
# the judge on a question the probe did not measure.
#
# CARRIED (unchanged from the a23 seven-step rubric): "Orient in the codebase" (groundwork,
# scored AS groundwork - going deep there is scored down, because the budget it burns is the
# budget the audit needs), "Trace the write path" (the link-or-copy call and the
# inline-against-deferred split are what its map_quality turns on), "Trace the guards" (input,
# failure mode, coverage - and a located entrance that SKIPS a check is the highest-value thing
# it can produce), "Assess the blast radius" (an ORDERING of the set already established, with
# the two ranking inversions to catch named explicitly), and "The change and verification map"
# (whose verification criterion scores the split between existing checks, which are located,
# and checks that would have to be written, which are described and must NOT be given a
# fabricated line).
audience: |
  An AI coding agent that will use this answer to safely rework what identifies a remote machine
  in Coolify - the record, its number, its handle, its display name and its address - given that
  after the rework a machine can be renamed, re-addressed, retired and stood in for by a
  different one. Score for that agent, not a human reader and not a docs page.
  A perfect answer leaves the agent able to make that change knowing two things: how a machine's
  identity works today - where the identifying fields are set as the record is written, where a
  lookup by identity is served out of a per-request cache rather than the store and where that
  cache is emptied, where a freshly created machine seeds further records including any that
  take a COPY of an identifying field rather than a link back to it, and what the removal path
  does and does not clean up - each traced through the routines that make it up and each
  located; and how far the change reaches BEYOND the code that is handed a machine and works
  with it in hand.
  That far layer is what decides the answer. It is every place that took one identifying piece
  off a machine, kept it after the machine itself was gone from its hands, and later trusts it:
  a number stored on a row that belongs to something else entirely; a number written onto a
  queued or historical record and read back much later to act on the machine it names; a handle
  concatenated into a cache key or a queue lock name that survives a restart; a number kept in a
  screen's state between requests and resolved again on the next one; a number written into a
  pivot row as a column of the join itself; a handle written into a message body that leaves
  this product for a system we do not control; a bare number arriving back on an event and
  resolved as though it still meant the same machine; a helper whose whole contract with its
  callers is a number rather than the machine. Each must be pinned to an exact file:line, with
  the routine named, with how long the piece outlives the machine it came from - inside one
  request, inside one stored record, or outside this product entirely - and with what that place
  starts getting wrong the first time the piece no longer resolves.
  Almost all of that layer sits in code whose own job is something else: notifications about
  containers, a search box, a creation wizard, a log viewer, a cleanup history record, a shared
  helper. An answer that stays in the part of the product that is obviously about machines has
  found the ground, not the answer.
  A weak answer stops at the code that is handed a machine, however densely it lists it; or
  collapses a run of places into one line with a shared reason and no location on any of them;
  or gives file:line without the lifetime and the failure, which leaves the agent knowing where
  a value is written and not what breaks when it stops meaning what it meant.
steps:
- name: Orient in the codebase
  criteria:
    map_quality:
      weight: 0.4
      question: |
        This step is groundwork and is scored as groundwork: cheap, correct and short beats
        thorough. The step deliberately does NOT supply the areas - it asks for them in the
        codebase's own terms - so score whether the division the answer chose is a real one for
        this tree and whether each area carries ONE located example inside it. A directory
        listing read back is not an orientation; the question is whether each area is
        characterised by what it is FOR, in the answer's own words. Is the one type that stands
        for a remote machine
        correctly identified and placed in one of those areas? Penalise going deep here: a long
        enumeration of what touches that type is the next steps' work done early and badly, and
        it costs the session the budget the audit needs. Penalise equally an orientation so
        vague that the next step starts from nothing.
    specificity:
      weight: 0.25
      question: |
        Does each named area carry an exact file:line inside it, and does the type carry the
        file:line where it is DEFINED rather than a file where it is used? A bare directory name
        is not specific. A file named without a line is not specific.
    justification:
      weight: 0.2
      question: |
        Does each area carry one phrase on what it is for, rather than its name restated? Does
        the closing paragraph name conventions this codebase is actually written to - the ones a
        change to a core record would have to be made in keeping with - rather than generic
        framework facts that would be true of any project in this language?
    uncertainty:
      weight: 0.15
      question: |
        The step asks explicitly which conventions were confirmed by opening something and which
        are assumed from the shape of the tree. Is that split actually made, or is everything
        asserted flat? An orientation is the easiest place in this session to guess from a
        familiar framework layout and be believed; saying which parts were guessed is worth more
        than a confident sweep. Was the instruction to work directly, without delegating the
        exploration, followed?
- name: Map the server contract
  criteria:
    map_quality:
      weight: 0.4
      question: |
        Is a machine's identity traced as one connected story - established, cached, copied,
        destroyed - rather than listed as places a name is mentioned? The step asks for four jobs
        along that story: where the identifying fields are set as the record is written; where a
        lookup by identity is served out of a per-request cache rather than the store, what
        empties that cache and when; where a freshly created machine causes further records to be
        seeded from it, including any that take a COPY of an identifying field rather than a link
        back to it (noticing that difference is the part that makes the next step tractable); and
        what the removal path does, in order, and what it does not clean up behind it. The
        question is COVERAGE OF THE JOBS - all four shown and connected is the full answer.
        The step then asks for a second and deliberately SMALL thing: the SHAPE of the working
        ground, not the roll of it. By what routes does a machine end up in the hands of code
        that works with it, and who does the handing - each route named once with a single
        located example. Score whether the routes are genuinely distinct and correctly
        characterised. Do NOT reward an exhaustive enumeration of the places themselves: it was
        not asked for, and a long located list of code handed a machine is not a better answer
        here than three accurate routes. Could the next step act from this orientation with
        targeted lookups rather than a fresh exploration?
    specificity:
      weight: 0.25
      question: |
        Does every place the answer names carry an exact file:line AND the name of the routine it
        lives in? A bare filename is not specific. A file:line with no routine named around it is
        not specific - the maintainer asked whose code it is, not where the character offset
        falls. A routine named without the file:line where it is defined is not specific either.
        Where the answer names a write path, a cached lookup, a seeded companion record or a
        removal, is the line that actually writes, caches, seeds or deletes located, and not just
        asserted from the name of the surrounding class or relation?
    justification:
      weight: 0.2
      question: |
        Does each part of the lifecycle carry one phrase on what it contributes to identity -
        what it sets, what it caches and on what key, what it copies rather than links, what the
        removal takes with it - and does the closing statement say what a rework of identity
        would have to preserve for that lifecycle to keep meaning what it means today, rather
        than restating relation names?
    uncertainty:
      weight: 0.15
      question: |
        Does the answer separate what it verified by reading from what it inferred from a name or
        from a familiar framework convention? Relation accessors, model event hooks and cached
        lookups invite confident guessing; saying which parts were actually opened is worth more.
        Is anything the session could not resolve named as such rather than smoothed over, and
        are the routes offered as the ones it established rather than as a complete taxonomy it
        did not check?
- name: Trace the write path
  criteria:
    map_quality:
      weight: 0.4
      question: |
        Are BOTH paths traced end to end as connected stories - the path that brings a machine
        into being and the path that takes it away - rather than as two lists of places
        something is written or deleted? On the creation side the step asks for what gates the
        write and refuses it, the write itself, and every further record seeded off the new one
        in the same breath. On the removal side: what goes in the same breath, in what order,
        what is only MARKED rather than really removed, and what is left standing afterwards.
        Two things decide this criterion above the rest.
        THE LINK-OR-COPY CALL. For every seeded record, does the answer say plainly whether it
        holds a LINK back to the machine or a COPY of one of the machine's identifying pieces?
        That distinction is what makes the later audit tractable, and a seeded record listed
        without the call is not answered however well it is located. An answer that treats every
        companion record as "related to the server" has missed the entire point of this step.
        INLINE AGAINST DEFERRED. Is every step of both paths marked as running inside the
        request that asked for it, or as handed off to run later and elsewhere? For each
        deferred one, does the answer say what is actually handed over - the machine, or a piece
        taken off it - and locate BOTH ends of the hand-off, where it is handed out and where it
        is picked up? A deferred step whose hand-off is described but not located on both ends
        is half-answered, and an answer that does not separate inline from deferred at all has
        traced a call graph rather than a lifecycle.
    specificity:
      weight: 0.25
      question: |
        Does every step of both paths carry an exact file:line AND the routine the line sits in?
        Where the answer names a gate, a write, a seeding, a soft delete or a hard delete, is the
        line that actually gates, writes, seeds or deletes located - not asserted from the name of
        the surrounding class, the relation, or a framework hook that "would" fire? Are both ends
        of each deferred hand-off separately located, in their own files, with their own
        routines?
    justification:
      weight: 0.2
      question: |
        Does each step carry one phrase on what it contributes - what the gate refuses and on
        what key, what the write establishes, what the seeded record ends up holding, what the
        removal takes and what it leaves orphaned? Does the closing paragraph actually divide
        these two paths into the parts that survive a machine being renamed, re-addressed,
        retired and stood in for and the parts that do not, rather than restating that identity
        is used here?
    uncertainty:
      weight: 0.15
      question: |
        Model lifecycle hooks, queued handlers and soft deletes are the three things in this
        stack most often asserted from convention rather than read. Does the answer separate what
        it opened from what it inferred? Where a deferred step's far end could not be found, is
        that stated as a gap with which end is missing, rather than filled in with the obvious
        candidate?
- name: Audit every dependent of the server contract
  criteria:
    map_quality:
      weight: 0.4
      question: |
        THE DISCRIMINATOR, and it has three parts: THE KEPT PIECE, WHERE THE PLACE LIVES, and
        BREADTH OF AREA. The working ground - code handed one of these machines that acts on it
        in hand - is explicitly out, so a near-edge list earns nothing here however dense or well
        located, and restating the previous step's orientation is not progress. What is asked for
        is the line where a piece of a machine is lifted off it and put somewhere the machine
        itself cannot be carried to, or read back out of somewhere after the machine is gone.
        Does the audit reach that layer - a number stored on a row whose subject is something
        else entirely, orphaned rather than repointed when the machine goes; a number written
        onto a queued or historical record and read back much later to act on the machine it
        names; a number written into a pivot row as a column of the join; a handle concatenated
        into a cache key or a lock name that survives the request and the process; a number kept
        in a screen's state across the several requests of a flow and resolved again each time;
        a handle written into a message body that leaves this product entirely; a bare number
        arriving back on an event and resolved as though it still meant the same machine; a
        helper or a job that matches its own machine against numbers stored by an earlier
        process?
        WHERE THE PLACE LIVES is scored, not just what it keeps. This layer sits overwhelmingly
        in code whose own job is something else - a container notification, a search box, a
        creation or clone wizard, a log viewer, a cleanup history row, a shared helper, a queued
        job about containers - and hardly at all in the part of the product that is obviously
        about machines, which is where the ground lives. An answer concentrated in the
        machine-named tree and thin everywhere else has enumerated inside one search scope and
        mistaken that for the codebase; score it as the partial answer it is, however well
        located each line.
        BOTH FATES ARE SCORED, and an answer carrying only the first is a partial answer. The
        first fate is the piece that COMES BACK: parked in something that outlasts the moment and
        later turned into a machine again by a lookup, which after the rework may resolve to a
        different machine or to none. The second fate is the piece that NEVER COMES BACK: written
        in as a value of something else, or handed outside this product, with no lookup anywhere
        for the rework to break - what breaks is that the piece now says something untrue about
        which machine this is, and nothing here can reach it to correct that. The second fate is
        quieter and is the half an audit of this shape usually loses; an answer that is all
        lookups and no exports has found one fate and stopped. Score the coverage of both.
        THE PAIR IS SCORED. A kept place is one end of a hand-off, and the step asks for both
        ends: the line where the piece is kept, written out or read back, AND the line in a
        different routine where that same piece was lifted off an actual machine before it
        arrived. Does the answer establish the second end, in its own file:line and its own
        routine, or does it give one line and leave the value's origin implied? The two ends sit
        in different areas by construction - the value travels by being handed on rather than by
        being named - so a second end asserted from the shape of the first, or from a framework
        convention, is not established. Where an answer says no other end could be found, is that
        stated as the gap it is, with which end is missing and why? An answer whose places are
        all single lines has found half of each dependency; score it as the partial answer it is.
        Above all: does the answer state, for each place, WHICH FATE its piece has and HOW LONG
        THE PIECE OUTLIVES THE MACHINE - one request, one stored record, or outside this product
        past correcting from here - which is the distinction a reading of the line alone does not
        give, and the distinction that decides what can still be corrected? Where the answer ran
        short, is what it had still not looked at declared rather than quietly closed over?
    specificity:
      weight: 0.25
      question: |
        Does EVERY place carry its own exact file:line AND the name of the routine the line sits
        inside AND the file:line and routine of the OTHER END of its hand-off AND which fate its
        piece has AND the lifetime of that piece? All of them, because
        a location alone does
        not identify this kind of dependency: two lines of nearly identical shape differ entirely
        depending on whether the value dies with the request, sits in a stored row, or has
        already left this product. Several places named together on one line as a set that shares
        a reason is the failure this criterion exists to catch: however correct the shared reason
        is, it is one item, not a set of located places, and it should be scored as one. A bare
        filename does not count.
    justification:
      weight: 0.2
      question: |
        Does each place carry one phrase on what IT would start getting wrong the first time the
        piece it kept no longer resolves to the machine it came from - pointing at the wrong
        machine, at no machine, reusing a connection that is not there, taking a listener down on
        a failed lookup, treating a live deployment as inactive, cancelling on the wrong host,
        orphaning a row, authorising against a number rather than an object - rather than a
        generic restatement that identity is used here? Is the consequence specific to that
        place, or the same sentence copied down the list?
    uncertainty:
      weight: 0.15
      question: |
        Where the answer could not tell whether a value is a kept piece or a machine still in
        hand, does it say so and say what it would take to settle it, rather than asserting?
        Is the coverage claim honest - what areas were swept, which were not reached, and whether
        the list is offered as complete or as what this session got to? A confident "that is all
        of them" with an unexamined area behind it is worth less than a shorter list that names
        the gap.
- name: Trace the guards
  criteria:
    map_quality:
      weight: 0.4
      question: |
        Are the guarding mechanisms separated as MECHANISMS - existence, entitlement,
        reachability and fit state, and the memoised repeat lookup with whatever empties it -
        rather than collapsed into one "validation" heading with a run of call sites under it?
        Each is a different question asked before acting and they fail differently; an answer
        that does not tell them apart cannot say which one this rework breaks.
        Three things are asked of every mechanism and all three are scored.
        ITS INPUT: does the check receive a machine already in hand, or a piece of one that has
        to be turned back into a machine first? The second kind is the kind this rework reaches
        into, so the call has to be made explicitly and the turning-back located.
        ITS FAILURE MODE: does it raise, return nothing, or carry on regardless - and does the
        answer say which of those is a SILENT pass that a downstream caller would never notice?
        A guard that returns nothing where the caller expects a machine is the dangerous shape
        here and an answer that does not distinguish it from one that raises has not answered.
        ITS COVERAGE: is the check applied at every way into the behaviour it protects, or only
        at some? A located entrance that SKIPS the check is the single highest-value thing this
        step can produce; score it accordingly. Score down an assertion that a check is applied
        uniformly with no evidence of having looked - and score UP an answer that names which
        entrances it actually examined and declines to generalise beyond them.
    specificity:
      weight: 0.25
      question: |
        Is each mechanism pinned to the exact file:line where the decision is MADE, with the
        routine named - not the file:line of a caller that invokes it, and not the name of a
        scope, policy or trait asserted without a line? Where the answer says a check is skipped
        somewhere, is that skipping entrance located at file:line too, or only described?
    justification:
      weight: 0.2
      question: |
        Does each mechanism carry one phrase on what it actually establishes and what would get
        through if it were absent, specific to that mechanism rather than a shared sentence about
        safety? Is the consequence of the silent-pass ones stated in terms of what the caller
        downstream then does with nothing in hand?
    uncertainty:
      weight: 0.15
      question: |
        Guards are the part of a framework codebase most often reported from convention. Does the
        answer say which checks it read and which it assumed, and does it bound its coverage
        claim to the entrances it actually examined? A shorter answer that names the entrances it
        did not reach is worth more than a complete-sounding one that examined the same number.
- name: Assess the blast radius
  criteria:
    map_quality:
      weight: 0.4
      question: |
        This step is an ORDERING of the set already established, not a second pass over the
        codebase. Score two things: whether the ordering covers that set, and whether it is
        ordered on the right thing.
        COVERAGE: does the ranking carry the places established in the audit, or has it quietly
        shrunk to the handful the session was most comfortable with? A ranking that drops
        established places without saying so is worse than a longer one with doubts written
        beside entries, and the step says explicitly that an undecidable place goes at the
        dangerous end rather than out of the list.
        THE RANKING BASIS: the step names four things that decide danger - how QUIETLY it fails
        (whether anything raises at all, or whether the wrong answer is simply returned), how FAR
        the wrong answer travels before anyone could notice, whether the damage can still be
        corrected from inside this product or has already left it, and how OFTEN the path runs.
        Is the ordering actually argued from those, or is it a plausible-looking list with the
        criteria named once at the top and never applied? The specific inversion to catch: a
        place that fails loudly on the first request ranked ABOVE one that keeps working while
        being quietly wrong, or a place whose piece has already left this product ranked low
        because nothing here raises on it. Either inversion means the ordering was made on how
        legible the code was rather than on what it costs.
        Finally, for the dangerous end, is the thing to re-verify an actual CONDITION that must
        be shown to still hold, located where it would be shown - not "add a test" or "check this
        works"?
    specificity:
      weight: 0.25
      question: |
        Does every entry in the ordering carry its own exact file:line, and is it the same
        location the audit established rather than a re-derived or vaguer one? Are the entries
        ranked individually, or are several collapsed onto one line as a tier sharing a reason -
        which is one item, not a set of ranked places, and should be scored as one? Are the
        re-verification conditions located?
    justification:
      weight: 0.2
      question: |
        Does each entry say why it sits where it does, in terms of the four ranking criteria and
        specific to that place - what fails silently there, how long it stays wrong, who outside
        this product is holding the stale piece - rather than a severity label attached with no
        argument? Is the reasoning different down the list, or the same sentence with the rank
        changed?
    uncertainty:
      weight: 0.15
      question: |
        Where the risk could not be decided, is the place ranked high with the doubt written
        beside it, as the step asks, rather than dropped or silently placed low? Is the ordering
        offered as this session's judgement over what it established, rather than as an objective
        severity? Are the parts of the ranking that rest on how often a path runs marked as the
        estimates they are, if the frequency was not actually established?
- name: The change and verification map
  criteria:
    map_quality:
      weight: 0.4
      question: |
        Three parts are asked for and all three are scored.
        THE EDIT: is it a set of concrete edits at places already established, each with what it
        becomes - or a restatement of the plan in the ticket? Where one edit repeats across many
        places, is it stated once AND every landing place still located? An edit described once
        and located nowhere is not a change anyone can carry out.
        THE MAP: does it carry the WHOLE ruled-in set, grouped by area, one section per area,
        every place listed separately, in the risk order just established? This is the criterion
        where a summarised section fails hardest: "the remaining screens follow the same pattern"
        is a section with nothing in it, and a place present in the ranking but missing from this
        map is a place that does not get changed. Compare the map against the audit and the
        ranking and score the shrinkage, if any.
        THE VERIFICATION, SPLIT IN TWO: existing automated checks that cover this behaviour
        today, each LOCATED, with what about them would have to change; and behaviours with NO
        check covering them at all, DESCRIBED rather than located, because there is no line yet
        to point at. Is the split actually made and stated per item? Two failures to catch, and
        they are opposite: inventing a file:line for a check that does not exist yet, and
        refusing to locate the checks that do exist. Both are scored down. An answer that lists
        only "tests to add" has not looked at what is already covered.
    specificity:
      weight: 0.25
      question: |
        Does every edit and every mapped place carry its own exact file:line? Is every EXISTING
        check named at file:line, and is every proposed new check described by what it would
        assert rather than given a fabricated location? Several places named together on one line
        as a group sharing an edit is one item, not a set, and should be scored as one. A bare
        filename does not count anywhere in this step.
    justification:
      weight: 0.2
      question: |
        Does each edit carry one line on what it becomes and why that place needs it, specific to
        that place? Does each existing check carry what about it would have to change, and each
        missing one what it would have to assert - rather than a generic "update the tests"? Does
        the closing paragraph name a real residual uncertainty from this session and something
        concrete that would settle it, rather than a ritual disclaimer?
    uncertainty:
      weight: 0.15
      question: |
        Is the map offered as what this session established, with any area it did not reach named
        as unreached, rather than as a complete inventory? Where an edit depends on something the
        session did not confirm - a deferred hand-off whose far end was never located, a guard
        whose coverage was never checked - is that dependency stated? The closing "least sure"
        answer is scored here: is it a genuine weak point of the work, or the safest-sounding
        thing to admit?

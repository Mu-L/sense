#     a11 0.800 / 0.933  baseline side       +  0.692 / 1.000  baseline side (7-step)
#                                           a21 0.154 / 0.692  INSIDE (probe)
#                                            +  0.286 / 0.571  SENSE side (7-step)
#
#   Twenty-one cycles; the baseline side failed thirteen times, the sense side six. a21 is
#   the FIRST cell whose baseline landed inside the window in session, and it is the cell

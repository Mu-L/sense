#   d:container-webhook-handle leaves the product in a webhook body, and
#   d:backup-path-address is slugged into a directory name on disk. Three of those four were
#   `neither` in the killing run. The ask described a mechanism its own gold does not all
#   satisfy, and the arm answered the ask. This draft names TWO fates - the piece that comes
#   back and is resolved, and the piece that never comes back and is simply untrue from then
#   on - and says in as many words that the second is the half the pass usually loses.
#   Per-unit check on that reading, run before writing it: of the four sense-only rows in
#   the killing run (d:additional-network-pivot, d:compose-validate-id,
#   d:new-destination-state-id, d:new-resource-state-id), FOUR of four are comes-back rows;

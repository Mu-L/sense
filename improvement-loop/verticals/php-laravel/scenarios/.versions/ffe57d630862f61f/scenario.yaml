# THE SUPERSEDED QUESTION AND THE NUMBER THAT KILLED IT
#   scenarios/coolify.yaml.seven-step-sense-0571.bak - the seven-step session expanded from
#   a21's probe, its step 4 being the step 2 this file replaces. baseline 0.286, sense 0.571,

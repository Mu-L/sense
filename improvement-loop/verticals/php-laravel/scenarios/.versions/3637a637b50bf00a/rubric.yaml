# Per-scenario rubric for the LLM judge layer.
#
# Four criteria per step, weights summing to 1.0: map_quality 0.40 / specificity 0.25
# / justification 0.20 / uncertainty 0.15.
#
# CYCLE 1 on coolify, TWO-STEP PROBE (plans/cycle-1-craft-the-scenario/01-author.md).
# TWO steps, names verbatim and in the order of scenarios/coolify.yaml (the judge pairs
# by name). This is the first scenario in the php-laravel vertical; there is no earlier
# rubric on this repo.
#
# WHY map_quality carries the most weight on the discriminator: this scenario's axis is the
# ROUTE, not the mention. Every dependent in the scored group is already holding a machine
# when its own work begins - handed one at construction, walked to one across two or three
# associations belonging to some other record, reaching one through a relation path written as
# a string, or handed one back by a caching accessor on a third model - and the routine it does
# that from is named after its own job. Naming the route is the part a search result does not
# print, and it is what separates an audit from a name list.
#
# WHY specificity demands the enclosing routine: every scored row is a line inside a def, a
# promoted constructor signature, or a free-function signature, so the routine is demanded for
# all of them.
audience: 'An AI coding agent that will use this answer to safely rework the Coolify class that

  stands for a remote machine the product deploys onto - the thing that knows how to be

  reached, whether it is currently usable, and how a command gets run on it. Score for that

  agent, not a human reader and not a docs page. A perfect answer leaves the agent able to

  change that class knowing two things: how the judgement that a machine is reachable and

  usable is computed, stored, refreshed and cheaply re-served - traced through the routines

  that make it up - and every other place that would have to be reviewed or changed with the

  class, each pinned to an exact file:line, with the route by which that place comes to be

  holding a machine and the consequence of the change on that place both stated. The

  dependents that matter are not the code named after this class. They are places doing some

  other job entirely - reaping stale helper containers, cloning a volume between two machines,

  dumping a database, running a scheduled command in the right timezone, rewriting an address

  after a tunnel changes, backing up the installation''s own host, rendering a service page,

  building an scp command, deciding whether to prefix a command with sudo, validating a compose

  file, reporting container status, telling six notification channels which machine went quiet -

  and they are scattered across the models, the queued jobs, the event listeners, the

  notifications, the UI components, the actions and the global helper files. A weak answer

  covers the code named after this class thoroughly and treats the rest of the repository as if

  it were not there; or collapses a run of dependents into one line with a shared reason and no

  location on any of them; or gives file:line with nothing said about how that place got hold

  of a machine or what would break, which leaves the agent knowing where the name appears and

  not what its change would do.

  '
steps:
- name: Map the server contract
  criteria:
    map_quality:
      weight: 0.4
      question: 'Is the reachability-and-usability judgement traced end to end as one connected path,

        rather than listed as places the class is mentioned? The step asks for four jobs along that

        path - where the judgement itself is computed and what it is composed of, where the state it

        reads is stored and kept current, where that state is refreshed by the work that goes out and

        checks the machine, and where a caller holding only an identifier gets an instance back

        without paying for a fresh lookup - so the question is COVERAGE OF THE JOBS. All four shown

        and connected into a path is the full answer. Could the next step act from this map with

        small targeted lookups rather than a fresh exploration?

        '
    specificity:
      weight: 0.25
      question: 'Does every place carry an exact file:line AND the name of the routine it lives in? A

        bare filename is not specific. A file:line with no routine named around it is not specific -

        the maintainer asked whose code it is, not where the character offset falls. A routine named

        without the file:line where it is defined is not specific either. Where the answer names a

        stored flag or a cached instance, is the storage or the cache located too, and not just

        asserted?

        '
    justification:
      weight: 0.2
      question: 'Does each place carry one phrase on what it contributes to the judgement - what it

        composes, what it stores, what refreshes it, what it saves a caller from paying - and does

        the closing statement say what a rework would have to preserve in terms of BEHAVIOUR rather

        than restating the method names?

        '
    uncertainty:
      weight: 0.15
      question: 'Does the answer separate what it verified by reading from what it inferred from a name

        or from a familiar framework convention? A conventional model layout invites confident

        guessing; saying which parts were actually opened is worth more. Is completeness claimed

        without saying how it was established?

        '
- name: Audit every dependent of the server contract
  criteria:
    map_quality:
      weight: 0.4
      question: 'THE DISCRIMINATOR, and it is BREADTH OF AREA together with the ROUTE. Does the audit

        reach the places that never ask for one of these machines - the ones already holding one when

        their own work begins - or does it cover the code named after the class and stop there? The

        dependents that decide this step sit as much in the models that serve an instance back out of

        a cache, the queued jobs that were handed one at construction, the listeners that resolve one

        from a raw identifier in an event payload, the notifications that carry one into their

        channels, the UI components that walk two or three associations to reach one, and the global

        helper files every remote command flows through, as in the actions named after the class. An

        answer that is dense in one tree and silent in the others has enumerated inside one search

        scope and mistaken that for the codebase. Does the answer say, for each dependent, WHICH

        route it is on - handed one, walked to one, named the walk as text, or served one from a

        cache? Is the answer organised by area with each area worked to the end, and are areas it

        could not finish declared as unfinished rather than quietly summarised? Re-listing the

        class''s own surface, its relations, or the settings record it owns is not this question.

        '
    specificity:
      weight: 0.25
      question: 'Does EVERY dependent carry its own exact file:line AND the name of the routine the

        dependency sits inside? Every dependent in scope here is a line inside a def, a promoted

        constructor signature or a free-function signature, so a file:line with no routine named

        around it is not specific, and a routine named without a file:line is not specific either.

        Several dependents named together on one line as a set that shares a reason is the failure

        this criterion exists to catch: however correct the shared reason is, it is one item, not a

        set of located dependents, and it should be scored as one. A bare filename does not count.

        '
    justification:
      weight: 0.2
      question: 'Does each dependent carry one phrase on what that place would start getting wrong if

        the class changed under it? The consequence must be about that place''s own job - what breaks

        for the helper containers being reaped, the volume being cloned across two machines, the

        database being dumped, the scheduled command''s timezone, the address being rewritten after a

        tunnel change, the installation''s own backup, the service page''s log stream, the scp

        command being built, the sudo decision, the compose file being validated, the container

        status being reported, the six notification channels naming a machine - not a restatement of

        the line of code.

        '
    uncertainty:
      weight: 0.15
      question: 'Does the answer say how it convinced itself the audit is exhaustive, and name where it

        is likely still thin? An unqualified claim of completeness over a codebase this size is

        overconfidence. Naming an area it knows it did not finish, and what it left there, is worth

        more than a confident list that quietly stops. Routes that resolve at runtime - a relation

        walk written as a string, an instance served from a cache - are the ones a static reading

        misses, and saying so is worth more than asserting full coverage.

        '

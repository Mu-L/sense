name: Bagisto work session - audit every routine handed the catalogue record itself
repo: bagisto
contract_symbol: Webkul\Product\Models\Product
contract_file: packages/Webkul/Product/src/Models/Product.php

description: |
  You are a maintainer of this store platform, about to narrow the record the whole catalogue
  hangs off. Today that record is passed around whole. A routine that needs one number off it
  is handed the entire thing, and once it has it, it can walk any of the record's own
  sub-collections and ask the record any question it likes.
  The narrowing takes that away. After it, a routine may be told a value, or handed a narrow
  read-only view, but it may not be given the record itself.
  What makes that dangerous is not how many places mention the record. It is that a routine
  handed the record names it whatever it wants - a parameter, a local, an entry in a bag of
  data, a value pulled out of an event by key, or an instance it made itself and never saved -
  so nothing written at the place it is used ties it back to what it is holding. The tie is at
  the point the routine was handed the value, which is usually a different file, and often a
  different package.
  So the question the narrowing turns on is possession: which routines end up holding a whole
  record, and what does each of them actually take out of it once it has one.
  Before you touch it you have to know two things: what the record is, what a holder can do
  with one, and the one layer whose declared job is to make and change them; and then,
  separately, every routine downstream that ends up holding one, with the line pinned and what
  it takes out of the record named.
  Throughout, an answer that points at a place must give an exact file:line a teammate could
  jump straight to, plus one phrase on why it matters. A bare filename does not count, a set of
  names offered together with one shared reason and no location on any of them does not count,
  and a missed place is a broken storefront shipped.

steps:
  - name: Map the catalogue record contract
    prompt: >
      Task: orient, and be exact - the rest of the ticket is built on this and nothing later
      will send you back for it. Three things.
      First, the record itself. Name it precisely - the fully qualified name of the class and
      the exact file:line it is declared at - and say what code holding one can do with it,
      grouped by job rather than listed routine by routine, with the exact file:line where each
      named routine is defined. This platform gives the same short name to more than one thing,
      so say which one you settled on and how you told them apart, at file:line each.
      Second, the behaviour object. Give the exact line where the record builds the object that
      answers for it, the exact line where it hands ITSELF to that object, the base class every
      such object extends at file:line, and the exact line inside that base which is where the
      record ends up being kept. Say what happens when the record cannot build one, at
      file:line. Also name the one layer whose stated job is to create and change these
      records, at file:line, and say in a phrase what it is responsible for.
      Third, and deliberately small: say once, briefly, that a routine can be handed one of
      these records outright rather than reaching it through something else, and give ONE
      example line where that happens. Do not enumerate the rest here; I am not asking for that
      list yet and it earns nothing.
    checks:
      - type: response_richness
        value: "10"
        required: true
        description: The record named precisely with its declaring file:line and disambiguated from the same-named siblings, its own surface grouped by job with each routine located at file:line, the line where the behaviour object is built, the line where the record hands itself to it, the base class at file:line, the line inside that base where the record is kept, the failure line, and the declared create-and-change layer at file:line
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_graph
        required: false
        layer: adoption

  - name: Audit every dependent of the catalogue record contract
    prompt: >
      Task: this is the core of the ticket, and you are working it with the budget the first
      part already cost you. Take it as settled that the narrowing is happening: after it, no
      routine may be given one of these records whole.
      Answer the only question that matters after that: which routines in this codebase end up
      holding a whole record, and what does each one take out of it once it has one. A routine
      counts when the record is in its own hands under a name it chose - a parameter it
      declares, a local it assigns, an entry it reads out of a bag of data, a value it pulls
      out of an event by key, or an instance it built itself and never saved. It does NOT count
      when the routine only ever reaches the record through a relation hanging off something
      else it was already holding; those places are not being narrowed and naming them earns
      nothing.
      The unit of the answer is a routine, not a package and not a file, and one file can hold
      more than one. The record itself, the object that answers for it, its base class and the
      create-and-change layer are not answers here: you pinned those in the first part and
      naming them again earns nothing.
      For each routine the answer has three parts and only three: the exact file:line and the
      routine it sits in; what that routine takes out of the record, in a phrase; and how the
      record got into its hands, which is usually decided in a different file.
      Keep it short - the coverage, what is taken, how it arrived, not the prose.
      Organise by area, one section per area, and treat an area as finished only when every
      routine inside it is listed separately with its own location. If you run short, say what
      you had still not looked at rather than closing on what you have. A file:line with no
      statement of what is taken out of the record is half an answer, and a group summarised
      instead of listed reads as a group with nothing in it.
    checks:
      - type: response_richness
        value: "6"
        required: true
        description: Every routine located at the exact file:line with the routine it sits in named, what it takes out of the record stated, and how the record came into its hands accounted for
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption

scoring:
  weights:
    correctness: 0.7
    efficiency: 0.3

gold:
  # ---- ANCHORS: the record, the base of the behaviour family and the declared write layer.
  # ---- Step 1's answer, deliberately NON-SCORING. A FREE ROW IS A GIFT TO THE BASELINE, and
  # ---- these are exactly the rows both arms reach in one lookup - and the ones
  # ---- memorization_probe shows this model recites closed-book (recall 0.444 over the
  # ---- record's member list). Putting them here removes the floor they would otherwise put
  # ---- under the plain arm. Every line was opened and read this session. None appears in
  # ---- `dependents`.
  - id: contract-product
    group: contract
    match: [Product/src/Models/Product.php]
    relation: "packages/Webkul/Product/src/Models/Product.php:25 `class Product extends Model implements ProductContract` - the record itself; :347 `public function getTypeInstance(): AbstractType` builds the object that answers for it, :353 `$this->typeInstance = app(config('product_types.'.$this->type.'.class'));` resolves the class, :356 throws when it cannot, and :359 `$this->typeInstance->setProduct($this);` is where the record hands ITSELF over"
  - id: c:abstract-type
    group: contract
    match: [Product/src/Type/AbstractType.php]
    relation: "packages/Webkul/Product/src/Type/AbstractType.php:32 `abstract class AbstractType` - the base every behaviour object extends; :39 `protected $product;` is where a whole record is kept once handed over, and :394 `public function setProduct($product)` / :396 `$this->product = $product;` is the handover point itself"
  - id: c:product-repository

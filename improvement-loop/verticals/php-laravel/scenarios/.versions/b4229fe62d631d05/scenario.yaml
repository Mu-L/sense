    relation: "packages/Webkul/Product/src/Helpers/ConfigurableOption.php:39 `$variantCollection = $product->variants()` inside `getAllowedVariants($product)` at :33 - takes the record as a declared parameter and walks its own variant collection, eager-loading the record's attribute values, price and inventory indices and images to build the storefront option matrix. OUTSIDE-ALL-FOUR"

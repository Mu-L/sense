  # ---- DEPENDENTS: 14 rows, 14 files, 9 areas. Every one is a routine that ends up holding a
  # ---- whole record under a name of its own. Each row's `relation` quotes the line as it is
  # ---- in the file, read this session. Each row's file appears in the shown blast payload

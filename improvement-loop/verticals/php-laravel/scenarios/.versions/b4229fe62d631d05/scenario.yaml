    match: [Sales/src/Repositories/InvoiceItemRepository.php]
    relation: "packages/Webkul/Sales/src/Repositories/InvoiceItemRepository.php:32 `$orderedInventory = $data['product']->ordered_inventories()` - holds the whole record as an entry in the bag of invoice data it was called with, and walks the record's own ordered-inventory rows to draw down what an order had reserved; :44 then walks `$data['product']->inventories()` to take the stock itself. OUTSIDE-ALL-FOUR: the record is an array entry, so no accessor form matches"
  - id: d:booking-price-note
    group: dependents
    match: [BookingProduct/src/Listeners/PriceNote.php]
    relation: "packages/Webkul/BookingProduct/src/Listeners/PriceNote.php:16 `$product = $eventManager->getParam('product');` - pulls a whole record out of a view-render event by key and, at :21 `$product->booking_products()->first()`, walks the record's own booking rows to decide which price note to append. OUTSIDE-ALL-FOUR, and MEASURED: the one row the plain arm missed in cycle 3 and one of two it missed in cycle 4"

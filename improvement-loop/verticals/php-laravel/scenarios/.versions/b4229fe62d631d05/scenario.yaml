  # ---- Rows marked OUTSIDE-ALL-FOUR are outside every measured plain-arm route: `->product`,
  # ---- the seven per-kind collection names, `$this->product`, and the type-lookup /
  # ---- five-forwarder grep. Recorded, not used as a gate.
  - id: d:invoice-item-inventory

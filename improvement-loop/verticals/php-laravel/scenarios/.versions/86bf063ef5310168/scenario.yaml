name: Laravel framework work session - audit what talks to the shared event hub
repo: laravel-framework
contract_symbol: Illuminate\Events\Dispatcher
contract_file: src/Illuminate/Events/Dispatcher.php

description: |
  You are a maintainer of this framework, about to replace the single shared object that every
  part of it announces things through. Today that object is made once at boot, registered under
  a short name, and handed to whatever asks for it. When something announces, the listeners run
  right there, inside the same call, before the announcing routine gets its next line; the
  announcement can hand back an answer, and the announcer can stop the world on it. Anything
  can also register something to be called later, and anything can ask the object what is
  currently listening.
  That is what changes. In the replacement, announcing hands the work off: listeners run later,
  outside the call that announced, so nothing comes back and nothing can be stopped on the way.
  The listener table is owned centrally and settled before the application starts serving, so
  registering after that point is too late and asking what is listening is a question it will
  no longer answer.
  So the fate of each piece of code that touches this object depends entirely on what it is
  doing with it, and there are only a few things it can be doing. Some announce and walk away,
  and nothing happens to them. Some announce and then use what came back. Some register
  something to be called later. Some ask the object what is listening and branch on the answer.
  Three of those four break, and they break quietly - the code still runs, it just stops being
  told the truth.
  Before you touch it you have to know two things: what the object is, how the single shared
  instance is made and handed out, and which components are given one and keep it; and then
  every place in the framework where a contact with that object actually happens, with the
  direction of that contact named.
  Throughout, an answer that points at a place must give an exact file:line a teammate could
  jump straight to, plus one phrase on why it matters. A bare filename does not count, a set of
  names offered together with one shared reason and no location on any of them does not count,
  and a missed place is a regression shipped.

steps:
  - name: Map the event announcement contract
    prompt: >
      Task: orient, and be exact - the rest of the ticket is built on this and nothing later
      will send you back for it. Two things, and the first is the larger.
      First, the object itself. What does it actually do, grouped by job rather than listed
      routine by routine; where is the single shared instance made, and under what short name
      is it registered so that code holding only that name can get one; what happens, in order,
      between something announcing and a listener running; what can come back to the announcer,
      and what can stop the run part way; and what else can be asked of the object besides
      announcing. Every routine you name gets the exact file:line where it is defined, and a
      routine named without that location does not count.
      Second, the components that are given one and keep it. There is a set of objects in this
      framework that receive the instance at construction and hold it in a field of their own,
      and between them they do most of the announcing the framework does. Name them, each at
      the file:line of the field or the constructor that fills it, and for each one say in a
      phrase what it announces. These are the ones whose dependency is written down where you
      can see it, and I want them pinned so that the next part of the ticket can be about the
      contacts themselves rather than about who is holding what.
      Then say, briefly, how far a contact can sit from the handle that made it possible - what
      it looks like when the routine that touches the object is nothing like the routine that
      was given it, and what it looks like when a piece of code touches the object while
      holding no handle at all. Say it once, with a single example located at file:line. Do not
      enumerate the places themselves; I am not asking for that list here and it earns nothing.
    checks:
      - type: response_richness
        value: "10"
        required: true
        description: The object's own surface grouped by job, the single shared instance's construction and the short name it is registered under, the order of what happens between an announcement and a listener running, what can come back to the announcer and what can halt the run, and what else can be asked of the object - each located at file:line, plus the components given one and keeping it, each pinned to the field or constructor that fills it with a phrase on what it announces, plus one located example of a contact sitting far from its handle
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_graph
        required: false
        layer: adoption

  - name: Audit every dependent of the event announcement contract
    prompt: >
      Task: this is the core of the ticket, and you are working it with the budget the first
      part already cost you. Take it as settled that the object is being replaced as described:
      listeners run after the announcing call has returned, nothing comes back to the
      announcer, nothing can be halted part way, the listener table is settled before serving
      begins, and the object will not answer questions about what is listening. Answer the only
      question that matters after that: where in this framework does a contact with that object
      actually happen, and which way does that contact run.
      The unit of the answer is a contact, not a component and not a file. A component that
      holds a handle is not itself a contact: you pinned the holders in the first part, and
      naming one again here earns nothing. What I want is the line where something is actually
      said to the object, or asked of it, or registered with it.
      Those lines are not where you would look for them. A component is given its handle once,
      in a constructor, and then the contact happens somewhere else entirely - inside a routine
      named after that component's own subject, doing that component's own job, often hundreds
      of lines away and behind a private helper of its own naming. Some code never takes a
      handle at all and asks the application for the object at the instant it needs it, so
      there is nothing in that file to hold on to and nothing about it that looks like a
      dependency. Reading the file in front of you will not tell you the contact is there.
      Expect these in parts of this framework whose own subject has nothing to do with
      announcements. The part of the tree obviously about this object holds the object itself
      and the pieces built directly on it, so it is the least interesting place to look.
      For each contact the answer has four parts and only four: the exact file:line and the
      name of the routine it sits in; which way the contact runs - announced and walked away
      from, announced and the answer used, something registered to be called later, or the
      object interrogated about what is listening; whether that contact survives the
      replacement, yes or no; and one phrase on what goes wrong for that routine if it does
      not. Keep it short: I want the coverage, the direction and the fate, not the prose.
      Organise by area, one section per area, and treat an area as finished only when every
      contact inside it is listed separately with its own location. If you run short, say what
      you had still not looked at rather than closing on what you have. A file:line with no
      direction named is half an answer, and a group summarised instead of listed reads as a
      group with nothing in it.
    checks:
      - type: response_richness
        value: "6"
        required: true
        description: Every contact located at the exact file:line with the routine it sits in named, the direction of the contact (announced and walked away from, announced and the answer used, registered for later, or the object interrogated), whether that contact survives a replacement where listeners run after the call returns and the listener table is settled before serving, and one phrase on what goes wrong if it does not
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption

scoring:
  weights:
    correctness: 0.7
    efficiency: 0.3

gold:
  # ---- ANCHORS: the contract centre, the boot binding, the two stand-ins for the object, and
  # ---- the famous core components that are handed one and keep it. Step 1's answer, and
  # ---- deliberately non-scoring. A FREE ROW IS A GIFT TO THE BASELINE: every one of these is
  # ---- core wiring a frontier model can recite, so the floor they would put under the plain
  # ---- arm is removed rather than argued with. Every line below was opened and read this
  # ---- session. None of these files appears in `dependents`.
  - id: contract-dispatcher
    group: contract
    match: [src/Illuminate/Events/Dispatcher.php]
    relation: "src/Illuminate/Events/Dispatcher.php:42 `class Dispatcher implements DispatcherContract` - the contract itself; :124 `public function listen($events, $listener = null)` registers, :274 `public function dispatch($event, $payload = [], $halt = false)` announces, :261 `public function until($event, $payload = [])` announces and takes the answer, :314 `protected function invokeListeners($event, $payload, $halt = false)` is where the halt actually happens"
  - id: c:dispatcher-contract
    group: contract
    match: [src/Illuminate/Contracts/Events/Dispatcher.php]
    relation: "src/Illuminate/Contracts/Events/Dispatcher.php:5 `interface Dispatcher`, with :14 `public function listen($events, $listener = null);` and :49 `public function dispatch($event, $payload = [], $halt = false);` - the type every holder writes on its field, which is why the concrete class is named almost nowhere"
  - id: c:event-service-provider
    group: contract
    match: [src/Illuminate/Events/EventServiceProvider.php]
    relation: "src/Illuminate/Events/EventServiceProvider.php:17 `$this->app->singleton('events', function ($app) {` returning :18 `return (new Dispatcher($app))->setQueueResolver(...)`, inside `public function register()` at :15 - the single shared instance, bound under the short string name; this is the line the ticket's swap changes"
  - id: c:null-dispatcher
    group: contract
    match: [src/Illuminate/Events/NullDispatcher.php]
    relation: "src/Illuminate/Events/NullDispatcher.php:8 `class NullDispatcher implements DispatcherContract` holding a real one at :17 `protected $dispatcher;`, with :37 `public function dispatch($event, $payload = [], $halt = false)` swallowing the announcement - the framework's own proof that a component cannot tell whether its announcement went anywhere"
  - id: c:event-fake
    group: contract
    match: [src/Illuminate/Support/Testing/Fakes/EventFake.php]
    relation: "src/Illuminate/Support/Testing/Fakes/EventFake.php:17 `class EventFake implements Dispatcher, Fake`, announcing at :321 `public function dispatch($event, $payload = [], $halt = false)` and recording instead - the second stand-in, and the reason the contract interface rather than the class is what components type"
  - id: c:routing-router
    group: contract
    match: [src/Illuminate/Routing/Router.php]
    relation: "src/Illuminate/Routing/Router.php:50 `protected $events;` filled at :146 `$this->events = $events;` in `__construct(Dispatcher $events, ?Container $container = null)` at :144, spent at :775 `$this->events->dispatch(new Routing($request));` - handed one and keeps it; core wiring a maintainer names from memory"
  - id: c:database-connection
    group: contract
    match: [src/Illuminate/Database/Connection.php]
    relation: "src/Illuminate/Database/Connection.php:134 `protected $events;` set at :1637 `$this->events = $events;` inside `public function setEventDispatcher(Dispatcher $events)` at :1635, spent through its own wrapper at :1143 `protected function event($event)` doing :1145 `$this->events?->dispatch($event);` - handed one and keeps it"
  - id: c:cache-repository

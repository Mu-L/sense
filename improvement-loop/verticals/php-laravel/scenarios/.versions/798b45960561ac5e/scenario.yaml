#   draft aims at is the standing one: plain arm at or below 0.50 on `dependents` AND ours at
#   least 0.50 above it.
#
# ANCHOR: `Illuminate\Database\Connection`, precision 0.27 - LOWEST of the nine anchors
# profiled this session that can yield twelve dependent files across six areas.
#
# SEAM PROFILE (bench/lib/seam_hunt.py, quoted verbatim from this session)
#   Connection   --file src/Illuminate/Database/Connection.php
#       app caller files 21 | SCATTER 13 dirs | 'Connection' in 79 app files  PRECISION=0.27

name: Bagisto work session - audit what the catalogue record's kind still decides elsewhere
repo: bagisto
contract_symbol: Webkul\Product\Models\Product
contract_file: packages/Webkul/Product/src/Models/Product.php

description: |
  You are a maintainer of this store platform, about to take a capability away from the record
  the whole catalogue hangs off. Today that record will, on request, produce an object that
  answers behavioural questions on its behalf - is this sellable, is it something you hold
  stock of, is it made of parts, does it carry a discount, what does it cost - and anything
  that can reach the record can ask that object anything.
  The rework removes that. After it, a behavioural verdict must be asked for explicitly, by
  something that says which record it is asking about.
  What makes this dangerous is where those verdicts are being consumed. Most of them are not
  consumed by code that fetched a catalogue record. They are consumed by code holding
  something else entirely - a line on an order, a line in a basket, a row inside an option
  group, a stand-in that wraps a record without ever naming it, a bundle of data assembled by
  a caller - and that thing quietly forwards the question on. The site that breaks writes down
  neither the record nor the object that answered for it; it writes down whatever it happens
  to be holding. So the tie back to the catalogue record is made in a different file, one or
  two steps away, and nothing on the failing line says so.
  Before you touch it you have to know two things: what the record is, how it produces the
  object that answers for it and what that object can be asked; and then, separately, every
  site downstream whose own outcome is decided by one of those answers, with the line pinned,
  what it is actually holding, and how the question travelled from that thing to the record.
  Throughout, an answer that points at a place must give an exact file:line a teammate could
  jump straight to, plus one phrase on why it matters. A bare filename does not count, a set
  of names offered together with one shared reason and no location on any of them does not
  count, and a missed place is a broken storefront shipped.

steps:
  - name: Map the catalogue record contract
    prompt: >
      Task: orient, and be exact - the rest of the ticket is built on this and nothing later
      will send you back for it. Three things.
      First, the record itself. Name it precisely - the fully qualified name of the class and
      the exact file:line it is declared at - and say what code holding one can do with it,
      grouped by job rather than listed routine by routine, with the exact file:line where
      each named routine is defined. This platform gives the same short name to more than one
      thing, so say which one you settled on and how you told them apart, at file:line each.
      Second, the object that answers on the record's behalf. Give the exact line where the
      record builds it, the exact line where the record hands ITSELF to it, the base class
      every such object extends at file:line, and the exact line inside that base where the
      record ends up being kept. Say what happens when the record cannot build one, at
      file:line. Then list the behavioural questions that object can be asked - the ones whose
      answer differs by kind - each at the file:line where the base declares it.
      Third, and deliberately small: say once, briefly, that something other than a catalogue
      record can forward one of these behavioural questions onward on its own, and give ONE
      example line where that happens. Do not enumerate the rest here; I am not asking for
      that list yet and it earns nothing.
    checks:
      - type: response_richness
        value: "10"
        required: true
        description: The record named precisely with its declaring file:line and disambiguated from the same-named siblings, its own surface grouped by job with each routine located at file:line, the line where the answering object is built, the line where the record hands itself to it, the base class at file:line, the line inside that base where the record is kept, the failure line, and the behavioural questions the base declares each at file:line
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_graph
        required: false
        layer: adoption

  - name: Audit every dependent of the catalogue record contract
    prompt: >
      Task: this is the core of the ticket, and you are working it with the budget the first
      part already cost you. Take it as settled that the rework is happening: nothing will be
      able to obtain a behavioural verdict about one of these records implicitly any more.
      Answer the only question that matters after that: which sites in this codebase have
      their own outcome decided by one of those verdicts, and for each, what is the thing that
      site is actually holding and how does the question get from it to the record.
      A site counts when the value that steers its branch, its arithmetic or the payload it
      returns is a behavioural answer that only the record's kind can give. It counts whether
      the site asked the record directly or asked something that forwarded on its behalf - and
      the forwarding cases are the ones this rework is about, so they are the ones to work
      hardest for. It does NOT count when the site merely stores, fetches, passes along or
      displays a record and nothing about its own result turns on a kind-specific answer.
      The unit of the answer is a site - the routine and the line inside it - not a package
      and not a file, and one file can hold more than one. The record itself, the object that
      answers for it and that object's base class are not answers here: you pinned those in
      the first part and naming them again earns nothing.
      For each site the answer has three parts and only three: the exact file:line and the
      routine it sits in; what the site is holding when it asks, named concretely; and which
      verdict it takes and what its own outcome does with it.
      Keep it short - the coverage, the holder, the verdict, not the prose.
      Organise by area, one section per area, and treat an area as finished only when every
      site inside it is listed separately with its own location. If you run short, say what
      you had still not looked at rather than closing on what you have. A file:line with no
      statement of what is held and which verdict is taken is half an answer, and a group
      summarised instead of listed reads as a group with nothing in it.
    checks:
      - type: response_richness
        value: "6"
        required: true
        description: Every site located at the exact file:line with the routine it sits in named, what the site is holding stated concretely, and which kind-specific verdict it takes accounted for
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption

scoring:
  weights:
    correctness: 0.7
    efficiency: 0.3

gold:

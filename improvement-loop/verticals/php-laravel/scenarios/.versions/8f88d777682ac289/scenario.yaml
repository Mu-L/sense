  # ---- Step 1's answer, deliberately NON-SCORING. A FREE ROW IS A GIFT TO THE BASELINE, and
  # ---- these are exactly the rows both arms reach in one lookup - and the ones
  # ---- memorization_probe shows this model recites closed-book (recall 0.417 over the
  # ---- record's member list). Putting them here removes the floor they would otherwise put
  # ---- under the plain arm. Every line was opened and read this session. None appears in
  # ---- `dependents`.
  - id: contract-product
    group: contract
    match: [Product/src/Models/Product.php]
    relation: "packages/Webkul/Product/src/Models/Product.php:25 `class Product extends Model implements ProductContract` - the record itself; :347 `public function getTypeInstance(): AbstractType` builds the object that answers for it, :359 `$this->typeInstance->setProduct($this);` is where the record hands ITSELF over, and :299/:311/:323/:335 declare isSaleable/isStockable/totalQuantity/haveSufficientQuantity"
  - id: c:abstract-type
    group: contract
    match: [Product/src/Type/AbstractType.php]
    relation: "packages/Webkul/Product/src/Type/AbstractType.php:32 `abstract class AbstractType` - the base every answering object extends; :39 `protected $product;` is where a whole record is kept once handed over, and :394 `public function setProduct($product)` / :396 `$this->product = $product;` is the handover point itself"
  - id: c:product-repository
    group: contract
    match: [Product/src/Repositories/ProductRepository.php]
    relation: "packages/Webkul/Product/src/Repositories/ProductRepository.php:18 `class ProductRepository extends Repository` - the declared create-and-change layer, :44 `public function model(): string` names the record it stands for; it hands records out and scores nothing"

  # ---- DEPENDENTS: 16 rows, 16 files, 9 areas. Every one is a site whose own outcome turns
  # ---- on a kind-specific verdict about a catalogue record it did NOT fetch. Each row's
  # ---- `relation` quotes the line as it is in the file, read this session. Each row's file
  # ---- appears in the shown blast payload (55 direct_callers at MCP defaults).
  # ---- ZERO-$PRODUCT is on every row (census quoted in the header); OUTSIDE-BOTH marks the
  # ---- six files that write neither `$product`/`->product` nor the bare word `Product`.
  # ---- Recorded, not used as a gate.
  - id: d:invoice-item-inventory-flag
    group: dependents
    match: [Sales/src/Repositories/InvoiceItemRepository.php]
    relation: "packages/Webkul/Sales/src/Repositories/InvoiceItemRepository.php:28 `if (! $data['product']->manage_stock) {` inside `updateProductInventory($data)` at :22 - the site is holding a bag of invoice data, not a record; it reaches the catalogue record only as the string key 'product' inside that array, and the stock-management flag it reads there decides whether the whole draw-down at :32 and :44 happens at all. OUTSIDE-BOTH"
  - id: d:refund-return-qty-branch
    group: dependents
    match: [Sales/src/Repositories/RefundRepository.php]
    relation: "packages/Webkul/Sales/src/Repositories/RefundRepository.php:131 `$childOrderItem->getTypeInstance()->isStockable()` inside `create(array $data)` at :40 - the site is holding a CHILD ORDER LINE, and that line forwards the stockability question to the catalogue record's kind object; the verdict decides whether :134 returns the quantity to inventory. OUTSIDE-BOTH"

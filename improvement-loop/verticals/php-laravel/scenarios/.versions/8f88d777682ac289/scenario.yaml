    relation: "packages/Webkul/Admin/src/Http/Controllers/Sales/ShipmentController.php:121 `if ($orderItem->getTypeInstance()->isComposite()) {` inside `isInventoryValidate(&$data)` at :101 - the site is holding a shipment form payload and an ORDER LINE fetched from it; the composite verdict decides whether available quantity is summed per child at :129 or once at :141, and the result gates whether the shipment may be created"
  - id: d:cart-quantity-box

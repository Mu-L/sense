    relation: "packages/Webkul/Sales/src/Repositories/InvoiceRepository.php:110 `if ($orderItem->getTypeInstance()->isComposite()) {` inside `create(array $data, ...)` at :44 - the site is holding an ORDER LINE; the composite verdict from the catalogue record's kind object decides whether child invoice items are written at :116 or the single-item path at :151 runs, and at :138/:153 the same object is asked for stockability to decide the inventory write"
  - id: d:orderitem-return-stockable
    group: dependents
    match: [Sales/src/Repositories/OrderItemRepository.php]
    relation: "packages/Webkul/Sales/src/Repositories/OrderItemRepository.php:145 `if ($orderItem->getTypeInstance()->isStockable()) {` inside `returnQtyToProductInventory` at :133 - the site is holding an ORDER LINE and takes the stockability verdict to decide whether reserved quantity is released at all; the same routine's sibling `manageInventory` at :85 branches on the composite verdict from the same object"
  - id: d:order-reorder-saleable
    group: dependents
    match: [Sales/src/Models/Order.php]
    relation: "packages/Webkul/Sales/src/Models/Order.php:415 `if (! $item->product?->getTypeInstance()->isSaleable()) {` inside `canReorder(): bool` at :402 - the site is holding an ORDER and walks its lines; a single not-saleable verdict from one line's catalogue record kills reordering for the whole order, and at :288 `haveStockableItems` takes the stockability verdict off the same route"

# Per-scenario rubric for the LLM judge layer.
#
# Four criteria per step, weights summing to 1.0: map_quality 0.40 / specificity 0.25
# / justification 0.20 / uncertainty 0.15.
#
# CYCLE 1 / ATTEMPT 4 on laravel-framework, TWO-STEP PROBE, RE-QUESTION
# (plans/cycle-1-craft-the-scenario/01-author.md). TWO steps, names verbatim and in the order
# of scenarios/laravel-framework.yaml (the judge pairs by name).
#
# WHAT CHANGED FROM ATTEMPTS 1, 2 AND 3, AND WHY THE RUBRIC HAD TO CHANGE WITH IT
# Attempt 1 scored CALLS (plain arm 0.9375), attempt 2 scored HOLDS (0.8333), attempt 3 scored
# REACHING THROUGH AN INTERMEDIATE (0.6667). The third one did not fail on its mechanism: the
# plain arm took eight of its twelve rows and missed four, and both bands are the same
# mechanism. What it took were the eight pieces of core wiring a frontier model can recite -
# a repository holding a store, a translator holding a loader, a factory holding a finder, a
# compiler extending a compiler. All eight are non-scoring anchors now.
# This draft scores ACQUISITION: how a routine came to have an instance in its hands when
# nothing was ever injected into it. The ticket re-binds one shared name, so the whole answer
# is the set of places that re-binding does not reach, each with the route that got them there.
#
# WHY map_quality carries the most weight: coverage and route are one question. A place named
# without how it obtained an instance cannot be triaged - the maintainer cannot tell whether it
# is fixed by the swap or has to be rewritten, which is the only decision this ticket makes.
# Four routes are of a kind the file itself gives no sign of (an inherited field, a promise on
# a field, a wiring line by short name); eight are a construction made on the spot inside a
# routine about something else. An answer that lists holders instead has answered the previous
# three questions, all of which failed on this repo.
#
# WHY specificity demands the routine's line AND its name AND the route AND the reach verdict
# AND the failure: the failure this criterion exists to catch is a run of places named together
# under one shared reason with no location on any of them. It also catches the inverse of the
# first three attempts: a line where the object is HELD is the half the swap fixes for free,
# was pinned in step 1, and offering it here is answering the questions that already failed.
#
# WHY step 1 asks for the direct holders explicitly: they are the free half, both arms will
# reach them, and they do not score. Naming them in step 1 is deliberate - it puts the
# discriminator on the far side of them. What step 1 does NOT ask for is the roll of that far
# side: on the neighbouring repo in this vertical, asking step 1 for the enumerated working
# ground moved BOTH arms together, because the plain arm wrote its covering sweep in step 1 and
# re-read the same output in step 2.
audience: |
  An AI coding agent that will use this answer to replace the object every part of this
  framework is handed in order to read and write files on the local disk. Today that object is
  a plain synchronous wrapper: one instance is made at boot, registered under a short name,
  handed to whatever asks, every routine blocks until the disk answers, and a failure comes
  back as an exception thrown where the call was made. After the change the work happens off
  the calling thread and a failure surfaces where the work is awaited, not where it was
  requested. The plan is to re-bind the short name and then fix up whatever that does not
  reach. Score for that agent, not a human reader and not a docs page.
  A perfect answer leaves the agent able to make that change knowing two things. First, what
  the object is today: what it does grouped by job, where the single shared instance is made
  and under what short name it is registered, how a caller that never names the type still ends
  up holding it, where a disk failure surfaces today, and which collaborators are handed one
  and keep it - each located at file:line. Second, and this is what decides the answer: every
  place the re-binding will not reach, with the route by which that place got hold of an
  instance of its own.
  The distinction the whole ticket turns on is between code that is HANDED the object and code
  that OBTAINS one. The first half is fixed by the swap and belongs to the first part of the
  answer; naming it again in the second earns nothing. The second half is the work, and the
  routes divide into a few kinds. Some routines construct their own where they stand, inside a
  routine whose file is about something else entirely - a static helper editing an environment
  file, a debug page listing directories, an installer rewriting config, a testing helper
  wiping a directory - so nothing was ever registered or injected for them. Some inherit the
  field from a class they extend, so the declaration lives in a file they never open and their
  own file has nothing in it to find. Some write only a promise on a field, and the thing that
  keeps that promise is itself one of the holders, so the file names an idea rather than a type
  that leads anywhere. And some are linked at wiring time out of a short string, so no type is
  written on either side of the link.
  Most of this layer sits in parts of the framework whose own subject has nothing to do with
  disks or files. The part of the tree obviously about file access holds the object itself and
  the collaborators built out of it; an answer dense there and thin elsewhere has enumerated
  inside one search scope and mistaken it for the framework.
  Every place must be pinned to the exact file:line of the routine with that routine named,
  with the route by which it obtained an instance and any intermediate named at its own
  file:line, with whether re-binding the shared name reaches it, and with one phrase on what
  goes wrong for that routine once the work no longer blocks and the failure no longer surfaces
  where it was requested.

steps:
- name: Map the local file access contract
  criteria:
    map_quality:
      weight: 0.4
      question: |
        Is the object presented as one connected picture - what it does grouped by job, where
        the single shared instance is made, the short name it is registered under, how a
        caller that never names the type still ends up holding it, and where a disk failure
        surfaces today - rather than as a list of routines or a roll of places the name
        appears? The registration under a short name and the failure path are the two that
        matter most: between them they are why so much of this framework can depend on the
        object without naming it, and the registration line is the one the ticket's swap
        actually changes. An answer that locates both and says so has understood the ticket.
        The step then asks for the collaborators that are HANDED one and keep it. Are they
        named, each pinned to the field or the constructor that fills it, and does each carry a
        phrase on what it does with the handle? This part is deliberately the easy part and it
        is asked for on purpose - it is the half the swap fixes for free and the next step is
        about everything else - so score coverage and location here, not difficulty.
        The step finally asks for a deliberately SMALL third thing: the KINDS of route by which
        other code obtains an instance, one example each. Score whether the kinds are genuinely
        distinct and correctly characterised. Do NOT reward an exhaustive enumeration of those
        places themselves: it was not asked for, and a long located list is not a better answer
        here than four accurate kinds. Could the next step act from this orientation with
        targeted lookups rather than a fresh exploration?
    specificity:
      weight: 0.25
      question: |
        Does every place the answer names carry an exact file:line AND the name of the routine
        or class it lives in? A bare filename is not specific. A file:line with nothing named
        around it is not specific - the maintainer asked whose code it is, not where the
        character offset falls. Where the answer names the construction of the shared instance,
        the short name it is registered under, or a collaborator's field, is the line that
        actually constructs, registers or declares located, and not just asserted from a class
        name or a familiar convention?
    justification:
      weight: 0.2
      question: |
        Does each part carry one phrase on what it contributes - what the registration buys a
        caller that has only a name, what each holder actually does with its handle, where a
        refusal from the disk lands today - and does the answer connect those facts to why
        re-binding one name is enough for this half of the framework and not for the rest,
        rather than restating the list of routines?
    uncertainty:
      weight: 0.15
      question: |
        Does the answer separate what it verified by reading from what it inferred from a name
        or a familiar framework convention? This matters more than usual here: closed-book,
        this model can name 46 of the object's 54 members, so its surface invites confident
        recitation and saying which parts were actually opened is worth more here than
        elsewhere. Is anything the session could not resolve named as such rather than smoothed
        over, and are the kinds of route offered as the ones it established rather than as a
        complete taxonomy it did not check?
- name: Audit every dependent of the local file access contract
  criteria:
    map_quality:
      weight: 0.4
      question: |
        COVERAGE AND ROUTE, and the two are one question here. Is every routine that will keep
        doing local file work outside the re-binding listed separately, each with the route by
        which it got hold of an instance and with any intermediate named? A place named with no
        route is half a row: without it the maintainer cannot tell whether the swap fixes that
        place or whether it has to be rewritten, and that is the only decision this ticket
        makes.
        Score the DISTINCTION the ticket turns on: obtaining versus being handed. A place that
        receives the object and keeps it is NOT an answer here - it is fixed by the swap, it
        belongs to the previous step, and an answer built out of holders and their call sites
        has answered the question that has already failed three times on this repo.
        Score the KINDS of route, and whether the answer catches all of them rather than the
        one it found first: a routine that builds its own instance where it stands, in a file
        whose subject is something else; a class that inherits the field from something it
        extends, where the routine's own file declares nothing at all; a narrow promise written
        on a field whose only concrete satisfier is a holder, so the file names an idea rather
        than a type; and a link made at wiring time out of a short string, where no type is
        named on either side. The routes of the last three kinds sit in files that give no sign
        of the dependency at all, and an answer that finds only the routines whose own file
        mentions the object has stopped at the shallow edge.
        Score WHERE the answer looked. Most of this layer sits in parts of the framework whose
        own subject has nothing to do with disks or files. An answer dense in the part of the
        tree obviously about file access and thin elsewhere has enumerated inside one search
        scope and mistaken it for the framework; that is the exact failure this criterion
        names.
        Is the answer organised by area with each area's places listed individually, and is
        what was not reached said plainly rather than closed over?
    specificity:
      weight: 0.25
      question: |
        Does every place carry an exact file:line on the routine, AND that routine's name, AND
        how it obtained an instance with any intermediate located at its own file:line, AND
        whether re-binding the shared name reaches it, AND one phrase on the failure? All five,
        per row. A bare filename is not specific. A run of places named together under one
        shared reason with no location on any of them is the failure this criterion exists to
        catch, and it does not become specific because the reason is correct. Is the located
        line the line where the instance is obtained - the construction, the inherited call,
        the field declaring the promise, the wiring expression - rather than a line where the
        object is held by something that was handed it?
    justification:
      weight: 0.2
      question: |
        Is the phrase per row a consequence of THAT route, rather than a restatement that the
        place touches the disk? "Breaks if the file API changes" is not a justification.
        "It constructs its own inside a static routine with no container in reach, so
        re-binding the name cannot reach it at all", "the disk read happens in the parent, so
        nothing in this file will show the dependency and nothing in it will be updated", "the
        link is a short string, so no rename or type change anywhere reaches it", "the field
        promises a store and the store is the holder, so this file sees a failure it has no
        vocabulary for", "the routine returns before the work is awaited, so the exception
        arrives after its caller has moved on" are. Does the answer say, at least in aggregate,
        which places the swap fixes and which have to be rewritten?
    uncertainty:
      weight: 0.15
      question: |
        Does the answer distinguish routes it traced by reading from ones it inferred from a
        name, a familiar convention, or a memory of this framework? That distinction matters
        more than usual here: this is a famous framework, and asserting that one object holds
        another because it usually does is not the same as having read the declaration that
        says so. Inherited fields and promises on a field especially invite guessing, and a
        place asserted with a plausible intermediate that is not the real one is worse than an
        admitted gap. Is coverage claimed honestly - which areas it swept and which it did not
        reach - and where the concrete satisfier of a narrow promise was ambiguous, does it say
        so instead of picking one silently?

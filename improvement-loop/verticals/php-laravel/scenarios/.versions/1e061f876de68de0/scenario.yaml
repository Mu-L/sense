name: Coolify work session - audit the server contract before a rework
repo: coolify
contract_symbol: Server
contract_file: app/Models/Server.php

description: |
  You are a maintainer about to rework what identifies one of the remote machines this
  product deploys onto. Today a machine is a row with a number, a short handle, a display
  name and a network address, and code all over the product treats any one of those as a
  durable way of getting back to it later. The rework breaks that: a machine will be able to
  be renamed, re-addressed and replaced by a different one standing in for it, so a scrap of
  identity taken now is no longer guaranteed to mean the same machine when it is read back.
  Before you touch it you have to know two things: how a machine's identity is established,
  changed and torn down today, and how far the change reaches - in particular every place
  that keeps one of those scraps past the moment it had the machine itself, because those are
  the places that will silently point at the wrong machine, or at no machine, without a single
  line of them changing. Throughout, an answer that points at a place must give an exact
  file:line a teammate could jump straight to, plus one phrase on why it matters. A bare
  filename does not count, a set of names offered together with one shared reason and no
  location on any of them does not count, and a missed dependent is a regression shipped.

steps:
  - name: Map the server contract
    prompt: >
      Task: orient, and be thorough - the rest of the ticket is built on this. Start with the
      one thing everything else leans on: what identifies one of these machines, and where
      that identity is established, changed and destroyed. Trace it end to end. Show where the
      identifying fields are normalised as the record is written and where the previous value
      of the changing one is preserved; where a freshly created machine causes further records
      to be seeded from it, including any that take a COPY of an identifying field rather than
      a link back to it; where a lookup by identity is served out of a per-request cache
      instead of the database, and where that cache is emptied; and what the removal path does
      and does not clean up behind it. For each one give the file:line, the name of the
      routine it lives in, and one phrase on what it contributes. Then say, in a few
      sentences, what a rework of identity would have to preserve for everything already
      written down to keep meaning what it means today. A place named without the routine it
      lives in does not count, and neither does a routine named without the file:line where it
      is defined.
    checks:
      - type: response_richness
        value: "8"
        required: true
        description: The identity lifecycle traced through the routines that establish, change and tear it down, each located
      - type: mcp_tool_used
        value: sense_graph
        required: false
        layer: adoption

  - name: Audit every dependent of the server contract
    prompt: >
      Task: this is the core of the ticket, and you are working it with the budget the first
      part already cost you. Assume the whole of it changes. What I need before that ships is
      how far the change reaches through this product - the complete set of places that would
      have to be reviewed, held as ONE set, rather than a sample of it assembled a search at a
      time, because a set built that way is finished exactly when the searching stops and I
      cannot tell that from finished. The places that are handed one of these machines and
      work with it while they have it are the near edge of that set; you may list those
      compactly, a line each, and move on. What the ticket actually turns on is the far edge of
      the same set: every place that kept a SCRAP of a machine's identity after the machine
      itself was gone from its hands. A bare number written into a stored record, or into a row
      that exists only to join two things together; a short handle pasted into a link or into a
      message that leaves this process for somewhere we do not control; a display name copied
      into a value that is saved and read back later rather than looked up again; a network
      address used as the thing a lookup is keyed on; an identifier that belongs to a system we
      do not own, kept on our side so the same machine can be named over there; a string
      assembled out of one of those and then used to gate, count, cancel or de-duplicate
      something. The place then trusts that scrap to still mean the same machine when it comes
      back to it - a request later, a restart later, or in another system entirely - and that
      trust is exactly what the rework withdraws. Such a place is usually doing some other job
      altogether and may never touch a machine at all; nothing in the line says a remote
      machine is involved, only that a value was kept. So the answer you owe has three parts
      for every one of them: the exact file:line where the scrap is taken, written or read
      back, and the routine that line sits in; WHICH scrap it is and how long it lives - inside
      one request, inside one stored record, or outside this product entirely; and one phrase
      on what this place would start getting wrong the first time that scrap no longer resolves
      to the machine it was taken from. Organise the answer by area, one section per area, and
      treat an area as finished only when every place inside it is listed separately with its
      own location - if you cannot finish an area, say which one and say what you left in it,
      because an area you quietly summarised reads as an area with nothing in it. A file:line
      with no routine named around it does not count, a place named without saying which scrap
      it kept does not count, and a missed one is a regression shipped.
    checks:
      - type: response_richness
        value: "6"
        required: true
        description: Every identity-keeping place located at file:line with the scrap it keeps, its lifetime and its own consequence
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption

scoring:
  weights:
    correctness: 0.7
    efficiency: 0.3

gold:
  # ---- ANCHORS: where identity is established, cached and torn down. Step 1's answer, and
  # ---- the near edge step 2 lets the agent list compactly. Both arms reached all four in
  # ---- attempt 3 (contract 4/4 on both) and they do NOT score. Every line below was opened
  # ---- and read in this session. None of these four files appears in `dependents`.
  - id: contract-model
    group: contract
    match: [Models/Server.php]
    relation: "app/Models/Server.php:135 `protected static function booted()` - the identity lifecycle in one place: the saving hook trims the address and preserves the old one at :147 `$payload['ip_previous'] = $server->getOriginal('ip');` when it changes, and the created hook at :157 seeds the settings row at :158, a destination at :170/:174, and then TWO stored variables that take a COPY of identity rather than a link - :191 `'key' => 'COOLIFY_SERVER_UUID'` with `'value' => $server->uuid` at :192, and :199 `'key' => 'COOLIFY_SERVER_NAME'` with `'value' => $server->name` at :200, both written once and never refreshed"
  - id: c:identity-map
    group: contract
    match: [Models/StandaloneDocker.php]
    relation: "app/Models/StandaloneDocker.php:135 `$server = Server::findCached($this->server_id);` inside `getServerAttribute()` (def at :127) - the read side of identity: a stored integer is turned back into a machine through the per-request identity map declared at `app/Models/Server.php:131` and served by `findCached()` at :230, which fills the cache at :241 and is emptied only by `flushIdentityMap()` at :251; this is the mechanism every stored id in the product bottoms out in"
  - id: c:server-setting
    group: contract
    match: [Models/ServerSetting.php]
    relation: "app/Models/ServerSetting.php:59 `'server_id',` opening the fillable list, with `public function server()` at :247 returning the belongsTo - the settings record created for every machine at `app/Models/Server.php:158`, the simplest example of identity kept as a link rather than as a copy"
  - id: c:server-delete
    group: contract
    match: [Server/Delete.php]
    relation: "app/Livewire/Server/Delete.php:60 `$this->server->delete();` inside `delete($password, $selectedActions = [])` (def at :34), followed at :61 by `DeleteServer::dispatch(` handed nine SCALARS across :62-:70 - the id, the cloud-provider instance ids, the token id and the team id - rather than the machine; the teardown path, and the point after which every scrap kept elsewhere in the product refers to a machine that no longer exists"

  # ---- DEPENDENTS: fourteen rows, ONE PER FILE, across thirteen areas
  # ---- (app/Notifications/Container, app/Models, app/Jobs, app/Livewire,
  # ---- app/Livewire/Boarding is GONE - see the cut list in the header -
  # ---- app/Livewire/Destination/New, app/Livewire/Project/New,
  # ---- app/Livewire/Project/Application, app/Livewire/Project/Shared,
  # ---- app/Livewire/Settings, app/Livewire/Server, app/Livewire/Server/Proxy,
  # ---- app/Livewire/Server/CaCertificate, app/Livewire/Server/CloudProviderToken).
  # ---- Every row is in the shown `sense_blast` payload for `Server` quoted in the header.
  # ---- Every line below was opened and read in this session.
  # ----
  # ---- No file cited by any previous attempt's baseline is here: the seventeen from
  # ---- attempt 1, the eleven from attempt 2 and the five from attempt 3 are all excluded.

  # -- scrap: identity copied into a message that leaves this product for a system we do not
  # -- control. The copy is taken at render time and is never revisited.
  - id: d:container-stopped
    group: dependents
    match: [Container/ContainerStopped.php]
    relation: "app/Notifications/Container/ContainerStopped.php:113 `'server_name' => $this->server->name,` with `'server_uuid' => $this->server->uuid,` at :114 inside `toWebhook()` (def at :106) - an alert renders a machine's display name and handle into a payload posted to somebody else's endpoint, and the same name is interpolated into five other channel bodies (mail :27, discord :41, telegram :54, pushover :85, slack :93); the webhook keys are a public contract other systems parse, so a rename makes every already-delivered alert refer to a machine nobody can find, and a stand-in machine makes them refer to the wrong one. The one row on this repo measured OUTSIDE a baseline's reach twice: baseline 0/1 in attempt 1 and 0/1 in attempt 3, sense 3/3 across both"

  # -- scrap: an integer persisted in a stored row. The row outlives every process, and the
  # -- line that keeps it says nothing about a remote machine at all.
  - id: d:shared-env-var
    group: dependents
    match: [Models/SharedEnvironmentVariable.php]
    relation: "app/Models/SharedEnvironmentVariable.php:22 `'server_id',` in the fillable list, under the `// Type and relationships` comment, with `public function server()` at :64 - the sharpest row in this group: two rows of this table are created at `app/Models/Server.php:190` and `:198` whose stored VALUE is a copy of the machine's handle and display name, so this table holds identity twice over - once as a link that a rename follows, and once as a value frozen at creation that it does not"
  - id: d:ssl-certificate
    group: dependents
    match: [Models/SslCertificate.php]
    relation: "app/Models/SslCertificate.php:16 `'server_id',` in the fillable list, sitting between `'resource_id'` and `'common_name'` in the same array - a generated certificate is filed against the machine it was issued for, and the certificate material at :10-:11 is encrypted at :28-:29 and only valid where it was installed; the row survives the machine, so a re-used id hands one machine's private key to another"

  # -- scrap: identity carried through a redirect or a form step as a loose parameter, then
  # -- written into whatever gets created at the end of the flow.
  - id: d:new-resource-select
    group: dependents
    match: [New/Select.php]
    relation: "app/Livewire/Project/New/Select.php:441 `'server_id' => $this->server_id,` inside the redirect built by `setPostgresqlType(string $type)` (def at :432), repeated at :456 in `whatToDoNext()` (def at :446) - the chosen machine survives the wizard as a bare number in a URL, and it ARRIVED as one too at :78 `$queryServerId = request()->query('server_id');` before being resolved back at :85; the property that carries it is declared `public string $server_id` at :19, so nothing in this component holds a machine between steps - only the number does, across a full browser round trip"
  - id: d:new-destination
    group: dependents
    match: [Destination/New/Docker.php]
    relation: "app/Livewire/Destination/New/Docker.php:87 `'server_id' => $this->selectedServer->id,` inside `submit()` (def at :74) on the swarm branch, and again at :98 on the non-swarm branch - the moment a machine's identity becomes a permanent row: the destination created here is what every deployed resource later walks through to find its machine, and it stores the number, not the machine; the name it is filed under at :85 was frozen out of the machine's display name at :70-:71 `$name = data_get($this->selectedServer, 'name', new_public_id());`"
  - id: d:deployment-navbar
    group: dependents
    match: [Application/DeploymentNavbar.php]
    relation: "app/Livewire/Project/Application/DeploymentNavbar.php:101 `$server_id = $this->application_deployment_queue->server_id ?? $this->application->destination->server_id;` with the build-machine variant at :100, both inside `cancel()` (def at :91) - a cancellation reads TWO ids back out of a queued row written when the deployment started, then resolves whichever one applies at :110-:112 to send the kill command built at :99; the queued row can be hours old, so this is the clearest case of a scrap outliving its machine - the cancel lands on whatever now answers to that number, or on nothing, and the deployment is marked cancelled either way at :104-:106"

  # -- scrap: identity used as the KEY of the lookup rather than as its result, or nailed down
  # -- as a literal.
  - id: d:settings-updates
    group: dependents
    match: [Settings/Updates.php]
    relation: "app/Livewire/Settings/Updates.php:40 `$this->server = Server::findOrFail(0);` inside `mount()` (def at :34) - identity as a HARDCODED CONSTANT: the machine the product itself runs on is addressed by the literal number zero, guarded only by `if (! isCloud())` at :39, and the whole self-update path hangs off it; nothing here would fail loudly if row zero stopped being the host"
  - id: d:proxy-dynamic-config
    group: dependents
    match: [Proxy/DynamicConfigurations.php]
    relation: "app/Livewire/Server/Proxy/DynamicConfigurations.php:66 `$this->server = Server::ownedByCurrentTeam()->whereUuid(request()->server_uuid)->first();` inside `mount()` (def at :62) - the handle is pulled straight off the request, never held as a property, and resolved once per page load; the scrap's lifetime is one request, which is why it belongs here and not with the holders - the page then reads and writes files on whatever that handle resolved to at :47 and :54, so a handle that has moved edits the wrong machine's proxy configuration"

  # -- scrap: identity copied outward into a projection this product itself reads back.
  - id: d:global-search
    group: dependents
    match: [Livewire/GlobalSearch.php]
    relation: "app/Livewire/GlobalSearch.php:521 `'id' => $server->id,` opening the mapped entry built by the `->map(function ($server)` closure at :519 inside `loadSearchableItems()` (def at :248), spanning :520-:530, which flattens a machine into a search record carrying its display name at :522, its handle at :524, a link at :526 and a `search_text` blob at :529 concatenating the name, the ADDRESS and the description - and the whole projection is stored behind `Cache::remember($cacheKey, 300, ...)` at :253, so every field is a copy that is up to five minutes stale before the operator navigates from it; the chosen one is then kept as `public $selectedServerId` at :56 and resolved back at :1218"

  # -- scrap: identity written into a row whose only job is to join two things, so the number
  # -- is the entire dependency and nothing around it is about a machine.
  - id: d:additional-network-pivot
    group: dependents
    match: [Shared/Destination.php]

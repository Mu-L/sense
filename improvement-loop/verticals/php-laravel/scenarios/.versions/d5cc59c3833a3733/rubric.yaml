# Per-scenario rubric for the LLM judge layer.
#
# Four criteria per step, weights summing to 1.0: map_quality 0.40 / specificity 0.25
# / justification 0.20 / uncertainty 0.15.
#
# CYCLE 1 / ATTEMPT 1 on bagisto, TWO-STEP PROBE
# (plans/cycle-1-craft-the-scenario/01-author.md). TWO steps, names verbatim and in the
# order of scenarios/bagisto.yaml (the judge pairs by name).
#
# WHAT THIS RUBRIC IS SCORING, AND WHY IT IS NOT SCORING A CALL LIST
# Twelve measured PHP cells on the two neighbouring repos in this vertical all lost the same
# way: the audited relationship was written ON the matched line, so one search printed the
# answer in the scored form. This scenario scores the ROUTE by which a site came to be
# holding the catalogue record - a relation attribute declared on a different model, a key
# in a parameter bag, the implicit subject of a response wrapper, an untyped argument, an
# import alias, a polymorphic step whose destination is a stored value rather than a class
# name. Two things follow for the judge. The declared write path and the per-kind behaviour
# family are NOT answers in step 2 - that half is pinned in step 1 on purpose, and
# re-offering it is answering the easy question. And a FILE is not an answer: several scored
# files hold more than one candidate line, and a route named without the line it was
# established at leaves the maintainer where they started.
#
# WHY map_quality carries the most weight: coverage and placement are one question. The
# scored set is seventeen holding sites over fourteen areas - checkout, tax, invoicing,
# refunds, order reordering, shipment validation, a view-render listener, storefront and
# admin response wrappers, a form request, a data importer, a configurable-option helper and
# the flat indexer - and most of them sit outside the package the record lives in. The
# failure this criterion exists to catch is an answer dense in the catalogue package and
# thin everywhere else: enumerating inside one search scope and mistaking it for the
# codebase.
#
# WHY specificity demands the line AND the routine AND the route: the failure it exists to
# catch is a run of places named together under one shared reason with no location on any of
# them. There is a second failure specific to this contract: for five of the scored rows the
# route is established in a THIRD file (a relation declaration on a cart line or an order
# line), so an answer that pins the holding site without saying where the handle came from
# has given the maintainer half of what the rework needs.
#
# WHY step 1 asks for the write path explicitly: it is the free half, both arms reach it in
# one lookup, it does not score, and pinning it in step 1 puts the discriminator on the far
# side of it. What step 1 does NOT ask for is the enumeration of the far side: measured on
# the neighbouring repo in this vertical, asking step 1 for the enumerated working ground
# moved BOTH arms together, because the plain arm wrote its covering sweep in step 1 and
# re-read the same output in step 2.
#
# WHY uncertainty is worth its weight here: memorization_probe returns ok:false at recall
# 0.431 on this record's own member surface (31 of 72 members named closed-book, samples
# 0.0 / 0.375 / 0.431). Every one of those members sits in the non-scoring contract group,
# so recitation buys nothing on the discriminator - but it makes confident assertion cheap,
# and an asserted holding site in a file that does not contain one is worse than an admitted
# gap. The clone is a single squashed commit, so nothing here can be churn-dated; the judge
# should reward an answer that says which lines it actually opened.
audience: |
  An AI coding agent about to rework the catalogue record this store platform hangs off.
  Today any code that ends up holding one of these records can lean on the whole of it: it
  can ask for a field that was never declared on the record and get an answer, and it can ask
  the record to hand back the object that knows how its particular kind behaves - how it is
  priced, whether it can be sold, whether stock applies. After the change, code has to
  declare up front what it leans on, and code that leans on something undeclared stops
  working. Score for that agent, not a human reader and not a docs page.
  A perfect answer leaves the agent able to make that change knowing two things. First, what
  the record is today: what it relates outward to, how it answers for an undeclared field,
  how it produces the per-kind behaviour object and what decides which one comes back, plus
  the declared layer whose job is to make and change these records and the family of classes
  that each know one kind - each located at file:line. Second, and this is what decides the
  answer: every place that ends up holding one of these records, with the route it came by
  and what it leans on.
  The distinction the whole ticket turns on is between the DECLARED relationship and the
  UNDECLARED holding. The declared half is written down with a type on it, it is the subject
  of the first part of the answer, and naming it again in the second earns nothing. A holding
  site is a line somewhere else entirely - in the middle of a routine about calculating tax,
  validating a shipment, rendering a storefront card, building an import batch - where the
  code has one of these records in its hands and never says so. It got it by stepping across
  from a different record it already had, by pulling it out of a bag of values it was passed,
  by being one itself and referring to itself, by being handed one as an argument with no
  type on it, or by knowing it under an alias.
  The route decides the remedy, and the remedies are not the same. A site handed the record
  as a typed argument can declare what it leans on. A site that pulled it out of a parameter
  bag by string key has nothing to declare it on. A site that stepped across a relation
  depends on a declaration in a third file that it does not own. A site whose step across is
  polymorphic - the destination decided by a stored value rather than named in source -
  cannot be found by reading the route at all. Two lines one search prints one after the
  other can need completely different answers.
  Most of this layer sits in parts of the codebase whose own subject has nothing to do with
  the catalogue. The package obviously about the record holds the record itself and the
  pieces built directly on it; an answer dense there and thin elsewhere has enumerated inside
  one search scope and mistaken it for the codebase.
  Every holding site must be pinned to the exact file:line with the routine it sits in named,
  with the route it came by and where that route was established, with what the site leans on
  the record for, and with one phrase on what breaks if nothing is done.

steps:
- name: Map the catalogue record contract
  criteria:
    map_quality:
      weight: 0.4
      question: |
        Is the record presented as one connected picture - what it relates outward to, how it
        answers for a field that was never declared on it, and how it produces the object that
        knows how its own kind behaves - rather than as a list of routines or a roll of places
        the name appears? Two of those matter most and they are the two the ticket turns on:
        that asking the record for an undeclared field SUCCEEDS, because a lookup is done
        behind the scenes rather than a property being read; and that the per-kind behaviour
        object is chosen at runtime from configuration keyed by a value stored on the record,
        so nothing in source names which class comes back. An answer that locates both, says
        what decides the choice and what happens when nothing matches, has understood the
        ticket.
        The step then asks for the declared write path and the family of per-kind behaviour
        classes. Are they named at file:line with a phrase on what each is responsible for?
        This part is deliberately the easy part and it is asked for on purpose - it is the
        half whose relationship to the record is written down where anyone can see it, and
        the next step is about the other kind - so score coverage and location here, not
        difficulty.
        The step finally asks for a deliberately SMALL third thing: what it looks like when a
        piece of code is holding one of these records without ever naming it, and why nothing
        in that file's shape gives it away. Score whether that is characterised correctly,
        with one located example. Do NOT reward an exhaustive enumeration of those places: it
        was not asked for, and a long located list is not a better answer here than one
        accurate observation. Could the next step act from this orientation with targeted
        lookups rather than a fresh exploration?
    specificity:
      weight: 0.25
      question: |
        Does every place the answer names carry an exact file:line AND the name of the routine
        or class it lives in? A bare filename is not specific. A file:line with nothing named
        around it is not specific - the maintainer asked whose code it is, not where the
        character offset falls. Where the answer names the routine that produces the per-kind
        behaviour object, the override that answers for an undeclared field, the layer that
        creates and updates records, or a per-kind class, is the line that actually resolves,
        overrides, creates or declares located - and not just asserted from a class name or a
        familiar framework convention?
    justification:
      weight: 0.2
      question: |
        Does each part carry one phrase on what it contributes - what asking for an undeclared
        field actually does, what decides which per-kind object comes back and what happens
        when nothing matches, what the write path is responsible for that the record is not -
        and does the answer connect those facts to why a declared relationship and an
        undeclared holding have completely different fates after the change, rather than
        restating the list of routines?
    uncertainty:
      weight: 0.15
      question: |
        Does the answer separate what it verified by reading from what it inferred from a name
        or a familiar framework convention? This matters more than usual here: closed-book
        this model can already name a third of this record's member surface, so it invites
        confident recitation, and saying which parts were actually opened is worth more here
        than elsewhere. This platform also gives the record's short name to an empty marker
        interface, to a swap-in proxy class and to several unrelated classes in other
        packages - does the answer show it settled which one it was looking at where that
        mattered? Is anything the session could not resolve named as such rather than smoothed
        over, and is the observation about code holding a record it never names offered as
        something it established rather than as a complete taxonomy it did not check?
- name: Audit every dependent of the catalogue record contract
  criteria:
    map_quality:
      weight: 0.4
      question: |
        COVERAGE AND PLACEMENT, and the two are one question here. Is every holding site
        listed separately, each pinned to its own routine, with the route it came by named? A
        place named with no route is half a row: the remedy depends entirely on how the code
        came to be holding the record and whether anything can be declared at that point, and
        that is the only decision this ticket makes.
        Score the DISTINCTION the ticket turns on: the declared relationship versus the
        undeclared holding. The layer whose job is to create and update these records, and the
        family of classes that each know one kind, are NOT answers here - they were pinned in
        the previous step, and an answer built out of them has answered the easy half.
        Score whether the answer found routes of more than one kind - stepped across from a
        different record through a relation declared in a third file, pulled out of a bag of
        values by string key, the implicit subject of a wrapper that IS the record, handed in
        as an argument with no declared type, known under an import alias, or reached by a
        polymorphic step whose destination is a stored value and appears in no source line. An
        answer in which every row looks the same has either found only one band or has stopped
        reading at the first hit.
        Score WHERE the answer looked, and also HOW FINELY. These sites sit in parts of the
        codebase whose own subject has nothing to do with the catalogue - tax calculation,
        invoicing, refunds, reordering, shipment validation, view-render listeners, storefront
        and admin response payloads, form validation, data import, search indexing - and a
        single file can hold more than one. An answer dense in the package obviously about the
        record, or one that names files rather than routines, has stopped at the shallow edge;
        that is the exact failure this criterion names.
        Is the answer organised by area with each area's sites listed individually, and is
        what was not reached said plainly rather than closed over?
    specificity:
      weight: 0.25
      question: |
        Does every holding site carry an exact file:line, AND the name of the routine it sits
        in, AND the route by which that code came to be holding the record, AND where that
        route was established if it was established somewhere else, AND what the site leans on
        the record for? All five, per row. A bare filename is not specific, and on this
        contract it is actively wrong: one file can hold several holdings by different routes
        and only some are in play. A run of places named together under one shared reason with
        no location on any of them is the failure this criterion exists to catch, and it does
        not become specific because the reason is correct.
        Is the located line the HOLDING rather than the declaration? A relation method on
        another model, a repository's model() declaration, a docblock type or a constructor
        parameter is where a relationship was declared; the holding site is the line where
        code whose job is something else has the record in its hands. Where a file contains
        both, or contains several holdings in different routines, citing the wrong one is
        citing the wrong line, not a rounding error.
    justification:
      weight: 0.2
      question: |
        Is the phrase per row a consequence of THAT site, rather than a restatement that the
        place uses the record? "Breaks if the record changes" is not a justification. "It
        reads a field that was never declared, so after the change this line has to name it
        up front", "it pulled the record out of a parameter bag by string key, so there is
        nothing here to declare anything on", "the step across is polymorphic and resolves
        through a stored value, so this route cannot be found by reading source at all", "the
        wrapper IS the record, so every line in this payload is a lean and none of them says
        so", "the relation it steps across is declared in a file this package does not own"
        are. Does the answer say, at least in aggregate, which sites can declare what they
        need and which have no place to declare it?
    uncertainty:
      weight: 0.15
      question: |
        Does the answer distinguish holding sites it traced by reading from ones it inferred
        from a name, a familiar convention, or a memory of this platform? That distinction
        matters more than usual here: a local variable named after the record is not evidence
        that the record is what is in it, and several unrelated classes in this codebase carry
        the same short name as the record, as do an empty marker interface and a swap-in
        proxy. A holding attributed to the wrong one of those is worse than an admitted gap -
        does the answer show it settled that where it mattered? Is coverage claimed honestly -
        which areas it swept and which it did not reach - and where it could not tell how a
        routine came to be holding the record, does it say so instead of picking a route
        silently?

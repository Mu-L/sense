name: Bagisto work session - audit what holds a product it never names
repo: bagisto
contract_symbol: Webkul\Product\Models\Product
contract_file: packages/Webkul/Product/src/Models/Product.php

description: |
  You are a maintainer of this store platform, about to rework the record that the whole
  catalogue hangs off - the single most-reached-for thing in the codebase.
  The rework changes how that record is obtained and what it is safe to assume about it. Today
  any code that ends up holding one can lean on the whole of it: it can ask for a field that
  was never declared anywhere and get it, and it can ask the record to hand back the object
  that knows how its particular kind behaves - how it is priced, whether it can be sold,
  whether stock applies to it. After the change, code has to declare up front what it is going
  to lean on, and code that leans on something it did not declare stops working. So before
  anything is touched, every place that ends up holding one of these records has to be found
  and what it leans on written down.
  The awkward part is that almost nothing that holds one says so. A place that has one rarely
  names it. It got it because it walked to it from a different record it already had, or
  because someone put it into a bag of values and passed the bag along, or because it IS one
  and refers to itself, or because it was handed one as a plain undeclared argument. The word
  you would search for is either absent from the line entirely, or it is the name of the
  local variable and of two dozen other things in this codebase besides.
  Before you touch it you have to know two things: what the record is, what it can be asked
  for and how it decides what to hand back; and then every place that ends up holding one,
  with the route it came by written down, because the route is what decides whether that place
  can declare what it needs or has to be reworked completely.
  Throughout, an answer that points at a place must give an exact file:line a teammate could
  jump straight to, plus one phrase on why it matters. A bare filename does not count, a set
  of names offered together with one shared reason and no location on any of them does not
  count, and a missed place is a broken storefront shipped.

steps:
  - name: Map the catalogue record contract
    prompt: >
      Task: orient, and be exact - the rest of the ticket is built on this and nothing later
      will send you back for it. Two things, and the first is the larger.
      First, the record itself. What is it, and what can code that holds one actually do with
      it, grouped by job rather than listed routine by routine - what it relates outward to,
      how it answers for a field that was never declared on it, and how it produces the object
      that knows how its own kind behaves. That last one is the centre of the ticket: say what
      decides which object comes back, where that decision is written down, and what happens
      when nothing matches. Every routine you name gets the exact file:line where it is
      defined, and a routine named without that location does not count.
      Second, the declared write path: the layer whose stated job is to make, change and delete
      these records, and the family of classes that each know how one kind of them behaves.
      Name them at file:line, and for each one say in a phrase what it is responsible for.
      These are the parts whose relationship to the record is written down where anyone can
      see it, and I want them pinned so that the next part of the ticket can be about the
      other kind.
      Then say, briefly, what the other kind looks like - what it looks like when a piece of
      code is holding one of these records without ever having named it, and why nothing in
      that file's shape gives it away. Say it once, with a single example located at
      file:line. Do not enumerate those places here; I am not asking for that list yet and it
      earns nothing.
    checks:
      - type: response_richness
        value: "10"
        required: true
        description: The record's own surface grouped by job - what it relates outward to, how it answers for an undeclared field, and how it produces the per-kind behaviour object with what decides which one and what happens when nothing matches - each located at file:line, plus the declared write path and the per-kind behaviour family pinned at file:line with a phrase on what each is responsible for, plus one located example of code holding one of these records without naming it
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_graph
        required: false
        layer: adoption

  - name: Audit every dependent of the catalogue record contract
    prompt: >
      Task: this is the core of the ticket, and you are working it with the budget the first
      part already cost you. Take it as settled that the rework is happening and that code
      will have to declare what it leans on. Answer the only question that matters after that:
      which places in this codebase end up holding one of these records, and how did each one
      come to be holding it.
      The unit of the answer is a holding site, not a package and not a file. The declared
      write path and the per-kind behaviour family are not answers here: you pinned those in
      the first part, and naming them again earns nothing. What I want is the line where some
      other piece of code - whose own job is something else entirely - has one of these
      records in its hands.
      Those lines will not look like what you are searching for. The place does not name the
      record. It reached it by stepping across from a different record it already had, or it
      pulled it out of a bag of values that had been passed to it, or it IS one and is
      referring to itself, or it was handed one as an argument with no declared type on it, or
      it knows it under a different name entirely. In one whole area of this codebase the step
      across is not even written down as a fixed destination - what it lands on is decided by
      a stored value at runtime, so no line of source names the record at all.
      For each holding site the answer has three parts and only three: the exact file:line and
      the name of the routine it sits in; the ROUTE - in a phrase, how that code came to be
      holding one, and where that route was established if it was established somewhere else;
      and what that site leans on the record for. Keep it short: I want the coverage, the
      route and the leaned-on part, not the prose.
      Organise by area, one section per area, and treat an area as finished only when every
      holding site inside it is listed separately with its own location. If you run short, say
      what you had still not looked at rather than closing on what you have. A file:line with
      no route named is half an answer, and a group summarised instead of listed reads as a
      group with nothing in it.
    checks:
      - type: response_richness
        value: "6"
        required: true
        description: Every holding site located at the exact file:line with the routine it sits in named, the route by which that code came to be holding one of these records and where that route was established, and what the site leans on the record for
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption

scoring:

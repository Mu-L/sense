# ============================================================================
# TWO-STEP PROBE SCENARIO (plans/cycle-1-craft-the-scenario/01-author.md)
# CYCLE 1, ATTEMPT 11 on coolify - a RE-QUESTION routed back from measured runs.
# ANCHOR KEPT (`Server`, precision 0.15). THE GOLD GROUP IS REBUILT ON ONE MECHANISM,
# and for the first time in eleven attempts the IDENTITY family is excluded outright.
#
# TRAJECTORY (every previous cycle, quoted, and which side of the window it fell on)
#   The window is: plain arm at or below 0.50 of `dependents` AND ours at least +0.50 above.
#   baseline / ours on `dependents`, from each cycle's `scored.json`:
#     a1  0.9444 / 1.0000  CEILING   `Server`, every place that would have to be reviewed
#     a2  0.8462 / 0.8462  CEILING   `instant_remote_process`, the layer one hop back
#     a3  0.3571 / 0.5714  FLOOR-OK  identity keepsakes, near edge excluded
#     a4  0.9286 / 0.5714  CEILING   same axis, six value-shapes named in the ask
#     a5  0.0000 / 0.3333  FLOOR-OK  exclusion sharpened; baseline died at the wall
#     a6  0.7500 / 0.9167  CEILING   near edge required as a first pass inside step 2
#     a7  void   / 0.7500  NEITHER   ground moved into step 1; baseline died in the ground
#     a8  0.0000 / 0.2500  FLOOR-OK  ground CHARACTERISED as counts; baseline died at the wall
#     a9  0.9167 / 0.8333  CEILING   keepsake axis + `holds no machine` selection test
#     a10 0.8000 / 0.9333  CEILING   selection rule; baseline FINISHED with 164s unspent
#   Five cycles on the ceiling side, three on the floor side (all three bought by a baseline
#   that ran out of wall, never by wording), one uninformative.
#   THIS DRAFT CORRECTS FROM THE CEILING SIDE (a10, baseline 0.80, delta capped at +0.20
#   before it ran). The move it makes is not a rewording: nine of the eleven asks have now
#   been rewritten and four of the last five landed on the same side. It changes WHICH ROWS
#   ARE IN THE GROUP, on the one per-row split the record actually contains.
#
# THE KILLERS, RUN THIS SESSION (checks that could have killed this draft, not confirmed it)
#   PER-UNIT. a10's credit table, quoted from results/loop/coolify/minibench.md:
#     sense-only  2  d:key-in-use-guard (PrivateKey.php), d:token-in-use-guard (CloudProviderToken.php)
#     neither     1  d:shared-vars-cached-set (SharedVariables/Server/Index.php)
#     both       16  all four contract rows + the other twelve dependents
#   The three rows the baseline missed are the three rows where NO MACHINE IS EVER HELD and
#   no identifier of one is either: `$this->servers()->exists()` twice, and a cached owned
#   SET. The other twelve are machine-in-hand or identity rows, and it took 12 of 12.
#   CONFOUND: is that 0/3 a wall death rather than the row? Quoted from the same read -
#   `baseline/coolify/run-1/run_meta.json  wall 386 of 550  exit 0  watchdog None  valid True`
#   and `514 citations, citation_grounding.rate 1.0`. The run FINISHED with 164s unspent.
#   It is not a censored run; it is a finished run that did not reach those rows.
#   ARITHMETIC: 14 rows here, so the baseline must cite 7 files or fewer for +0.50 to be
#   reachable at all. a10's baseline cited 12 of 15 - if it cites 8 of these 14 the cell is
#   dead before it is scored, and that is the falsifier, not a disappointment.
#   n: the per-row split above is n=1 per arm. It is the ONLY per-row evidence that exists on
#   this family, it is labelled as n=1 here, and the mini-bench is what tests it. The
#   inverse-frequency ranking over the a3-era gold (`inverse_frequency.py coolify
#   results/claude-opus-5/minibench`) is n=4 total (baseline x2, sense x2), below the ~5-run
#   bar the plan sets, so it ORDERS nothing here; it is recorded per row below and no row was
#   cut on it.
#   NEGATIVE SPACE: what did I not search? A second, different probe for the same mechanism
#   spelled other ways (`whereHas('servers'`, `with('servers'`, `withCount('servers'`,
#   `->servers`) prints twelve more sites of this exact family that are NOT in the shown blast
#   payload - GithubApp.php:55, User.php:185, Security/CloudProviderToken/Show.php:110,
#   Security/CloudProviderTokens.php:128, Terminal/Index.php:21, Destination/Index.php:20,
#   Dashboard.php:22, Server/Index.php:15, Project/Index.php:22, ResourceOperations.php:48,
#   DeploymentsIndicator.php:21, Settings/ScheduledJobs.php:213. NONE of them is gold, because
#   a dependents row must appear in what the arm is shown. Two consequences, both recorded and
#   neither acted on here: the family is larger than the payload, so a complete human answer is
#   not fully reachable through one blast; and an arm that answers with those twelve scores
#   nothing for them, in either direction.
#
# WHY THE IDENTITY FAMILY IS OUT, MEASURED TWICE
#   a9 golded twelve identity rows (`server_id`, `server_uuid`, a uuid baked into a URL, an id
#   passed to a queued job, a provider's own id) and its baseline reached 11 of 12 = 0.9167 in
#   two sweeps plus one file read. a4 golded the same axis with the value-shapes named in the
#   ask and its baseline reached 0.9286. That family is retired for this repo. Every row below
#   was checked against it by hand: not one gold line carries a stored machine identifier.
#
# THE MECHANISM, AND WHAT MAKES IT DIFFERENT FROM EVERY ROW THE BASELINE HAS TAKEN
#   The scored dependents never receive a machine and never hold a piece of one. They put a
#   question to the WHOLE POPULATION of machines and act on the answer: does any exist, how
#   many are there, which ones qualify right now, is this one already taken, is the set empty.
#   Some ask it through a relation on a model that is not the anchor (`$this->servers()`), some
#   through an eligibility query, some by taking the single machine the product itself runs on
#   out of the population by a hardcoded id. What comes back is a boolean, a count, a filtered
#   collection or nothing - never a machine handed over by a caller.
#   Recorded, per NO GREP SCREEN IS A GATE, and decided by nothing: `grep -rn -- 'servers()'`
#   over app/bootstrap/routes prints 96 lines across 41 files, `grep -rn 'Server::isUsable'`
#   prints 6, `grep -rn 'ownedByCurrentTeamCached'` prints 4. Covering greps for parts of this
#   family exist. Whether an arm runs them to closure at `path:line` inside its wall is what
#   the mini-bench measures, and a grep has been wrong about this repo in both directions.
#
# THE AXIS, IN ONE SENTENCE
#   Every scored dependent depends on the machines as a POPULATION and never on a machine: it
#   asks whether any exist, how many there are, which ones qualify, or whether one is already
#   taken - and it makes a real decision on the answer (a delete is refused, a team counts as
#   empty, a screen offers a candidate list, an address is rejected, a self-update is skipped)
#   without a machine ever being in its hands.
#
# WHAT THE ANSWER IS, THAT IS NOT A LIST OF PLACES A NAME APPEARS
#   Per place the answer is WHAT THAT PLACE DOES WHEN THE POPULATION ANSWERS BADLY - when the
#   set is empty, when the count is zero, when the one machine it expected is not there, when
#   the address is already taken. A search prints where a name occurs; it cannot print the
#   degenerate case, and two lines whose text is almost identical differ entirely on it: one
#   refuses the delete (`PrivateKey.php:328`), one silently returns and skips the product's own
#   update (`UpdateCoolify.php:29-31`), one throws (`SettingsBackup.php:55`), one redirects
#   (`SharedVariables/Server/Show.php:55-57`).
#   This is NOT the retention kind, and that is a run, not a preference:
#     python3 bench/lib/ring_sweep.py $CLONE --top 12
#       -> `0 candidate(s) above the bar`, all twelve anchors `rows 0  files 0  vias 0`.
#   Zero rings, so `what HOLDS X` is off the menu on this repo.
#
# SEAM PROFILE (bench/lib/seam_hunt.py, three candidates, quoted, run this session)
#   python3 bench/lib/seam_hunt.py $CLONE Server --propose
#     app caller files 45 (53 incl test) | SCATTER (dirs) 23
#     GREP-NOISE 'Server' in 295 app files   PRECISION=0.15   SCATTERED + GREP-NOISY
#   python3 bench/lib/seam_hunt.py $CLONE Team --propose
#     app caller files 26 (28 incl test) | SCATTER 14
#     GREP-NOISE 'Team' in 104 app files    PRECISION=0.25   SCATTERED + GREP-NOISY
#   python3 bench/lib/seam_hunt.py $CLONE PrivateKey --propose
#     app caller files 19 (24 incl test) | SCATTER 12
#     GREP-NOISE 'PrivateKey' in 42 app files  PRECISION=0.45  SCATTERED + GREP-NOISY
#   PRECISION RANKS, IT NEVER KILLS. `Server` is lowest at 0.15 and widest at 23 dirs, and it
#   is the anchor eleven cycles of measurement are attached to. ANCHOR KEPT.
#
# EVERY SCORED ROW IS IN THE SHOWN BLAST PAYLOAD (RUN THIS SESSION, NOT ASSUMED)
#   python3 bench/lib/mcp_probe.py $CLONE '[{"name":"sense_blast","arguments":{"symbol":"Server"}}]'
#   No `min_confidence` passed. 31419 chars, union of distinct php paths = 101. All fourteen
#   scored paths and all four anchor paths are inside that union, intersected path by path this
#   session. Prior-citation status per scored row, from the reads on disk, recorded so the next
#   phase can cross-tab it rather than guess:
#     never golded, never cited by any baseline (8): Boarding/Index.php, Server/Show.php,
#       SharedVariables/Server/Show.php, Settings/Index.php, SettingsBackup.php,
#       Actions/Server/UpdateCoolify.php, helpers/docker.php, Models/Team.php:276-the-line
#       (the FILE was cited in a10 for its quota, at a different line, and the scorer matches
#       on the PATH - so Team is the one row here that may be free, and it is kept only
#       because the mechanism at :276 is the cleanest instance of it in the repo).
#     golded before and MISSED by the baseline (3): Models/PrivateKey.php,
#       Models/CloudProviderToken.php, SharedVariables/Server/Index.php (a10, 0/1 each).
#     golded before and cited by the baseline once in two runs (3):
#       Destination/New/Docker.php, Project/New/Select.php, GlobalSearch.php (a3-era, 1/2).
#
# MEMORIZATION (bench/lib/memorization_probe.py $CLONE Server --json)
#   `ok: false`, `recall 0.57`, `61 of 107 members named` closed-book: the Server model's own
#   member list IS recited by the headline model. That constrains the ANCHORS, which do not
#   score, and it is why step 1 is orientation. It does not touch the gold: not one of the
#   fourteen scored rows is a member of `Server`, and each is a line-level fact in another file
#   (which routine holds the population query, and what that routine does when the answer is
#   empty) that the closed-book answer does not contain. Churn-dating is unavailable here - the
#   clone is a single-commit snapshot (`git log --oneline | wc -l` -> 1), so every file reports
#   the same date and the date carries no information. Recorded, not smoothed over.
#
# THE SUPERSEDED QUESTION, WITH THE NUMBER THAT KILLED IT
#   a10's step 2: `Somewhere before each of those places got its machine, something decided
#   WHICH machine it would be ... work outward from the ground you already have` -> baseline
#   12 of 15 = 0.8000, ours 14 of 15 = 0.9333, delta +0.1333 against a ceiling of +0.20.
#   Its own read: `the baseline does not run the sweep the author screened against; it writes
#   a new sweep per shape until the shapes run out`, and `12 of 15 rows fall to
#   grep -rln <shape> | xargs awk -f ctx.awk`.
#   Kept at verticals/php-laravel/scenarios/coolify.yaml.selection-rule.bak
#   (a9 keepsake-holds-no-machine, a8 population-census, a7 step1-ground, a6 two-pass-toll,
#   a5 map-not-answer, a4 one-set-far-edge, a3 identity-scrap, a2 handoff-layer,
#   a1 class-teardown).
#
# WHAT IS KEPT FROM a10, DELIBERATELY, AND WHY
#   STEP 1 STAYS AN ENUMERATION OF THE WORKING GROUND. Sorted by whether the ask made our arm
#   enumerate the direct population anywhere, our arm separates: enumerated a6 0.9167 / a7
#   0.7500 / a9 0.8333 / a10 0.9333, not enumerated a3 0.5714 / a5 0.3333 / a8 0.2500. The
#   confound is not claimed away: the enumeration may feed the baseline too, and both finished
#   ceiling-side baselines were enumerated cycles. What changes ALONGSIDE it is the gold, and
#   that is the pairing a10's read asked for.
#
# INTENDED LANDING, AND WHAT FALSIFIES IT
#   Baseline at or below 0.45 (6 of 14 or fewer), ours at 0.80 or better. If the baseline
#   lands above 0.60 on fourteen rows that hold no machine and no identifier, then no row
#   shape on this repo survives a competent baseline's area walk, and the finding is
#   repo-level - the twelfth attempt should be a swap, not a twelfth wording. If OUR arm lands
#   under 0.60 with all fourteen rows in the shown payload, the failure is selection inside the
#   payload (a8: `it had the rows in hand and answered past them`), not discovery.
# ============================================================================

name: Coolify work session - audit the server contract before a rework
repo: coolify
contract_symbol: Server
contract_file: app/Models/Server.php

description: |
  You are a maintainer about to rework how this product decides which of its remote machines a
  piece of work belongs on. Today most of the code that acts on a machine is handed one and
  never chooses; the pressure sits elsewhere, in the code that never receives a machine at all
  and instead asks the whole set of them a question - are there any, how many, which of them
  qualify right now, is this one already taken - and then decides something real on the answer.
  The rework changes how that set is defined and how it is asked, so every place that questions
  the set has to be reviewed, and in particular every place that has a quiet answer for the
  empty case: those keep running afterwards and just decide differently. Before you touch it you
  have to know two things: how a piece of work is attached to a machine and worked with today,
  and every place that reaches the machines without ever being handed one. Throughout, an answer
  that points at a place must give an exact file:line a teammate could jump straight to, plus one
  phrase on why it matters. A bare filename does not count, a set of names offered together with
  one shared reason and no location on any of them does not count, and a missed dependent is a
  regression shipped.

steps:
  - name: Map the server contract
    prompt: >
      Task: orient, and be thorough - the rest of the ticket is built on this and nothing later
      will send you back for it. Two things, both in this answer.
      First, how a piece of work is attached to one of these machines today. Trace it end to
      end: what a deployable thing actually stores about the machine it runs on, and whether it
      stores that the same way for every kind of deployable thing; where a machine is resolved
      back out of that stored attachment when the machine itself was not loaded; which qualities
      of a machine decide whether it is eligible to receive work at all, and where that
      eligibility is expressed as a query over machines rather than as a question asked of one
      machine; and where a machine leaves the product altogether, and what that removal is
      expected to take with it.
      Second, and this is the larger half: the working ground. Every place in this product that
      is handed one of these machines and works with it while it has it in front of it - all of
      them, not a representative sample, laid out one line each with the exact file:line and the
      routine that line sits in. Group them however the code itself falls out, and treat a group
      as finished only when every place inside it is listed separately with its own location; a
      group you summarise instead of listing reads as a group with nothing in it, and so does a
      name given without a location.
      Then say, in a few sentences, what a rework would have to preserve for everything you have
      just written down to keep meaning what it means today. A place named without the routine it
      lives in does not count, and neither does a routine named without the file:line where it is
      defined.
    checks:
      - type: response_richness
        value: "12"
        required: true
        description: The attachment traced end to end through the routines that store, resolve, qualify and remove it, and the working ground enumerated one place per line, each located
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_graph
        required: false
        layer: adoption

  - name: Audit every dependent of the server contract
    prompt: >
      Task: this is the core of the ticket, and you are working it with the budget the first part
      already cost you. You have the working ground written down. Everything on it was handed a
      machine, so none of it is what I am asking for now, however much of the product it runs.
      What I need is the other kind of place entirely: code that is never given a machine and
      never holds anything standing in for one, and that instead puts a question to the machines
      as a whole and decides something real on the answer it gets back. It asks whether there are
      any at all, or how many, or which of them qualify at this moment, or whether one is already
      taken, or whether the one it expects to be there is there - and what comes back to it is a
      yes or no, a number, a set, or nothing. Expect most of it to be doing some other job
      entirely, in a part of the product that is not about machines, with nothing on the line
      announcing one.
      Test each candidate the same way: at that line, does this code have a machine, or does it
      only have an answer about the machines? If a machine came in and it acted on it, that is
      the ground you already covered.
      For every one of them the answer has three parts and only three: the exact file:line, the
      routine that line sits in, and - this is the part I actually need - what that place does
      when the answer comes back empty, zero, or missing. Whether it refuses, throws, redirects,
      falls back to something else, or quietly carries on as if nothing happened. Keep it short:
      I want the coverage and the empty case, not the prose. Work outward from the ground you
      already have rather than starting a fresh search. If you run short, say what you had still
      not looked at rather than closing on what you have. A file:line with no routine named
      around it does not count, a place named without what it does on the empty answer does not
      count, and a missed one is a regression shipped.
    checks:
      - type: response_richness
        value: "6"
        required: true
        description: Every place that decides on an answer about the machines rather than on a machine, located at file:line with the routine it sits in and what it does when that answer is empty
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption

scoring:
  weights:
    correctness: 0.7
    efficiency: 0.3

gold:
  # ---- ANCHORS: the contract centre, its eligibility queries and its obvious write path.
  # ---- Step 1's answer. Both arms reach these and they do NOT score. Every line below was
  # ---- opened and read this session. None of these four files appears in `dependents`.
  - id: contract-model
    group: contract
    match: [Models/Server.php]
    relation: "app/Models/Server.php:512 `public static function isUsable(): Builder` delegating to :522 `private static function usableByBuildServerStatus(bool $isBuildServer): Builder` - eligibility to receive work expressed as a QUERY over the population rather than as a question asked of one machine: :524 `Server::ownedByCurrentTeam()` then :525 `->whereRelation('settings', 'is_reachable', true)`, :526 `'is_usable', true`, :527 `'is_swarm_worker', false`, :528 `'is_build_server', $isBuildServer`, :529 `'force_disabled', false`; the family around it is :485 `isReachable()`, :494 `ownedByCurrentTeam(array $select)`, :505 `ownedByCurrentTeamCached()` wrapping the same query in `once()`, :230 `findCached($id)` and :855 `buildServers($teamId)` - these six are the questions every scored row asks"
  - id: c:server-setting
    group: contract
    match: [Models/ServerSetting.php]
    relation: "app/Models/ServerSetting.php:58 `protected $fillable` opening with :59 `'server_id'`, :60 `'is_swarm_manager'`, :62 `'is_build_server'`, :63 `'is_reachable'`, :64 `'is_usable'` - the flags the eligibility query filters on live on a SEPARATE row from the machine, so whether a machine is in the usable set is decided by a table the machine itself does not carry"
  - id: c:destination-resolve
    group: contract
    match: [Models/StandaloneDocker.php]
    relation: "app/Models/StandaloneDocker.php:127 `public function getServerAttribute(): ?Server` - the resolve side: the eager-loaded short-circuit at :130 `if ($this->relationLoaded('server'))`, otherwise :135 `$server = Server::findCached($this->server_id);` and the relation is stuffed back at :139 `$this->setRelation('server', $server);`; every `->server` walk out of a deployment target bottoms out here, which is why the working ground can hold a machine it never loaded"
  - id: c:server-delete
    group: contract
    match: [Server/Delete.php]
    relation: "app/Livewire/Server/Delete.php:59 `$this->server->delete();` inside `delete($password, $selectedActions = [])` (def at :34) - the obvious write path, and the removal that every population question downstream is answered differently after: guarded at :47 `if ($this->server->hasDefinedResources() && ! $this->force_delete_resources)`, resources force-deleted at :54-:57, and the cloud-side teardown dispatched at :60-:70"

  # ---- DEPENDENTS: fourteen rows, ONE PER FILE, across nine areas (app/Models,
  # ---- app/Livewire/SharedVariables/Server, app/Livewire/Boarding, app/Livewire/Server,
  # ---- app/Livewire, app/Livewire/Settings, app/Livewire/Destination/New,
  # ---- app/Livewire/Project/New, app/Actions/Server, bootstrap/helpers). Every row is in the
  # ---- shown `sense_blast` payload for `Server` quoted in the header, every line below was
  # ---- opened and read this session, and NOT ONE of them holds a machine or an identifier of
  # ---- one at the line that scores.

  # -- the population is asked WHETHER ANY EXIST, and the answer refuses a delete
  - id: d:key-in-use-guard
    group: dependents
    match: [Models/PrivateKey.php]
    relation: "app/Models/PrivateKey.php:328 `return $this->servers()->exists()` opening `isInUse()` (def at :326, continuing `|| $this->applications()->exists()` at :329) - a key may not be deleted while ANY machine still uses it, and the check never loads a machine: it asks the relation for a boolean and the empty answer is what lets `safeDelete()` at :334 proceed"
  - id: d:token-in-use-guard
    group: dependents
    match: [Models/CloudProviderToken.php]
    relation: "app/Models/CloudProviderToken.php:39 `return $this->servers()->exists();` inside `hasServers(): bool` (def at :37, over the `hasMany(Server::class)` declared at :32-:35) - the same existence question on the credential side; nothing here is ever handed a machine, and a false answer is what makes the token deletable"
  - id: d:team-empty-guard
    group: dependents
    match: [Models/Team.php]
    relation: "app/Models/Team.php:276 `if ($this->projects()->count() === 0 && $this->servers()->count() === 0 && $this->privateKeys()->count() === 0 && $this->sources()->count() === 0)` inside `isEmpty()` (def at :274) - whether a team counts as empty is four counts ANDed together and one of them is the machine count; the machines are never loaded, and a wrong zero here makes a non-empty team deletable"

  # -- the population is asked WHICH ONES QUALIFY, and the answer fills a picker
  - id: d:shared-vars-cached-set
    group: dependents
    match: [SharedVariables/Server/Index.php]
    relation: "app/Livewire/SharedVariables/Server/Index.php:15 `$this->servers = Server::ownedByCurrentTeamCached();` in `mount()` (def at :13) - the shared-variable screen takes the whole owned set out of the request-duration cache (`once()` at Server.php:507) and renders from it at :20; it never resolves a machine, and an empty or stale set renders an empty page with no error"
  - id: d:new-destination-pool
    group: dependents
    match: [Destination/New/Docker.php]
    relation: "app/Livewire/Destination/New/Docker.php:38 `$this->servers = Server::isUsable()->get();` in `mount(?string $server_id = null)` (def at :35) - the candidate list for a new destination is the eligibility query's result, and :43-:44 then PUSH a machine the query excluded when one arrived by url (`if (! $this->servers->contains('id', $this->selectedServer->id))`); when nothing was passed in, :49 `$foundServer = $this->servers->first();` silently takes whichever machine sorted first"
  - id: d:new-resource-pool
    group: dependents
    match: [Project/New/Select.php]
    relation: "app/Livewire/Project/New/Select.php:466 `$this->onlyBuildServerAvailable = $this->servers->isEmpty() && $this->buildServers->isNotEmpty();` closing `loadServers()` (def at :461) - two population queries at :463-:464 (`Server::isUsable()` and `Server::isUsableBuildServer()`), concatenated at :465, and the degenerate case is turned into a ui flag rather than an error: the empty answer changes what the whole new-resource flow offers"
  - id: d:global-search-pool
    group: dependents
    match: [GlobalSearch.php]
    relation: "app/Livewire/GlobalSearch.php:1192 `$servers = Server::isUsable()->get()->sortBy('name');` in `loadServers()` (def at :1189, called from :1186) - search-and-create draws its machine options from the eligibility query and immediately reduces them to plain arrays at :1193-:1197, so nothing downstream holds a machine at all; an empty answer leaves `availableServers` empty and the create path unreachable with no message"
  - id: d:boarding-existing-pool
    group: dependents
    match: [Boarding/Index.php]
    relation: "app/Livewire/Boarding/Index.php:124 `$this->servers = Server::ownedByCurrentTeam(['name'])->where('id', '!=', 0)->get();` inside `mount()` (def at :90), reached only through the empty-guard at :123 `if ($this->servers->isEmpty())` - onboarding offers the team's already-known machines while deliberately excluding the product's own machine by id, and the empty answer is what makes the flow show the add-a-machine path instead"

  # -- the population is asked WHETHER THIS ONE IS ALREADY TAKEN, and the answer rejects input
  - id: d:ip-collision-check
    group: dependents
    match: [Livewire/Server/Show.php]
    relation: "app/Livewire/Server/Show.php:239 `$foundServer = Server::where('ip', $this->ip)` continuing `->where('id', '!=', $this->server->id)->first();` at :240-:241, inside `syncData(bool $toModel = false)` (def at :233) - an edited address is validated against the WHOLE population and not just the team's, so the non-empty answer branches at :244 into two different errors depending on whose team owns the other machine, and the edit is rolled back at :243 before either"
  - id: d:shared-var-team-scope
    group: dependents
    match: [SharedVariables/Server/Show.php]

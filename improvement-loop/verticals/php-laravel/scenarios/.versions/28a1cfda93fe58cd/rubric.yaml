# Per-scenario rubric for the LLM judge layer.
#
# Four criteria per step, weights summing to 1.0: map_quality 0.40 / specificity 0.25
# / justification 0.20 / uncertainty 0.15.
#
# CYCLE 1 / ATTEMPT 11 on coolify, TWO-STEP PROBE (plans/cycle-1-craft-the-scenario/01-author.md).
# TWO steps, names verbatim and in the order of scenarios/coolify.yaml (the judge pairs by
# name).
#
# WHAT CHANGED FROM THE ATTEMPT-10 RUBRIC: the axis, again, and this time the retired one is
# A SELECTION RULE - which machine a piece of work lands on, decided by code that was never
# handed one. Its baseline reached 12 of 15 by writing a fresh token sweep per shape and
# annotating the hits with awk, so the axis is retired. This rubric scores AN ANSWER ABOUT THE
# POPULATION: code that never receives a machine and never holds a piece of one, that asks the
# machines as a whole whether any exist, how many there are, which qualify, or whether one is
# taken - and then decides something real on what comes back. Step 1 keeps its shape (the
# lifecycle half plus the working ground ENUMERATED, the one variable our arm has separated on:
# 0.83-0.93 enumerated, 0.25-0.57 not) and its first half gains the removal path, because what
# a delete is expected to take with it is the thing every population question answers
# differently afterwards.
#
# WHY map_quality carries the most weight on the discriminator: the answer to step 2 is not a
# set of locations, it is a set of EMPTY CASES. Two places can ask the population the same
# question one line apart and differ entirely in what they do when the answer comes back empty
# - one refuses a delete, one silently returns, one throws, one redirects. Naming that is the
# answer.
#
# WHY specificity demands the routine AND the empty case: a file:line here is not
# self-explaining, and the failure this criterion exists to catch is a run of places named
# together under one shared reason with no location on any of them.
audience: |
  An AI coding agent that will use this answer to safely rework how Coolify defines and
  questions the set of remote machines it can deploy onto - the eligibility query, the owned
  set, the cached set, and the one machine the product itself runs on. Score for that agent,
  not a human reader and not a docs page.
  A perfect answer leaves the agent able to make that change knowing two things: how the
  attachment between work and machine works today - what a deployable thing stores about the
  machine it runs on and whether every kind of deployable thing stores it the same way, where a
  machine is resolved back out of that stored attachment when it was never loaded, which
  qualities of a machine are expressed as an eligibility QUERY rather than as a question asked
  of one machine, and where a machine leaves the product and what that removal is expected to
  take with it - each traced through the routines that make it up; and how far the change
  reaches BEYOND the code that is handed a machine and acts on it.
  That far layer is what decides the answer. It is the places that never receive a machine and
  never hold anything standing in for one, and that put a question to the machines as a whole:
  a model refusing to delete itself while any machine still uses it; a container whose emptiness
  is four counts ANDed together, one of them the machine count; a screen filling a picker from
  the eligibility query and pushing in a machine that query excluded; a flow that turns an empty
  candidate set into a ui flag rather than an error; a form rejecting an address because some
  other team's machine already has it; a helper turning a bare integer into a machine only if
  the team-scoped population contains it; a routine taking the single machine the product itself
  runs on out of the population by a hardcoded id. Each must be pinned to an exact file:line,
  with the routine named, and with what that place does when the answer comes back empty, zero
  or missing - refuse, throw, redirect, fall back, or quietly carry on.
  A weak answer stops at the code that is handed a machine, however densely it lists it; or
  collapses a run of places into one line with a shared reason and no location on any of them;
  or gives file:line without the empty case, which leaves the agent knowing where the set is
  queried and not what breaks when the query starts answering differently.
steps:
- name: Map the server contract
  criteria:
    map_quality:
      weight: 0.4
      question: |
        Is the attachment between a piece of work and a machine traced as one connected story -
        stored, resolved, qualified, removed - rather than listed as places a name is mentioned?
        The step asks for four jobs along that story: what a deployable thing actually stores
        about the machine it runs on, AND whether every kind of deployable thing stores it the
        same way (they do not, and noticing that is the part that makes the next step tractable);
        where a machine is resolved back out of that stored attachment when the machine itself
        was never loaded; which qualities of a machine decide eligibility to receive work, and
        where that eligibility is expressed as a QUERY over machines rather than as a question
        asked of one machine; and where a machine leaves the product, and what that removal is
        expected to take with it. The question is COVERAGE OF THE JOBS - all four shown and
        connected is the full answer.
        The step then asks for a SECOND job and it is an ENUMERATION: every place in the product
        that is handed one of these machines and works with it, one line each, each located.
        Score whether it is genuinely complete rather than a representative sample, whether the
        grouping follows the code rather than a tidy label, and whether every place inside every
        group carries its own location - a group summarised instead of listed is a group with
        nothing in it, and so is a name given without a location. Could the next step act from
        this ground with small targeted lookups rather than a fresh exploration?
    specificity:
      weight: 0.25
      question: |
        Does every place the answer names carry an exact file:line AND the name of the routine it
        lives in? A bare filename is not specific. A file:line with no routine named around it is
        not specific - the maintainer asked whose code it is, not where the character offset
        falls. A routine named without the file:line where it is defined is not specific either.
        Where the answer names a stored attachment, a resolve path, an eligibility query or a
        removal, is the line that actually stores, resolves, filters or deletes located, and not
        just asserted from the name of the surrounding class or relation?
    justification:
      weight: 0.2
      question: |
        Does each place carry one phrase on what it contributes to the attachment - what it
        stores, what it resolves and from what, what it filters on, what the removal takes with
        it - and does the closing statement say what a rework would have to preserve for the
        ground JUST ENUMERATED to keep meaning what it means today, rather than restating
        relation names?
    uncertainty:
      weight: 0.15
      question: |
        Does the answer separate what it verified by reading from what it inferred from a name or
        from a familiar framework convention? Relation accessors, morph relations and query
        scopes invite confident guessing; saying which parts were actually opened is worth more.
        Is anything the session could not resolve named as such rather than smoothed over, and is
        the completeness of the enumerated ground stated honestly - the real total, or as far as
        this session got, and on what basis?
- name: Audit every dependent of the server contract
  criteria:
    map_quality:
      weight: 0.4
      question: |
        THE DISCRIMINATOR, and it is AN ANSWER ABOUT THE POPULATION together with BREADTH OF
        AREA. The working ground - the places that are handed one of these machines and act on
        them - was enumerated in the previous step, and this step asks for the opposite kind of
        place: code that never receives a machine, never holds anything standing in for one, and
        instead asks the machines as a whole a question and decides on the answer. So a
        near-edge list earns nothing here however dense or well located it is, and repeating the
        previous step's answer is not progress. Does the audit reach that layer - existence
        checks that refuse a delete while any machine still uses the thing; a count folded in
        with other counts to decide whether a container is empty; eligibility queries filling a
        picker, and what the screen does with a machine the query excluded; an empty candidate
        set turned into a flag rather than an error; a uniqueness check run against the whole
        population and not just the team's; a bare integer turned into a machine only if the
        team-scoped population contains it; the product's own machine taken out by a hardcoded
        id, in the several places that do it and with different consequences each time? These
        places sit as much in the model-level guards, the settings screens, the onboarding flow
        and the shared helpers as anywhere near the code that runs commands; an answer dense in
        one tree and silent in the others has enumerated inside one search scope and mistaken
        that for the codebase. Above all: does the answer state, for each place, WHAT IT DOES
        WHEN THE ANSWER COMES BACK EMPTY, zero or missing - which is the distinction a reading of
        the line alone does not give? Where the answer ran short, is what it had still not looked
        at declared rather than quietly closed over?
    specificity:
      weight: 0.25
      question: |
        Does EVERY place carry its own exact file:line AND the name of the routine the line sits
        inside AND what happens on the empty answer? All three, because a location alone does not
        identify this kind of dependency: two lines of nearly identical shape differ entirely
        depending on whether the empty answer refuses, throws, redirects, falls back or is
        ignored. Several places named together on one line as a set that shares a reason is the
        failure this criterion exists to catch: however correct the shared reason is, it is one
        item, not a set of located places, and it should be scored as one. A bare filename does
        not count.
    justification:
      weight: 0.2
      question: |
        Does each place carry one phrase on what IT would start getting wrong the first time the
        population answers differently? The consequence must be about that place's own job - a
        key or a credential deleted while machines still use it, a non-empty team treated as
        deletable, a picker offering a machine that no longer qualifies or hiding one that does,
        a new-resource flow that silently reframes itself when nothing qualifies, an address
        collision missed across teams, a compose file validated against another team's machine, a
        self-update that becomes a silent no-op, an instance backup disabled because the one
        machine it looks for was not there - not a restatement of the line. Does it distinguish
        an empty answer that fails loudly from one that quietly changes the decision?
    uncertainty:
      weight: 0.15
      question: |
        Does the answer say how it convinced itself the audit is exhaustive, and name where it is
        likely still thin? An unqualified claim of completeness over a codebase this size is
        overconfidence. Naming an area it knows it did not finish, and what it left there, is
        worth more than a confident list that quietly stops. Places that never sit beside
        anything naming a machine - an existence check on a relation, a count compared against
        another count, a set fetched from a request-duration cache, a lookup by a hardcoded id -
        are the ones an audit of the obvious surface misses, and saying which of those it went
        looking for and how is worth more than asserting full coverage.

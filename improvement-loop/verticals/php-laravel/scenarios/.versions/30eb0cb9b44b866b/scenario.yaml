# ============================================================================
# TWO-STEP PROBE SCENARIO (plans/cycle-1-craft-the-scenario/01-author.md)
# CYCLE 1, ATTEMPT 3 on coolify - a RE-QUESTION routed back from measured runs.
#
# TRAJECTORY (every previous cycle, and which side of the window each fell on)
#   The window is: plain arm at or below 0.50 of `dependents` AND ours at least +0.50 above.
#
#   attempt 1  "audit the server contract before a rework" / contract `Server`
#     step 2 asked for every dependent of the machine class as a single subject.
#     MEASURED (results/dryrun/coolify/minibench.1.md, quoted):
#         baseline/run-1   cited  0 of 18   ABORTED - excluded (no run_meta, is_error true)
#         baseline/run-2   cited 17 of 18   cited_recall 0.9444   valid
#         sense/run-1      cited 18 of 18   cited_recall 1.0      valid
#         sense/run-2      cited 18 of 18   cited_recall 1.0      valid
#     SIDE OF THE WINDOW: the CEILING side. Baseline 0.9444, delta capped at +0.0556.
#     Route: 19 searches of 26 tool calls, `read_count: 0`.
#
#   attempt 2  same title / contract `instant_remote_process`
#     step 2 asked for the half ONE HOP BACK - places that hand the job to something else
#     which then reaches a machine.
#     MEASURED (results/loop/coolify/minibench.md, quoted):
#         baseline dependents 11 of 13 = 0.8462
#         sense    dependents 11 of 13 = 0.8462   delta 0.000
#     SIDE OF THE WINDOW: the CEILING side AGAIN, and worse - zero sense-only rows.
#     Route: `grep -rl` for the three seam names, then the direct-caller CLASS NAMES fed
#     back in as one alternation (`JOBS="ApplicationDeploymentJob|DatabaseBackupJob|..."`).
#     One dispatch hop is not indirection when the receiver's name is a literal on the
#     hand-off line.
#
#   BOTH previous cycles fell on the SAME side. This is not an oscillation to split the
#   difference in; it is one wall hit twice.
#
# WHICH SIDE THIS DRAFT CORRECTS FROM, AND HOW FAR IT INTENDS TO MOVE
#   From the CEILING side, twice. Target: baseline at or below 7 of 14, ours at 13-14 of 14.
#   The correction is neither "harder wording" nor "one more hop" - both of those were tried
#   and both landed on the ceiling. What changes is WHICH POPULATION the scored group is
#   drawn from. Attempts 1 and 2 both scored the places that WORK WITH a machine: they hold
#   one, they are handed one, or they cause a command to run on one. That population is the
#   product's spine, it is what any route walks first, and it is where both baselines went.
#   This draft scores the places that keep a SCRAP of a machine's identity after the machine
#   object is gone - an integer written into a stored row, a short handle pasted into a link
#   or into an outbound message, a display name copied into a saved value, an address used as
#   the key of a lookup, a composed string used to gate or count something. None of these
#   places does any work with a machine; several of them never see one at all. They are the
#   corners, and the corners are precisely what both measured routes left behind:
#     - attempt 1's single missed row was `app/Notifications/Container/ContainerStopped.php`
#       (baseline 0 of 1) - an outbound payload copying a machine's name and handle. Every
#       row it TOOK was a job, an action, a helper or a machine-page component.
#     - attempt 2's two unreached rows (`d:load-compose-file`, `d:delete-volume-backup`)
#       were both small single-purpose files off the spine.
#   `ContainerStopped.php` is carried forward into this gold set as the one row on this repo
#   measured to be outside a baseline's reach; the other thirteen are its siblings by
#   MECHANISM, not by directory - they sit in twelve different areas and no two share a family.
#
#   THE SUPERSEDED QUESTION, with the number that killed it: "What you owe me is the half one
#   step back: a place whose own work ends with it handing the job to something else, so that
#   a command gets run on one of these machines afterwards and never by this place."
#   -> baseline `dependents` cited_recall 0.8462, delta 0.000. Kept at
#   verticals/php-laravel/scenarios/coolify.yaml.handoff-layer.bak (attempt 1 is at
#   coolify.yaml.class-teardown.bak).
#
# WHAT THE ANSWER IS, THAT IS NOT A LIST OF THE PLACES A NAME APPEARS
#   Per scored row the answer is WHICH SCRAP OF IDENTITY IS KEPT AND WHAT IT IS LATER TRUSTED
#   TO RESOLVE TO. A search prints lines; it cannot print the lifetime of a value. Two rows
#   whose lines are near-identical text differ entirely on this axis:
#   `app/Livewire/Server/Proxy/DynamicConfigurations.php:66` takes a handle out of the current
#   request and resolves it once, inside one request - a scrap with no lifetime;
#   `app/Models/SharedEnvironmentVariable.php:22` stores an integer in a row that outlives
#   every process, and the value beside it was COPIED from a machine's display name at
#   creation time (`app/Models/Server.php:199`) and is never refreshed. The scored answer is
#   (which scrap) + (what it is trusted to still mean when it is read back), and neither is
#   printable by any search over the contract's name.
#
# THE AXIS, IN ONE SENTENCE
#   Every scored dependent keeps a machine's identity past the moment it held the machine -
#   an id persisted in a column, a handle pasted into a link or an outbound message, a name
#   copied into a stored value, a network address used as the key a lookup is done on, or a
#   string composed from one of those and used to gate, count or cancel - so its dependency
#   on the machine contract is carried by a DETACHED SCRAP with a lifetime, not by a call, a
#   held reference or a hand-off.
#
# WHY THE TWO MEASURED ROUTES DO NOT CLOSE THIS ONE
#   Neither route is defeated by darkness, and this draft does not claim darkness. Measured in
#   this session over the shown blast payload for `Server` (101 distinct files across
#   direct_callers, affected_via_composition and affected_symbols): files containing NO
#   occurrence of the string `Server` = 0 of 101. Every candidate row on this repo carries the
#   token, and `grep -rn` prints its line for free. TOKEN-DARKNESS IS NOT THE MECHANISM and it
#   is not available here in any case.
#   What the two routes actually did was walk the SPINE, in the order the spine presents
#   itself: attempt 1's baseline greped `isFunctional`, then `Server \$server`, then
#   `destination->server`; attempt 2's greped the three seam names and then the receiver class
#   names. All four patterns select for a place that USES a machine. None of them selects for
#   a place that kept an integer. The bet of this draft is a bet on WHICH CORNERS A ROUTE
#   VISITS, and it is the only bet the two measured reads support. It is recorded here, not
#   used as a gate: NO GREP SCREEN IS A GATE, and the run decides.
#
# SEAM PROFILE (bench/lib/seam_hunt.py, three candidates, quoted, run in this session)
#   python3 bench/lib/seam_hunt.py $CLONE Server --propose
#     app caller files 45 (53 incl. test) | SCATTER 23 dirs
#     GREP-NOISE 'Server' in 295 app files   PRECISION=0.15   SCATTERED + GREP-NOISY
#   python3 bench/lib/seam_hunt.py $CLONE StandaloneDocker --propose
#     app caller files 5 | SCATTER 5 dirs
#     GREP-NOISE 'StandaloneDocker' in 26 app files   PRECISION=0.19   SCATTERED + GREP-NOISY
#   python3 bench/lib/seam_hunt.py $CLONE ServerSetting --propose
#     app caller files 4 | SCATTER 3 dirs
#     GREP-NOISE 'ServerSetting' in 8 app files   PRECISION=0.50   colocated(3dir)
#   PRECISION RANKS, IT NEVER KILLS. `Server` is both the lowest precision of the three
#   (0.15) and the only one of the three with a pool: 5 and 4 caller files cannot yield
#   twelve dependent rows across six areas, so the two alternatives are ruled out by POOL,
#   not by grep. ANCHOR KEPT - attempt 2 moved the subject symbol off the model onto its
#   execution seam and that seam profiled at 0.93, the dead range; this draft moves it back.
#
# THE RETENTION KIND IS OFF THE MENU HERE (RUN, NOT ASSUMED)
#   python3 bench/lib/ring_sweep.py $CLONE --top 12
#     0 candidate(s) above the bar - all twelve anchors `rows 0  files 0  vias 0  under bar`.
#   "What HOLDS X and what stays alive when X goes away" is the strongest measured kind in
#   this bench and it is unavailable in this stack, on this repo, exactly as it was on both
#   Ruby repos swept. That is why this draft is not that question.
#
# EVERY SCORED ROW IS IN THE SHOWN BLAST PAYLOAD (RUN, NOT ASSUMED)
#   python3 bench/lib/mcp_probe.py $CLONE '[{"name":"sense_blast","arguments":{"symbol":"Server"}}]'
#     no min_confidence passed. direct_callers 46, affected_via_composition 89,
#     affected_symbols 298, production_affected 169, affected_files 50,
#     direct_callers_by_area 36 areas, completeness partial (resolved 135, hidden 163).
#   The union of file paths across direct_callers, affected_via_composition and
#   affected_symbols is 101 distinct files. All fourteen scored rows below are in that union,
#   and all four anchors except the contract file itself are too. Unlike attempt 2, this gold
#   is a ONE-SYMBOL union, so `gold_confidence_check.py --group dependents` can and does
#   return 0 on it.
#   The payload's `ref` is the enclosing definition; every line pinned below was opened and
#   read in this session and no credit is taken from a script tally.
#
# MEMORIZATION (bench/lib/memorization_probe.py, quoted, run in this session)
#   Server: {"ok": false, "ran": true, "recall": 0.514, "hits_n": 55, "truth_n": 107,
#            "samples": [0.0, 0.514, 0.0],
#            "reason": "closed-book recall 0.514 (55 members named) >= 0.3 - recited"}
#   Read the payload, not the flag. What comes back recited is the machine class's OWN member
#   list - `isFunctional`, `settings`, `booted`, `getIp`, `definedResources`, ... - and every
#   member of it belongs to the contract file, which is an ANCHOR here and does not score. No
#   scored row is a member of that class: each is a line in one of fourteen OTHER files, and
#   the intersection of the recited `hits` with those files, classes and routines is empty
#   (checked against `hits` in this session). A famous repo is not disqualified, a memorized
#   ROW is, and no row here is memorized - so no row was cut for it.
#
# WHAT THE CITATION RANKING SAID, AND WHAT IT CUT
#   python3 bench/lib/inverse_frequency.py coolify $VDIR/results/claude-opus-5/minibench
#     3 runs (baseline x1, sense x2) over attempt 1's gold, sha256:3637a637b50bf00a;
#     attempt 2's gold (sha256:622b7bba6add8d23) is a different question and is excluded by
#     the script. Result: "never cited by any arm 0; cited by every run 20", with two rows at
#     2/3 - `c:validate-server` (an anchor) and `d:container-stopped`, both at baseline 0/1.
#   n=1 on the baseline arm. That is far below the ~5-runs-per-arm floor the plan sets, so
#   this ranking orders NOTHING here. It is used for the one thing it can support at n=1,
#   which is a CUT: every one of the seventeen dependent files the baseline cited 1/1 in
#   attempt 1 is a free row, and not one of them is in this gold set - StandaloneDocker,
#   SwarmDocker, CleanupHelperContainersJob, VolumeCloneJob, PushServerUpdateJob,
#   DatabaseBackupJob, ScheduledTaskJob, CloudflareTunnelChangedNotification, SettingsBackup,
#   Project/Service/Index, Postgresql/General, Project/CloneMe, remoteProcess.php, docker.php,
#   SshMultiplexingHelper, StopApplicationOneServer, GetContainersStatus are all excluded, and
#   so are the eleven files attempt 2's baseline cited. `d:container-stopped` is the one
#   attempt-1 row carried forward, and it is carried BECAUSE it is the one the baseline missed.
#
# THE RISK IN THIS DRAFT, NAMED
#   Three of the fourteen rows are a `'server_id',` line inside a fillable array on a small
#   model (`SslCertificate`, `DockerCleanupExecution`, `SharedEnvironmentVariable`). One
#   `grep -rn "server_id" app/Models` prints all three at once, so they are a family and they
#   are the cheapest rows here - 3 of 14 = 0.21 of the group to one command. The remaining
#   eleven sit in eleven different areas with no shared token beyond the contract's own name.
#   The honest reading: a baseline that thinks "what STORES one of these" early takes the
#   three model rows and then has to find the other eleven one at a time. The mini-bench is
#   what prices that, and the arithmetic is stated up front: with 14 rows the baseline may
#   take 7 and no more.
# ============================================================================

name: Coolify work session - audit the server contract before a rework
repo: coolify
contract_symbol: Server
contract_file: app/Models/Server.php

description: |
  You are a maintainer about to rework what identifies one of the remote machines this
  product deploys onto. Today a machine is a row with a number, a short handle, a display
  name and a network address, and code all over the product treats any one of those as a
  durable way of getting back to it later. The rework breaks that: a machine will be able to
  be renamed, re-addressed and replaced by a different one standing in for it, so a scrap of
  identity taken now is no longer guaranteed to mean the same machine when it is read back.
  Before you touch it you have to know two things: how a machine's identity is established,
  changed and torn down today, and every place that keeps one of those scraps past the moment
  it had the machine itself - the places that will silently point at the wrong machine, or at
  no machine, without a single line of them changing. Throughout, an answer that points at a
  place must give an exact file:line a teammate could jump straight to, plus one phrase on
  why it matters. A bare filename does not count, a set of names offered together with one
  shared reason and no location on any of them does not count, and a missed dependent is a
  regression shipped.

steps:
  - name: Map the server contract
    prompt: >
      Task: orient, and be thorough - the rest of the ticket is built on this. Start with the
      one thing everything else leans on: what identifies one of these machines, and where
      that identity is established, changed and destroyed. Trace it end to end. Show where the
      identifying fields are normalised as the record is written and where the previous value
      of the changing one is preserved; where a freshly created machine causes further records
      to be seeded from it, including any that take a COPY of an identifying field rather than
      a link back to it; where a lookup by identity is served out of a per-request cache
      instead of the database, and where that cache is emptied; and what the removal path does
      and does not clean up behind it. For each one give the file:line, the name of the
      routine it lives in, and one phrase on what it contributes. Then say, in a few
      sentences, what a rework of identity would have to preserve for everything already
      written down to keep meaning what it means today. A place named without the routine it
      lives in does not count, and neither does a routine named without the file:line where it
      is defined.
    checks:
      - type: response_richness
        value: "8"
        required: true
        description: The identity lifecycle traced through the routines that establish, change and tear it down, each located
      - type: mcp_tool_used
        value: sense_graph
        required: false
        layer: adoption

  - name: Audit every dependent of the server contract
    prompt: >
      Task: this is the core of the ticket, and you are working it with the budget the first
      part already cost you. The places that are handed one of these machines and work with it
      while they have it are the easy half and you have them already - leave them out. What
      you owe me is every place that keeps a SCRAP of a machine's identity after the machine
      itself is gone from its hands: a bare number written into a stored record; a short handle
      pasted into a link or into a message that leaves this process for somewhere we do not
      control; a display name copied into a value that is saved and read back later rather
      than looked up again; a network address used as the thing a lookup is keyed on; a string
      assembled out of one of those and then used to gate, count, cancel or de-duplicate
      something. The place then trusts that scrap to still mean the same machine when it comes
      back to it - a request later, a restart later, or in another system entirely - and that
      trust is exactly what the rework withdraws. Such a place is usually doing some other job
      altogether and may never touch a machine at all; nothing in the line says a remote
      machine is involved, only that a value was kept. So the answer you owe has three parts
      for every one of them: the exact file:line where the scrap is taken, written or read
      back, and the routine that line sits in; WHICH scrap it is and how long it lives - inside
      one request, inside one stored record, or outside this product entirely; and one phrase
      on what this place would start getting wrong the first time that scrap no longer resolves
      to the machine it was taken from. Organise the answer by area, one section per area, and
      treat an area as finished only when every place inside it is listed separately with its
      own location - if you cannot finish an area, say which one and say what you left in it,
      because an area you quietly summarised reads as an area with nothing in it. A file:line
      with no routine named around it does not count, a place named without saying which scrap
      it kept does not count, and a missed one is a regression shipped.
    checks:
      - type: response_richness
        value: "6"
        required: true
        description: Every identity-keeping place located at file:line with the scrap it keeps, its lifetime and its own consequence
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption

scoring:
  weights:
    correctness: 0.7
    efficiency: 0.3

gold:
  # ---- ANCHORS: where identity is established, cached and torn down. Step 1's answer, and
  # ---- the layer step 2 explicitly excludes. Both arms reach these and they do NOT score.
  # ---- Every line below was opened and read in this session. None of these four files
  # ---- appears in the `dependents` group.
  - id: contract-model
    group: contract
    match: [Models/Server.php]
    relation: "app/Models/Server.php:135 `protected static function booted()` - the identity lifecycle in one place: the saving hook trims the address and preserves the old one at :147 `$payload['ip_previous'] = $server->getOriginal('ip');` when it changes, and the created hook at :157 seeds the settings row, a destination and then TWO stored variables that take a COPY of identity rather than a link - :191 `'key' => 'COOLIFY_SERVER_UUID'` and :199 `'key' => 'COOLIFY_SERVER_NAME'`, both written once and never refreshed"
  - id: c:identity-map
    group: contract
    match: [Models/StandaloneDocker.php]
    relation: "app/Models/StandaloneDocker.php:135 `$server = Server::findCached($this->server_id);` inside `getServerAttribute()` (def at :127) - the read side of identity: a stored integer is turned back into a machine through the per-request identity map declared at `app/Models/Server.php:131` and served by `findCached()` at :230, which caches the row for the whole request and is emptied only at :253; this is the mechanism every stored id in the product bottoms out in"
  - id: c:server-setting
    group: contract
    match: [Models/ServerSetting.php]
    relation: "app/Models/ServerSetting.php:59 `'server_id',` in the fillable list, with `public function server()` at :247 returning the belongsTo - the settings record created for every machine at `app/Models/Server.php:157`, the simplest example of identity kept as a link rather than as a copy"
  - id: c:server-delete
    group: contract
    match: [Server/Delete.php]
    relation: "app/Livewire/Server/Delete.php:60 `$this->server->delete();` inside `delete()` (def at :34), followed at :61 by `DeleteServer::dispatch(` handed nine SCALARS - the id, the cloud-provider instance ids, the token id and the team id - rather than the machine; the teardown path, and the point after which every scrap kept elsewhere in the product refers to a machine that no longer exists"

  # ---- DEPENDENTS: fourteen rows, ONE PER FILE, across twelve areas
  # ---- (app/Notifications/Container, app/Notifications/Server, app/Jobs, app/Models,
  # ---- app/Livewire, app/Livewire/Boarding, app/Livewire/Settings,
  # ---- app/Livewire/Destination/New, app/Livewire/Project/New,
  # ---- app/Livewire/Project/Application, app/Livewire/SharedVariables/Server,
  # ---- app/Livewire/Server/Proxy). Every row is in the shown `sense_blast` payload for
  # ---- `Server` quoted in the header. Every line below was opened and read in this session.
  # ----
  # ---- Not one of the seventeen files attempt 1's baseline cited, and not one of the eleven
  # ---- attempt 2's baseline cited, appears here. The single carry-over is
  # ---- `d:container-stopped`, which attempt 1's baseline cited 0 of 1.

  # -- scrap: identity copied into a message that leaves this product for a system we do not
  # -- control. The copy is taken at render time and is never revisited.
  - id: d:container-stopped
    group: dependents
    match: [Container/ContainerStopped.php]
    relation: "app/Notifications/Container/ContainerStopped.php:113 `'server_name' => $this->server->name,` with `'server_uuid' => $this->server->uuid,` at :114 inside `toWebhook()` (def at :106) - an alert renders a machine's display name and handle into a payload posted to somebody else's endpoint, and the same name is interpolated into five other channel bodies (mail :27, discord :41, telegram :54, pushover :85, slack :93); the webhook keys are a public contract other systems parse, so a rename makes every already-delivered alert refer to a machine nobody can find, and a stand-in machine makes them refer to the wrong one"
  - id: d:high-disk-usage
    group: dependents
    match: [Server/HighDiskUsage.php]
    relation: "app/Notifications/Server/HighDiskUsage.php:99 `'server_uuid' => $this->server->uuid,` inside `toWebhook()` (def at :92), with :102 `'url' => base_url().'/server/'.$this->server->uuid` - this one goes further than a copied field: it BUILDS A LINK out of the handle and ships it, and the same construction is repeated into the discord body at :49, the pushover buttons at :68 and the slack description at :82; every one of those links is dead the moment the handle stops resolving, and they live in message histories long after the machine does"
  - id: d:storage-check-key
    group: dependents
    match: [Jobs/ServerStorageCheckJob.php]
    relation: "app/Jobs/ServerStorageCheckJob.php:62 `'high-disk-usage:'.$this->server->id,` inside `handle()` (def at :45), with the paired write at :74 `RateLimiter::hit('high-disk-usage:'.$this->server->id, 600);` - the machine's id is COMPOSED INTO A STRING and used as a rate-limiter key that outlives the job by ten minutes; it also logs the id and name together at :36-:37 in `failed()`. If a replacement machine inherits the id it inherits the silence too, and if the id changes the throttle is bypassed and the alert fires on every check"

  # -- scrap: an integer persisted in a stored row. The row outlives every process, and the
  # -- line that keeps it says nothing about a remote machine at all.
  - id: d:shared-env-var
    group: dependents
    match: [Models/SharedEnvironmentVariable.php]
    relation: "app/Models/SharedEnvironmentVariable.php:22 `'server_id',` in the fillable list, with `public function server()` at :64 - the sharpest row in this group: two rows of this table are created at `app/Models/Server.php:191` and `:199` whose stored VALUE is a copy of the machine's handle and display name, so this table holds identity twice over - once as a link that a rename follows, and once as a value frozen at creation that it does not"
  - id: d:ssl-certificate
    group: dependents
    match: [Models/SslCertificate.php]
    relation: "app/Models/SslCertificate.php:16 `'server_id',` in the fillable list, sitting between `'resource_type'` and `'common_name'` in the same array - a generated certificate is filed against the machine it was issued for, and the certificate material at :10-:11 is only valid where it was installed; the row survives the machine, so a re-used id hands one machine's private key to another"
  - id: d:cleanup-execution
    group: dependents
    match: [Models/DockerCleanupExecution.php]
    relation: "app/Models/DockerCleanupExecution.php:10 `'server_id',` in the fillable list of a twenty-one-line model, with `public function server(): BelongsTo` at :17 - a permanent history of cleanup runs keyed to a machine, read back long after each run; the history is the only place a past cleanup is recorded, so once the id stops meaning what it meant the record still displays, attributed to whatever now answers to that number"

  # -- scrap: identity carried through a redirect or a form step as a loose parameter, then
  # -- written into whatever gets created at the end of the flow.
  - id: d:new-resource-select
    group: dependents
    match: [New/Select.php]
    relation: "app/Livewire/Project/New/Select.php:441 `'server_id' => $this->server_id,` inside the redirect built by `setPostgresqlType()` (def at :432), repeated at :456 in `whatToDoNext()` (def at :446) - the chosen machine survives the wizard as a bare number in a URL, and it ARRIVED as one too at :78 `$queryServerId = request()->query('server_id');` before being resolved back at :85; the property that carries it is declared `public string $server_id` at :19, so nothing in this component holds a machine between steps - only the number does, across a full browser round trip"
  - id: d:new-destination
    group: dependents
    match: [Destination/New/Docker.php]
    relation: "app/Livewire/Destination/New/Docker.php:87 `'server_id' => $this->selectedServer->id,` inside `submit()` (def at :74), and again at :98 on the non-swarm branch - the moment a machine's identity becomes a permanent row: the destination created here is what every deployed resource later walks through to find its machine, and it stores the number, not the machine; the flow enters at :35 `mount(?string $server_id = null)` with the identity already reduced to a string"
  - id: d:deployment-navbar
    group: dependents
    match: [Application/DeploymentNavbar.php]
    relation: "app/Livewire/Project/Application/DeploymentNavbar.php:101 `$server_id = $this->application_deployment_queue->server_id ?? $this->application->destination->server_id;` with the build-machine variant at :100, both inside `cancel()` (def at :91) - a cancellation reads TWO ids back out of a queued row written when the deployment started, then resolves whichever one applies at :110-:112 to send the kill command; the queued row can be hours old, so this is the clearest case of a scrap outliving its machine - the cancel lands on whatever now answers to that number, or on nothing, and the deployment is marked cancelled either way at :104"

  # -- scrap: identity used as the KEY of the lookup rather than as its result.
  - id: d:boarding-by-address
    group: dependents
    match: [Boarding/Index.php]
    relation: "app/Livewire/Boarding/Index.php:310 `$foundServer = Server::whereIp($this->remoteServerHost)->first();` inside `saveServer()` (def at :299) - the onboarding flow uses the NETWORK ADDRESS as the identity, and the two branches under it at :312-:317 decide whether the operator is shown 'already exists in your team' or 'already in use by another team' purely on that match; once an address can move between machines this duplicate check either blocks a legitimate machine or admits a second record for one already present"
  - id: d:settings-updates
    group: dependents
    match: [Settings/Updates.php]

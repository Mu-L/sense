# Per-scenario rubric for the LLM judge layer.
#
# Four criteria per step, weights summing to 1.0: map_quality 0.40 / specificity 0.25
# / justification 0.20 / uncertainty 0.15.
#
# CYCLE 1 / ATTEMPT 3 on coolify, TWO-STEP PROBE (plans/cycle-1-craft-the-scenario/01-author.md).
# TWO steps, names verbatim and in the order of scenarios/coolify.yaml (the judge pairs by
# name). It replaces the attempt-2 rubric, whose step 2 rewarded naming the receiver of a
# hand-off; the baseline reached 11 of 13 of those (cited_recall 0.8462, delta 0.000) and the
# scored group has been replaced entirely.
#
# WHY map_quality carries the most weight on the discriminator: this scenario's axis is a
# DETACHED SCRAP WITH A LIFETIME, not a call, not a held reference and not a hand-off. Every
# scored place keeps something small - a number, a handle, a name, an address, a composed key -
# after the machine itself is gone from its hands, and trusts it to still resolve later. What
# separates a good answer from a dense one is whether it reached the places that are doing some
# other job entirely and merely kept a value, across the whole codebase rather than in the tree
# a first search happened to open.
#
# WHY specificity demands the routine AND the scrap: a file:line here is not self-explaining.
# Two near-identical lines differ entirely on this axis depending on how long the value lives,
# so naming WHICH scrap was kept is part of locating the dependency, not a bonus.
#
# WHAT MUST NOT EARN CREDIT ON STEP 2: the places that are handed one of these machines and
# work with it while they have it. The step tells the agent to leave them out, they are the
# product's spine, and they are what a search over the contract's name returns first. A dense
# list of the code that acts on a machine is the failure mode this rubric exists to catch,
# because it is the answer both previous measured baselines produced.
audience: 'An AI coding agent that will use this answer to safely rework what identifies one of

  the remote machines Coolify deploys onto - so that a machine can be renamed, re-addressed and

  replaced by a stand-in without a scrap of identity taken earlier silently pointing at the

  wrong machine, or at none. Score for that agent, not a human reader and not a docs page. A

  perfect answer leaves the agent able to make that change knowing two things: how identity is

  established, changed and torn down today - where the identifying fields are normalised as the

  record is written, where the previous value of a changing one is preserved, where creation

  seeds further records including ones holding a COPY of an identifying field rather than a

  link, where a lookup by identity is served from a per-request cache and where that cache is

  emptied, and what the removal path leaves behind - each traced through the routines that make

  it up; and every place that keeps a scrap of identity past the moment it held the machine,

  each pinned to an exact file:line, with the scrap named, its lifetime stated, and the

  consequence for that place spelled out. The dependents that matter are not the code that acts

  on a machine. They are places doing some other job entirely - rendering an alert that leaves

  this product for somebody else''s endpoint, filing a generated certificate against a number,

  keeping a permanent history row, carrying a choice through a browser redirect as a bare

  parameter, cancelling work from a queued record written hours earlier, checking for a

  duplicate by network address, addressing the product''s own host by a hardcoded number,

  building a search projection out of copied fields, hiding two frozen copies of identity from

  an editor by name - which often never touch a machine at all and break only because a value

  they kept stops resolving. A weak answer re-lists the places that hold or are handed a

  machine, which the step explicitly excludes; or collapses a run of such places into one line

  with a shared reason and no location on any of them; or gives file:line without saying which

  scrap was kept, which leaves the agent knowing where a number appears and not what depends on

  it still meaning something.

  '
steps:
- name: Map the server contract
  criteria:
    map_quality:
      weight: 0.4
      question: 'Is the identity lifecycle traced as one connected story - established, changed,

        cached, torn down - rather than listed as places a field is mentioned? The step asks for

        four jobs along that lifecycle: where the identifying fields are normalised as the record is

        written and where the previous value of the changing one is preserved; where creation seeds

        further records from the new machine, including any that take a COPY of an identifying field

        rather than a link back to it; where a lookup by identity is served out of a per-request

        cache instead of the database and where that cache is emptied; and what the removal path

        does and does not clean up behind it. The question is COVERAGE OF THE JOBS - all four shown

        and connected is the full answer, and noticing the copies is the part that makes the next

        step tractable. Could the next step act from this map with small targeted lookups rather

        than a fresh exploration?

        '
    specificity:
      weight: 0.25
      question: 'Does every place carry an exact file:line AND the name of the routine it lives in? A

        bare filename is not specific. A file:line with no routine named around it is not specific -

        the maintainer asked whose code it is, not where the character offset falls. A routine named

        without the file:line where it is defined is not specific either. Where the answer names a

        cached lookup, a preserved previous value or a seeded copy, is the line that actually writes

        or reads it located, and not just asserted from the name of the surrounding hook?

        '
    justification:
      weight: 0.2
      question: 'Does each place carry one phrase on what it contributes to identity - what it

        normalises, what it preserves, what it copies rather than links, what it serves without

        going to the database, what it leaves behind - and does the closing statement say what a

        rework would have to preserve for everything ALREADY WRITTEN DOWN to keep meaning what it

        means today, rather than restating the hook names?

        '
    uncertainty:
      weight: 0.15
      question: 'Does the answer separate what it verified by reading from what it inferred from a

        name or from a familiar framework convention? Model lifecycle hooks and cache helpers invite

        confident guessing; saying which parts were actually opened is worth more. Is completeness

        claimed without saying how it was established?

        '
- name: Audit every dependent of the server contract
  criteria:
    map_quality:
      weight: 0.4
      question: 'THE DISCRIMINATOR, and it is A DETACHED SCRAP together with BREADTH OF AREA. Does

        the audit reach the places that merely KEPT something - a number in a stored record, a

        handle pasted into a link or into a message that leaves this product, a display name copied

        into a saved value, a network address used as the key a lookup is done on, a string composed

        out of one of those and used to gate, count or cancel - or does it re-list the places that

        are handed one of these machines and work with it, which the step told it to leave out? The

        places that decide this step sit as much in the outbound alert payloads and the links built

        inside them, the small records filed against a number and read back long afterwards, the

        wizard step that carries a choice through a browser redirect as a bare parameter, the

        cancellation that reads an id out of a queued row written hours earlier, the duplicate check

        keyed on a network address, the page that addresses the product''s own host by a hardcoded

        number, the search projection built out of copied fields, and the editor that hides two

        frozen copies of identity by name, as in the code that acts on a machine. An answer that is

        dense in one tree and silent in the others has enumerated inside one search scope and

        mistaken that for the codebase. Does the answer say, for each place, WHICH scrap was kept

        and HOW LONG IT LIVES - inside one request, inside one stored record, or outside this

        product entirely - which is the distinction a reading of the line alone does not give? Is

        the answer organised by area with each area worked to the end, and are areas it could not

        finish declared as unfinished rather than quietly summarised? Re-listing the places that

        hold or receive a machine is not this question, however many of them are named.

        '
    specificity:
      weight: 0.25
      question: 'Does EVERY place carry its own exact file:line AND the name of the routine the line

        sits inside AND the scrap it kept? All three, because a location alone does not identify

        this kind of dependency: the same line shape means something different depending on whether

        the value dies with the request or is written to a row. Several places named together on one

        line as a set that shares a reason is the failure this criterion exists to catch: however

        correct the shared reason is, it is one item, not a set of located places, and it should be

        scored as one. A bare filename does not count.

        '
    justification:
      weight: 0.2
      question: 'Does each place carry one phrase on what IT would start getting wrong the first time

        its scrap no longer resolves to the machine it was taken from? The consequence must be about

        that place''s own job - the delivered alert that names a machine nobody can find, the link

        in a message history that leads nowhere, the throttle that a replacement machine silently

        inherits or that stops suppressing anything, the certificate filed against a re-used number,

        the history row attributed to whatever now answers to it, the wizard that creates a resource

        against the wrong machine, the cancellation that lands on nothing while the deployment is

        marked cancelled anyway, the duplicate check that blocks a legitimate machine or admits a

        second record, the self-update path that quietly stops addressing the host, the search entry

        that navigates the operator somewhere stale, the hidden values that contradict the record

        they belong to - not a restatement of the line. Does it distinguish a scrap that fails

        loudly from one that resolves to the wrong thing silently?

        '
    uncertainty:
      weight: 0.15
      question: 'Does the answer say how it convinced itself the audit is exhaustive, and name where

        it is likely still thin? An unqualified claim of completeness over a codebase this size is

        overconfidence. Naming an area it knows it did not finish, and what it left there, is worth

        more than a confident list that quietly stops. Scraps that never sit beside anything naming

        a machine - a number in a fillable list, a string built into a key, a value copied at

        creation and never refreshed - are the ones an audit of the obvious surface misses, and

        saying which of those it went looking for and how is worth more than asserting full

        coverage.

        '

# ============================================================================
# TWO-STEP PROBE, CYCLE 3 on discourse (plans/01-author.md, re-question).
# Superseded: the cycle-2 22-row mixed probe, kept at scenarios/discourse.yaml.mixed-22row.bak.
# The number that killed it: baseline `dependents` 12/22 = 0.5455, sense 14/22 = 0.6364,
# delta +0.0909.
#
# THE TRAJECTORY, EVERY CYCLE, AND WHICH SIDE OF THE WINDOW IT FELL ON
#   (window = plain arm <= 0.50 AND ours >= +0.50 above it, both at once)
#   cycle 0  two-step probe, thin ask, 15 rows   base 6/15  = 0.400   sense 14/15  +0.533  INSIDE
#   cycle 1  seven-step briefed session, 15 rows base 11/15 = 0.733   sense 14/15  +0.200  BASE TOO HIGH
#   cycle 2  two-step probe, 22 rows (+7 assoc)  base 12/22 = 0.5455  sense 14/22  +0.091  BASE TOO HIGH
#
#   I am correcting from the BASELINE-TOO-HIGH side for the second time, and this draft moves
#   further than cycle 2 did: cycle 2 only ADDED rows and left the baseline's twelve in place,
#   which is why the floor barely moved (0.733 -> 0.5455 is arithmetic on a bigger denominator,
#   not a harder question). This draft REMOVES them. Intended landing: baseline at or below
#   0.25, ours at or above 0.75.
#
# WHAT CYCLE 2 MEASURED, QUOTED FROM ITS scored.json (both arms, run-1)
#   baseline missed_mention == missed_cite ==
#     ['d:tags-search','d:migrations-optimizer','d:rss-polling','d:embeddable-host',
#      'd:form-template','d:shared-draft','d:tag-group','d:topic-timer','d:user-history',
#      'd:web-hook']
#   sense     missed_mention == ['d:migrations-optimizer','d:rss-polling']
#   sense     missed_cite    == ['d:migrations-optimizer','d:rss-polling','d:embeddable-host',
#      'd:form-template','d:shared-draft','d:tag-group','d:topic-timer','d:user-history']
#
#   Read off those three lists, per row:
#   (a) The SEVEN association rows split the arms 7-0 at MENTION level. The baseline did not
#       reach one of them. That is the only measured separation this repo has produced that a
#       constant sweep did not erase, and it is what this gold is built on.
#   (b) Sense reached all seven and CITED one. The six it lost are `mentioned: true,
#       cited: false`. That is not a reach failure, it is a FORM failure, and the transcript
#       names the cause - sense answered them as ONE bullet with no location on it:
#         "**Associations that would follow a schema/API change** (all `belongs_to :category`
#          or a `category_id` FK): `CategoryUser`, `CategoryGroup`, `CategorySetting`, ..."
#       The cycle-2 ask demanded "the routine the dependency is inside" for every dependent.
#       A declared link sits in no routine, so the arm could not answer those rows in the form
#       the ask demanded and demoted the whole set to a name list. That is the citeability law
#       exactly: a gold row must be citeable in the form the ask demands. STEP 2 IS REWRITTEN
#       FOR THIS, and it is the single largest bet in this draft.
#   (c) The twelve rows the baseline took are ALL constant call sites, and it took them with
#       one scripted enumeration - `grep -rn "Category\." app lib plugins/*/lib plugins/*/app`
#       at call 12, then a hand-written /tmp/encl.rb walking {app,lib}/**/*.rb and
#       plugins/**/*.rb to attach the owning `def` to each hit, calls 14 and 16. Twelve of
#       twenty-two fell out of that one pass, in 219s of a 371s wall. Those twelve are gone
#       from this gold.
#
# WHICH ROWS THE BASELINE HAS MISSED CONSISTENTLY (inverse_frequency.py, three runs per arm:
#   minibench/a54d1d3cface69e6 = cycle 0, validation/f6a017bb2fc1451e = cycle 1,
#   minibench/1b6e6d97c70982fa = cycle 2)
#     baseline 3/3 (FREE, all cut) : backup-restorer, email-receiver, topic-guardian,
#                                    topic-view-serializer, topics-controller
#     baseline 2/3 (cut)           : chat-channel-fetcher, chat-integration-helper,
#                                    search-indexer, topic-voting, user-destroyer, tags-search
#     baseline 1/3 (KEPT)          : seed-topics, user-notifications, rss-polling
#     baseline 0/3 (KEPT)          : migrations-optimizer
#   n is three, not the ~5 the standing law wants, so the 2/3 band is noise as a COUNT and I
#   am not leaning on it as one. It is cut on a MECHANISM argument instead: every row in the
#   3/3 and 2/3 bands is a bare `Category.` call site inside app, lib or plugins, which is
#   exactly the set the cycle-2 script enclosed in one pass.
#
# THE GOLD IN THIS DRAFT - 12 rows, and what each one is doing there
#   SEVEN declared-link rows, baseline 0/7 measured: embeddable-host, form-template,
#     shared-draft, tag-group, topic-timer, user-history, web-hook. Each reaches the contract
#     through an association macro naming the lowercase symbol; each file writes the class
#     name ZERO times, checked per file with a word-boundary regex rather than a substring
#     count - `(?<![A-Za-z0-9_])Category(?![A-Za-z0-9_])`, 0 matches in all seven.
#   FIVE call-site rows, kept for AREA SPREAD and so the group is not one mechanism a single
#     command can cover: seed-topics, user-notifications, rss-polling, migrations-optimizer,
#     tags-search. The first four are the 1/3 and 0/3 band. `d:tags-search` is the fifth and
#     the weakest row here - it was 2/3 to the baseline - and it is in because cutting it
#     leaves five areas against a floor of six. It is expected to go to both arms.
#   AREAS (6, at the floor and honestly so): app/models (7), app/services/tags, app/mailers,
#     lib/seed_data, migrations/lib/uploader/tasks, plugins/discourse-rss-polling/app/jobs.
#     The declared-link mechanism only exists in app/models on this repo - every .rb file in
#     the shown blast payload with zero word-boundary `Category` occurrences is under
#     app/models. That is a property of the payload, recorded, not worked around.
#
# ARITHMETIC KILLER, RUN
#   Recall caps at 1.00. If the baseline lands where cycle 2 measured it per row - 0 of the
#   seven declared rows, and 2 of the five call sites (it took seed-topics and
#   user-notifications, missed rss-polling, migrations-optimizer and tags-search) - it sits at
#   2/12 = 0.167, or 3/12 = 0.250 if tags-search falls to it, leaving 0.75 of headroom, so
#   +0.50 is reachable with room. For the pair to clear the bar sense needs 8 or 9 of 12.
#   Cycle 2's sense arm MENTIONED 10 of these 12 - it missed migrations-optimizer and
#   rss-polling entirely - and CITED 4. So the whole margin lives in the six
#   mention-to-cite conversions, and if the rewritten step 2 does not convert them this cell
#   fails on the SENSE side, not the baseline side. That is the named risk of this draft and
#   the next run settles it.
#
# WHAT A GREP PRINTS (recorded, never a gate)
#   `grep -rln --include='*.rb' 'belongs_to :category\b\|has_many :categories\|
#    has_and_belongs_to_many :categories' app lib plugins` returns 37 FILES and covers all
#   seven declared rows in one command. Step 2 names the mechanism, as the plan requires, so
#   a baseline that translates "holds a stored reference, declared once in the lowercase" into
#   that command reaches the seven. Cycle 2 named a DIFFERENT mechanism and its baseline
#   reached none of them; naming this one may hand them over. This is the cost of the
#   mechanism law and it is paid knowingly - what a grep prints does not decide, the run does.
#   Broader: `grep -rn --include='*.rb' ':category\b' app lib plugins` = 464 lines, 250 files.
#
# THE STRUCTURAL CONSTRAINT THIS GOLD IS AUTHORED AGAINST (owner ruling, not a stopper)
#   `gold.py` scores a row CITED when the gold PATH is pinned to ANY line - `_cited` and
#   `_cited_via_gold_suffix` accept `path:N` for any N, never the gold's own N (ruling comment
#   at gold.py:293; the old exact-line matcher "manufactured fake sense-only cited wins").
#   So the unit of credit is the FILE, `grep -rn` already prints a scoring citation, and gold
#   can only discriminate by which FILES a sweep never opens. That is why the twelve constant
#   call sites had to leave rather than be re-pinned.
#
# SEAM PROFILE - `seam_hunt.py <clone> Category --propose --file app/models/category.rb`
#   app caller files : 89        SCATTER (dirs) : 47
#   GREP-NOISE       : 'Category' in 109 app files
#   PRECISION        : 0.82   (dependents / grep hits; LOWER is better)
#   VERDICT          : SCATTERED + grep-clean
#   Candidates ranked, all worse or unusable: Category 0.82 | DiscoursePluginRegistry 0.99 |
#   StaffActionLogger 1.17 | Guardian 1.27 | Archetype 2.02 | Upload 0.00 and Group 0.00
#   (both RESOLVER GAPS, 0 callers shown, so they can serve no row). Precision ranks; the run
#   decides. The anchor is KEPT per the re-question law - it is the only measured thing this
#   repo owns, and the lever is the question.
#   ring_sweep.py --top 12: 0 candidates above the bar, all twelve anchors at 0 rows / 0 vias.
#     Third Ruby repo to measure zero rings, so "what HOLDS this" is off the menu here.
#   memorization_probe.py Category: closed-book recall 0.196 < 0.3, NOT recited. No gold row
#     is a member of Category itself in any case.
#
# THE AXIS SENTENCE - what the answer is, that is not a list of the places a name appears
#   For seven of the twelve dependents the answer is a record type that holds a stored
#   reference to one of these, declared once in the lowercase and resolved by the framework,
#   so the file never writes the class's name at all and the dependency exists whether or not
#   a single line in that file ever runs.
#   HONEST QUALIFIER: the other five ARE occurrences of the class name, and for those five
#   this scenario is kind one. They are in the group for area spread, not for the win, and
#   the baseline is expected to take two or three of them.
# ============================================================================

name: Discourse work session - audit the category contract before a rework
repo: discourse
contract_symbol: Category
contract_file: app/models/category.rb
description: 'You are a maintainer about to rework the class that represents one of this forum''s

  top-level containers - the thing topics are filed under, that carries its own

  permissions, settings and hierarchy, and that half the product reaches for whenever it

  needs to know where something belongs or who is allowed to see it. The rework will change

  what that class hands back to the code that asks it questions, and it will change the

  shape of what it stores. Before you touch it you have to know two things: how the rest of

  the system gets hold of one of these when all it has is the human-readable path out of a

  URL, and everywhere else in the codebase that would have to be reviewed or changed with

  it. Throughout, an answer that points at a place must give an exact file:line a teammate

  could jump straight to, plus one phrase on why it matters. A bare filename does not

  count, a set of names offered together with one shared reason and no location on any of

  them does not count, and a missed dependent is a regression shipped.

  '
steps:
- name: Map the category contract
  prompt: 'Task: orient, and be thorough - the rest of the ticket is built on this. Start with the one part of this class''s job that every incoming request leans on: getting hold of one of these records when all the system has is the human-readable path the visitor typed, which may name a parent and a child, may be an old path that has since been retired, and may not name one of these at all. Trace that path end to end. Show every entry point that turns such a path into one of these records, every place that walks the hierarchy to disambiguate one level from another, every place that keeps the path in step when the record is renamed, and every place that redirects or refuses because the path turned out to point somewhere else. For each one give the file:line, the name of the routine it lives in, and one phrase on what it contributes to that path. Then say, in a few sentences, what a rework would have to preserve for that path to keep working. A place named without the routine it lives in does not count, and neither does a routine named without the file:line where it is defined. '
  checks:
  - type: response_richness
    value: '8'
    required: true
    description: Resolution path traced through the routines that make it up, each located
  - type: mcp_tool_used
    value: sense_graph
    required: false
    layer: adoption
- name: Audit every dependent of the category contract
  prompt: 'Task: this is the core of the ticket, and you are working it with the budget the first part already cost you. Widen back out from that one path to the class as a whole, as a single subject, and find EVERY place in the codebase that would have to be reviewed or changed with it, so the rework cannot silently break one. Be exhaustive and group them by area. Two kinds of dependent hide from anyone working outward from the class itself, and both count the same here. The first is code in the middle of some other job entirely, which reaches for this class exactly once to settle a question that other job needs answered, from a routine named after the other job and never after this one. The second never asks this class anything at all: it holds a stored reference to one of these records, declared once in the lowercase and resolved for it by the framework, so the file does not write this class''s name anywhere and the dependency is there whether or not a single line in that file ever runs. For every dependent, give the exact file:line where the dependency is established - the line that makes the call, or the line that declares the stored reference - and one phrase on what that place would start getting wrong if the class changed under it. Where the dependency sits inside a routine, name the routine as well. Naming several of them together on one line as a set that shares a reason does not count, however correct the reason is: each one needs its own file:line and its own consequence. A bare filename does not count, and a missed dependent is a regression shipped. '
  checks:
  - type: response_richness
    value: '6'
    required: true
    description: Every dependent located at file:line with its own consequence named
  - type: no_grep
    value: no_grep
    required: false
    layer: adoption
  - type: mcp_tool_used
    value: sense_blast
    required: false
    layer: adoption
scoring:
  weights:
    correctness: 0.7
    efficiency: 0.3
gold:
- id: contract-model
  group: contract
  match:
  - app/models/category.rb
  relation: app/models/category.rb:1083 `def self.find_by_slug_path(slug_path)` - the contract under rework and the class-level entry point every slug-path lookup bottoms out in; :1103 `find_by_slug_path_with_id` is the trailing-id variant that falls back to it at :1110, :985 `def self.query_category(slug_or_id, parent_category_id)` is the one-level lookup the hierarchy walk is built from, :627 `def ensure_slug` keeps the stored slug in step across a rename, and :16 `SLUG_REF_SEPARATOR = ":"` is the separator the ref form is built from
- id: c:categories-controller
  group: contract
  match:
  - app/controllers/categories_controller.rb
  relation: app/controllers/categories_controller.rb:394 `category = Category.find_by_slug_path(params[:slug_path].split("/"))` inside `CategoriesController#find` (def at :387) - the HTTP front door onto the slug-path lookup, raising Discourse::NotFound when it comes back blank
- id: c:hierarchical-search
  group: contract
  match:
  - app/services/category/query/hierarchical_search.rb
  relation: app/services/category/query/hierarchical_search.rb:53 `scope = Category.from("allowed_categories").select(:id)` inside `Category::Query::HierarchicalSearch#matched_scope` - walks the parent/child hierarchy to disambiguate one level from another
- id: c:permalink
  group: contract
  match:
  - app/models/permalink.rb
  relation: 'app/models/permalink.rb:82 `return category.relative_url if category` - the retired-path case: an old URL that no longer resolves is redirected through the permalink record''s category association declared at line 6'
- id: d:embeddable-host
  group: dependents
  match:
  - app/models/embeddable_host.rb
  relation: app/models/embeddable_host.rb:5 `belongs_to :category` in the body of `class EmbeddableHost` - every embedded-comments host stores the container its imported topics are filed under, with the column declared at :80 `category_id :integer not null`; the link is the association macro, so the file never writes the class name (0 word-boundary `Category` matches)
- id: d:form-template
  group: dependents
  match:
  - app/models/form_template.rb
  relation: 'app/models/form_template.rb:18 `has_many :categories, through: :category_form_templates` in the body of `class FormTemplate` - a form template is attached to containers through the join declared one line above at :17, and the :through option is the only thing tying it to the contract; the file never writes the class name (0 word-boundary `Category` matches)'
- id: d:shared-draft
  group: dependents
  match:
  - app/models/shared_draft.rb
  relation: app/models/shared_draft.rb:5 `belongs_to :category` in the body of `class SharedDraft` - a shared draft stores the destination container it will be published into, column at :13; the link is the association macro, so the file never writes the class name (0 word-boundary `Category` matches)
- id: d:tag-group
  group: dependents
  match:
  - app/models/tag_group.rb
  relation: 'app/models/tag_group.rb:21 `has_many :categories, through: :category_tag_groups` in the body of `class TagGroup` - tag groups are scoped to containers through the join declared at :19, and the visibility SQL at :125 filters on `category_tag_groups.category_id`; the file never writes the class name (0 word-boundary `Category` matches)'
- id: d:topic-timer
  group: dependents
  match:
  - app/models/topic_timer.rb
  relation: app/models/topic_timer.rb:6 `belongs_to :category` in the body of `class TopicTimer` - a scheduled publish-to-category timer stores the destination container it will move the topic into, enqueued at :89 and columned at :115; the link is the association macro, so the file never writes the class name (0 word-boundary `Category` matches)
- id: d:user-history
  group: dependents
  match:
  - app/models/user_history.rb
  relation: app/models/user_history.rb:12 `belongs_to :category` in the body of `class UserHistory` - staff action log entries for the CATEGORY_ACTIONS listed at :34 (create_category, change_category_settings, delete_category) store the container they acted on; the link is the association macro, so the file never writes the class name (0 word-boundary `Category` matches)
- id: d:web-hook
  group: dependents
  match:
  - app/models/web_hook.rb
  relation: 'app/models/web_hook.rb:6 `has_and_belongs_to_many :categories` in the body of `class WebHook` - a webhook is filtered to the containers it fires for, and the emitted payload at :111 carries `category_id: topic.category_id`; the link is the association macro, so the file never writes the class name (0 word-boundary `Category` matches)'
- id: d:seed-topics
  group: dependents
  match:
  - lib/seed_data/topics.rb
  relation: 'lib/seed_data/topics.rb:63 `general_category = Category.find_by(id: SiteSetting.general_category_id)` inside `SeedData::Topics#topics` - new-site seeding resolves three configured containers at :63, :64 and :65 before it can place its seed topics; the routine is about seeding topics'
- id: d:user-notifications
  group: dependents
  match:
  - app/mailers/user_notifications.rb
  relation: 'app/mailers/user_notifications.rb:633 `"#{Category.where(id: category.parent_category_id).pick(:name)}/#{show_category_in_subject}"` inside the subcategory branch of `UserNotifications#send_notification_email` - the subject line reaches for the parent container''s name when the topic sits one level down; the routine is about sending an email'
- id: d:rss-polling
  group: dependents
  match:
  - plugins/discourse-rss-polling/app/jobs/jobs/discourse_rss_polling/poll_feed.rb
  relation: plugins/discourse-rss-polling/app/jobs/jobs/discourse_rss_polling/poll_feed.rb:15 `return if @discourse_category_id.present? && !Category.exists?(@discourse_category_id)` inside `Jobs::DiscourseRssPolling::PollFeed#execute` - the feed job aborts when its configured destination no longer exists; the routine is about polling a feed
- id: d:migrations-optimizer
  group: dependents
  match:
  - migrations/lib/uploader/tasks/optimizer.rb
  relation: migrations/lib/uploader/tasks/optimizer.rb:43 `@category_id = Category.last.id` inside `Migrations::Uploader::Tasks::Optimizer#initialize_discourse_resources` - the import optimizer takes whichever container exists to attach its resources to; the routine is about initialising uploader resources, and the file sits outside the app/lib/plugins tree a sweep walks
- id: d:tags-search
  group: dependents
  match:
  - app/services/tags/search.rb
  relation: 'app/services/tags/search.rb:217 `Category` opening the `.joins(tag_groups: :tags)` chain inside `Tags::Search#explain_exclusion` - tag search explains why a tag was excluded by joining back to the container restriction; the routine is about explaining a tag exclusion'

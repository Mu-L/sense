# Per-scenario rubric for the LLM judge layer.
#
# Four criteria per step, weights summing to 1.0: map_quality 0.40 / specificity 0.25
# / justification 0.20 / uncertainty 0.15.
#
# WHY map_quality carries the most weight here: this scenario's axis is ATTRIBUTION, not
# enumeration. A search prints the line that takes the dependency; it never prints the
# routine that owns that line. The answer that matters says WHOSE behaviour changes - the
# enclosing routine, and what it would start getting wrong - for every dependent, under a
# budget the first step already spent.
#
# Step names MUST match scenarios/discourse.yaml exactly (the judge pairs by name).

audience: |
  An AI coding agent that will use this answer to safely rework the Discourse category
  class - the container topics are filed under, carrying its own permissions, settings and
  hierarchy. Score for that agent, not a human reader and not a docs page. A perfect answer
  leaves the agent able to change that class knowing two things: how the rest of the system
  gets hold of one of these records when all it holds is the human-readable path out of a
  URL - traced through the routines that make that path up - and every other place that
  would have to change with the class, each one attributed to the routine the dependency
  sits inside, pinned to an exact file:line, with the consequence of the change on that
  routine stated. The dependents that matter are not the ones whose job is categories; they
  are the ones doing some unrelated job - destroying a user, indexing for search, receiving
  an email, casting a vote, restoring a backup - that reach for the class once in the
  middle of it, from a routine named after that other job. A weak answer lists places
  rather than routines; sweeps the obviously category-named neighbours and stops; collapses
  a set into "all the services"; or gives file:line with nothing said about which routine
  owns the line or what breaks in it - which leaves the agent knowing where the name
  appears and not what its change would do.

steps:
- name: Orient in the codebase
  criteria:
    map_quality:
      weight: 0.4
      question: |
        Does the answer give a usable map of the project - what it is, how the tree is laid out,
        where the class under rework sits, and what its behaviour is assembled from (the concerns
        mixed in, the associations it declares, the settings it reads)? The test is whether the
        next step can act from this map with small targeted lookups instead of starting over.
    specificity:
      weight: 0.25
      question: |
        Are the claims anchored to paths, and the class and its assembled pieces to file:line? A
        tour of the directory names with no file:line anywhere is not specific.
    justification:
      weight: 0.2
      question: |
        Does the orientation say why each part of the map matters to the ticket, rather than
        reciting the directory layout of a Rails application in general?
    uncertainty:
      weight: 0.15
      question: |
        Does it separate what it read from what it assumed from a conventional layout? A Rails
        tree invites confident guessing; saying which parts were actually opened is worth more.
- name: Map the category contract
  criteria:
    map_quality:
      weight: 0.4
      question: |
        Is the slug-path resolution path traced end to end as one connected path, rather
        than listed as places the class is mentioned? A strong answer reaches the
        class-level entry point every lookup bottoms out in, the trailing-id variant, the
        one-level lookup the hierarchy walk is built from, the hierarchy walk itself, the
        HTTP front door, the rename path that keeps a stored slug in step, and the
        retired-path redirect. Credit is for showing how they connect, not for the count.
        Could the next step act from this map with small targeted lookups rather than a
        fresh exploration?
    specificity:
      weight: 0.25
      question: |
        Does every place carry an exact file:line AND the name of the routine it lives
        in? A bare filename is not specific. A file:line with no routine named around it
        is not specific - the maintainer asked whose code it is, not where the character
        offset falls. A routine named without the file:line where it is defined is not
        specific either.
    justification:
      weight: 0.2
      question: |
        Does each place carry one phrase on what it contributes to the resolution path -
        which input form it accepts, what it disambiguates, what it falls back to, why it
        refuses? Do the closing sentences say what a rework must preserve in terms of
        behaviour, rather than restating the method names?
    uncertainty:
      weight: 0.15
      question: |
        Does the answer separate what it verified by reading from what it inferred from a
        name? Guessing at a fallback it never opened is worse than saying it did not
        check. Is completeness claimed without saying how it was established?
- name: Trace how one of these records is built up and taken apart
  criteria:
    map_quality:
      weight: 0.4
      question: |
        Is the lifecycle traced as a sequence - the decision that one is needed, its creation, the
        renames and re-descriptions that follow, and its teardown - with what runs around each
        moment? A strong answer separates three timings and does not collapse them: what runs
        inline in the call that saved the record, what is handed off to a background job, and what
        runs later on a repeating schedule and is not triggered by the save at all. Listing the
        callbacks off the model in declaration order without saying when each actually runs is
        weaker than a shorter answer that gets the timings right.
    specificity:
      weight: 0.25
      question: |
        Does every layer carry a file:line and the routine it lives in, including the deferred
        ones - the job class that picks the work up, not just the line that enqueues it?
    justification:
      weight: 0.2
      question: |
        For each hand-off, does the answer say WHAT is handed over - the record itself, or an
        identifier to be looked up again later - and why that matters to a contract change? A
        deferred consumer that re-resolves by id can find the record gone; one holding the record
        cannot. That distinction is the point of the step.
    uncertainty:
      weight: 0.15
      question: |
        Does the answer flag the parts of the lifecycle it could not follow - work dispatched by a
        registered name rather than a direct call is easy to miss, and saying so is worth more
        than an unqualified claim that the lifecycle is fully covered.
- name: Audit every dependent of the category contract
  criteria:
    map_quality:
      weight: 0.4
      question: |
        THE DISCRIMINATOR. Is this an exhaustive, area-grouped audit of everywhere that
        would have to change with the class, reaching the scattered periphery rather than
        the obvious category-named neighbours? The dependents that matter are in the
        middle of some other job entirely: destroying a user, indexing for search,
        deciding whether inbound email is a mailing-list mirror, serializing a topic
        timer, seeding a new site, composing a notification subject, scoping a chat
        channel search, publishing a shared draft, explaining a tag exclusion, gating a
        vote, restoring a backup, polling a feed, deciding a featured-link permission.
        Breadth across areas is what is being measured, and missing a whole area is a
        regression shipped. Re-listing the class's own surface, or the association models
        named after it, is not this question.
    specificity:
      weight: 0.25
      question: |
        For every dependent: the routine the dependency sits inside, its file:line, and
        the consequence. A file:line with no routine named around it does not count - it
        is the output of a search, not the answer to the question asked. A routine named
        with no consequence stated does not count. Marks are lost per dependent that
        arrives as a bare location.
    justification:
      weight: 0.2
      question: |
        Does each dependent carry one phrase on what that routine would start getting
        wrong if the class stopped handing back what it hands back today? The consequence
        must be about the routine's own job - what breaks for the user being destroyed,
        the email being received, the vote being cast - not a restatement of the line of
        code.
    uncertainty:
      weight: 0.15
      question: |
        Does the answer say how it convinced itself the audit is exhaustive, and name
        where it is likely still thin? An unqualified claim of completeness over a
        codebase this size is overconfidence. Flagging areas it could not reach within
        budget is worth more than a confident list that quietly stops.
- name: Trace the guards that confirm a real, current record
  criteria:
    map_quality:
      weight: 0.4
      question: |
        Does the answer cover the distinct KINDS of guard rather than many instances of one kind?
        The kinds are: a type check on something that may not be one of these at all; a lookup by
        user-supplied name or identifier turned into a refusal at the boundary instead of a nil
        handed downstream; and a reference stored earlier re-checked against what is actually
        there before it is trusted. Missing a whole kind costs more than missing an instance.
    specificity:
      weight: 0.25
      question: |
        Does each guard carry a file:line and its enclosing routine? A validation named by its
        method alone, or a bare file, is not specific.
    justification:
      weight: 0.2
      question: |
        Does each guard carry one phrase on what it protects the caller from - what would reach
        the next layer and fail there if the guard were removed - rather than restating the
        condition in words?
    uncertainty:
      weight: 0.15
      question: |
        Does the answer distinguish guards it read from guards it expects a framework to provide?
        Assuming a validation exists because a Rails model usually has one is the failure here.
- name: Assess the blast radius of the contract change
  criteria:
    map_quality:
      weight: 0.4
      question: |
        Is this a RANKING that adds something to the audit, or the audit relisted? A strong answer
        separates dependents that would fail loudly and immediately from those that would keep
        running and quietly return something different, and says what drives the split. The quiet
        ones are the expensive ones and a ranking that does not surface them has not done the
        step. Ranking everything as high risk is not a ranking.
    specificity:
      weight: 0.25
      question: |
        Is each risk pinned to the routine that carries it, at a file:line, rather than to the
        file it sits in? A ranked list of filenames is not this step's answer.
    justification:
      weight: 0.2
      question: |
        Does each rank carry its reason - why this one breaks first, why that one degrades
        silently, what has to be re-verified afterwards and how? A ranking with no stated driver
        is an ordering the maintainer cannot check.
    uncertainty:
      weight: 0.15
      question: |
        Does the answer say which parts of the radius it is least sure of, and name what it would
        have to look at to firm them up? Confident totals over a codebase this size are the tell.
- name: Produce the change + verification map
  criteria:
    map_quality:
      weight: 0.4
      question: |
        Is this a map a teammate could land the change from without re-exploring - the pieces of
        the contract itself that get edited, every dependent grouped by area, and the test surface
        that has to move with it? Completeness against everything found earlier in the session is
        what is measured; a map that quietly drops areas the audit reached is the failure.
    specificity:
      weight: 0.25
      question: |
        Do the edits and the dependents carry file:line and the enclosing routine? The tests are
        the exception: a test that must be ADDED has no line yet, so naming the file it belongs in
        is the correct form there and is not penalised.
    justification:
      weight: 0.2
      question: |
        Does the map say what each edit is for and what each test would be covering - the
        behaviour that moves - rather than listing paths under headings?
    uncertainty:
      weight: 0.15
      question: |
        Does it state what it is not sure survives the change, and what it would want checked
        first? A plan claiming to be complete over the whole radius, with no residual risk named,
        is overconfident.

#            side: SENSE TOO LOW (results/dryrun/discourse/minibench.6.md). Our arm DID call
#            sense_blast this time - 76 holders by area - and landed on the same six rows
#            the baseline's three cheap greps print.
#   cycle 7  cycle 4's prompts verbatim, gold re-cut to twelve periphery rows
#            base 4/12 = 0.3333  sense 9/12 = 0.75   delta +0.4167
#            side: SENSE TOO LOW, but only just - 0.0833 short, the closest this repo has
#            come other than cycle 4's exact-bar landing (results/loop/discourse/minibench.md,
#            discourse.yaml.periphery-cycle7.bak)
#
# WHICH SIDE THIS DRAFT CORRECTS FROM, AND HOW FAR IT INTENDS TO MOVE
#   From SENSE TOO LOW, by 0.0833. That is a much smaller correction than cycles 5 and 6
#   needed, and it is aimed at a single named failure rather than at the shape of the
#   question, so the move is deliberately SMALL. The baseline half is left alone: at 0.3333
#   it is comfortably inside the window with 0.6667 of headroom, and every attempt this loop
#   has made to push it lower (cycles 5, 6) cost our own arm more than it cost the plain arm.
#
#   The diagnosis on disk is unusually clean and it is quoted rather than reconstructed
#   (results/loop/discourse/minibench.md, "What the next question must defeat"):
#
#     "The lever here is not the baseline and not the anchor. Both diagnostics that would
#      normally route a rewrite came back clean: the baseline sits at 0.3333 with a
#      laborious 18-search route, and `sense_blast` returned every one of the three missed
#      files. The single failure is that the sense arm was shown
#      migrations/lib/uploader/tasks/optimizer.rb,
#      plugins/discourse-templates/lib/tasks/discourse-templates.rake and
#      plugins/discourse-chat-integration/app/jobs/onceoff/migrate_from_slack_official.rb
#      in its blast payload and did not carry them into the answer at path:line."
#
#   So: the ANCHOR is kept, the GOLD SET is kept unchanged, and STEP 2's closing paragraph
#   is rewritten. Everything before that paragraph - the mechanism sentence that makes this
#   the periphery question rather than a call-site question - is cycle 4's and cycle 7's
#   wording verbatim, because it is the part that measured 0.3333 against the plain arm
#   twice and must not be disturbed.
#
#   What changes: the answer must be CLOSED over the set the arm assembled, not covered
#   against the contract. The arm assembles its candidates first, works them in the order it
#   assembled them, pins each before moving on, and reconciles at the end - how many it
#   assembled against how many it pinned, naming any difference at file:line. A candidate
#   it rules out still costs a file:line and a clause, so dropping is more expensive than
#   keeping. Cycle 7's step 2 already carried a per-area anti-summary clause ("treat an area
#   as finished only when every dependent inside it is listed separately"); it did not fire,
#   because the three dropped rows were the TAIL of a long payload rather than a
#   half-finished area. Closure is scored over the whole set, not per area.
#
#   Intended landing: baseline unchanged at or near 4/12 = 0.33, ours from 9/12 to 11-12/12,
#   delta +0.58 to +0.67. The arithmetic of a partial fix is stated too, because it is what
#   makes this a small correction and not a gamble: recovering ONE of the three dropped rows
#   gives 10/12 and lands the delta on +0.5000 exactly; TWO gives +0.5833; three gives
#   +0.6667. Every partial outcome except zero clears the bar.
#
# WHICH ROWS THE BASELINE HAS MISSED CONSISTENTLY, AND WHICH IT WAS GIFTED
#   Two independent rankings, both quoted, both scoped to the headline model.
#
#   (a) The cycle-4/validation gold, thirteen runs (baseline x1, sense x12):
#
#     python3 bench/lib/inverse_frequency.py discourse \
#       verticals/ruby-rails/results/claude-opus-5/validation
#
#     row                              group        overall  baseline   sense
#     d:search-rake                    dependents     6/13       0/1     6/12
#     d:templates-rake                 dependents     6/13       0/1     6/12
#     d:bulk-import-merger             dependents     8/13       0/1     8/12
#     d:import-scripts-base            dependents     8/13       0/1     8/12
#     d:migrations-importer-categories dependents     9/13       0/1     9/12
#     d:migrations-optimizer           dependents     9/13       0/1     9/12
#     d:slack-migration                dependents     9/13       1/1     8/12
#     ... every other row              -             10/13       1/1     9/12
#     never cited by any arm : 0      cited by every run : 0
#
#   (b) THIS gold set, as measured by cycle 7 (baseline x1, sense x1):
#
#     python3 bench/lib/inverse_frequency.py discourse "$RDIR"      # sha f4283b9e2d348040
#
#     d:migrations-optimizer           dependents     0/2        0/1     0/1
#     d:slack-migration                dependents     0/2        0/1     0/1
#     d:templates-rake                 dependents     0/2        0/1     0/1
#     d:bulk-import-merger             dependents     1/2        0/1     1/1
#     d:import-scripts-base            dependents     1/2        0/1     1/1
#     d:migrations-importer-categories dependents     1/2        0/1     1/1
#     d:search-rake                    dependents     1/2        0/1     1/1
#     d:templates-topic-query          dependents     1/2        0/1     1/1
#     d:data-explorer-parameter        dependents     2/2        1/1     1/1
#     d:narrative-bot                  dependents     2/2        1/1     1/1
#     d:reindex-search-job             dependents     2/2        1/1     1/1
#     d:semantic-categorizer           dependents     2/2        1/1     1/1
#
#   Read the two together, which is the point of quoting both:
#   - Eight rows have never been cited by any baseline run on either gold set. They are the
#     discriminator and they are all kept.
#   - The three rows sitting at sense 0/1 in (b) are NOT unreachable. Ranking (a) puts them
#     at sense 6/12, 8/12 and 9/12 on twelve runs of the seven-step form, so they are
#     material the arm reaches routinely and dropped once here. That is the tail-truncation
#     this draft's step 2 attacks, and it is why no row is cut for being unreached.
#   - `d:reindex-search-job` is the one row a baseline has taken on BOTH gold sets (1/1 and
#     1/1). It is the closest thing here to a free row and it is the first candidate for a
#     cut - but the plan floors `dependents` at twelve, the shown blast payload holds no
#     unused file in the trees no baseline route searches (see below), and cutting it would
#     leave eleven. It stays, and it is named here so the next cycle does not re-derive it.
#
#   The n is small and it is stated: one baseline run per gold set, two gold sets, and the
#   standing law says do not re-gold below ~5 runs per arm. That is exactly why this draft
#   re-golds NOTHING. Every row is carried on the structural argument written into its
#   relation, and the tallies above are reported beside them, not used to admit or cut.
#
# WHY NO ROW WAS ADDED, WHICH IS A RUN AND NOT AN ASSUMPTION
#   The shown blast payload (quoted below) carries 60 direct callers over 54 files. Of those,
#   the files in trees no measured baseline route on this repo has ever searched -
#   `migrations/`, `script/`, `lib/tasks/*.rake`, plugin rake and plugin onceoff - number
#   exactly six, and all six are already gold. The payload's remaining out-of-tree files are
#   eleven JavaScript ones (`frontend/discourse/**`, plugin `assets/javascripts/**`); those
#   are the Ember-side `Category` model, a different symbol the index links by name, so
#   golding them would gold a false caller edge. Noted, not acted on - not this phase.
#
# WHAT THE ANSWER IS, THAT IS NOT A LIST OF THE PLACES A NAME APPEARS
#   Honestly: the SET is an occurrence list, and this header says so rather than dressing it
#   up. ring_sweep.py --top 12 on this clone returns `Category  class  0 rows  0 files
#   0 vias  under bar` and 0 candidates above the bar across all twelve anchors, so the
#   holder kind is not available in this stack, and cycles 5 and 6 are what trying it anyway
#   looks like. What is NOT an occurrence list is what the ask demands PER element: the
#   routine that owns the reach, named, and one phrase on what that routine's own job would
#   start getting wrong. `grep -rn` prints path:line; it does not print the enclosing `def`
#   and it does not print the consequence. That is the citation cost this cell charges.
#   This is the banked-mastodon sort of occurrence list and not the five-failure sort for
#   two measured reasons: on the cycle-4 wording the plain arm scored 0.4286 over 39 tool
#   calls and two hand-written repo scanners, and on cycle 7's it scored 0.3333 over 24 calls
#   and 18 distinct searches - not 0.81 and not 1.00, on either run.
#   Cycle 8 adds one more thing the answer is that a name list is not: it is CLOSED. The set
#   the arm assembled has to come back whole, with the last element pinned as hard as the
#   first, and every candidate it discarded named and located. A search prints occurrences;
#   it does not account for the ones the writer chose to leave out.
#
# THE AXIS, IN ONE SENTENCE
#   Every scored dependent is a SINGLE touch of the contract from inside a routine named
#   after some other job entirely - optimising uploads mid-migration, appending imported
#   records in sort order, deciding whether two merged records are the same one, re-feeding
#   a search index, casting a query parameter, staging a bot tutorial - and they sit as much
#   in the migration tooling, the import scripts, the maintenance tasks and the bundled
#   plugins as in the application tree that serves web requests.
#
# SEAM PROFILE (bench/lib/seam_hunt.py, quoted)
#   python3 bench/lib/seam_hunt.py $CLONE Category --propose --file app/models/category.rb
#     app caller files : 89   (total incl test/non-app: 89)
#     SCATTER (dirs)   : 47
#     GREP-NOISE       : 'Category' in 109 app files   PRECISION=0.82  (lower=grep-hostile)
#     VERDICT          : SCATTERED + grep-clean
#   Re-run in this session against the current clone; the figures are unchanged from cycle 7.
#   PRECISION 0.82 is high and it ranks this anchor poorly - nearer the 0.78 of a deliberate
#   control tie than the 0.078 that preceded a +1.00 cell. It is recorded, it does not kill,
#   and the re-question law keeps the anchor: cycle 4 measured base 0.4286 on the probe at

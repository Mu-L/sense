# ============================================================================
# SEVEN-STEP SESSION SCENARIO (plans/03-expand.md), CYCLE 8 on discourse,
# ATTEMPT 2: THE SAME SESSION SHORTENED TO FIT THE WALL.
# Expanded from the cycle-8 two-step probe, which is kept byte-for-byte at
# scenarios/discourse.yaml.probe-2step-cycle8.bak (rubric alongside it).
# Attempt 1 of this session - identical except for the six non-discriminator step
# prompts and their richness floors - is kept at
# scenarios/discourse.yaml.longsession-cycle8.bak (rubric alongside it).
#
# WHY THIS ATTEMPT EXISTS: CANNOT-FINISH-AT-BUDGET, AND WHERE THE WALL WENT
#   The brief on disk (results/loop/discourse/expand.brief.md) is an instruction and it
#   is quoted:
#     "CANNOT FINISH AT BUDGET - the sense arm ran out of clock on every attempt, the
#      retry included. The watchdog is NOT raised: the scenario is shortened and re-run
#      instead. The anchor, the question and the gold all stay; expand rewrites the seven
#      steps to ask for less work each. ... fewer places to visit per step, not fewer
#      steps - seven is a contract this phase is checked against."
#
#   Both sense runs of attempt 1, from their run_meta.json:
#     run-1  wall_time_seconds 481 of 480  claude_exit_code 124  watchdog hard_cap_timeout
#     run-2  wall_time_seconds 481 of 480  claude_exit_code 124  watchdog hard_cap_timeout
#
#   The arm did NOT run out of clock exploring. It ran out writing. From the transcripts
#   (results/.../validation/077b1225bb1b78e0/sense/discourse/run-*/transcript.json):
#     run-1  first entry 21:00:05  LAST tool_use 21:03:35  killed 21:08:00
#            -> 211s of the 480s wall on tools, 269s (56%) writing one final message
#     run-2  first entry 21:08:06  LAST tool_use 21:11:03  killed 21:16:01
#            -> 177s on tools, 303s (63%) writing
#   Both answers are a single final message and both were cut mid-sentence inside step 6.
#   Neither reached step 7 at all. Section sizes of run-1's 59,819-character answer,
#   measured by splitting it on its own step headings:
#     step 1  2,041     step 2  7,887     step 3  7,027     step 4  33,750
#     step 5  6,019     step 6  3,063 (CUT MID-LINE)        step 7  never written
#
#   So the budget is an OUTPUT budget, and step 4 - which may not be touched - is 56% of
#   it on its own. Every character of relief has to come from the other six steps. The
#   arithmetic this attempt is built on: run-1 wrote 59,819 characters in 269 seconds,
#   about 222 characters per second. Steps 2, 3 and 5 together cost 20,933 characters
#   (~94s); this rewrite aims them at roughly 7,000 (~32s), freeing about 62 seconds, and
#   steps 6 and 7 are now forbidden from re-listing the audit, which is what made step 6
#   expensive and step 7 unreachable. Step 4's 33,750 characters are left exactly where
#   they are.
#
# WHAT WAS CHANGED TO GET THERE, AND WHAT WAS NOT TOUCHED
#   NOT touched: the anchor (`Category`), step 4's name, prompt and checks, and the whole
#   `dependents` gold group - all still byte-identical to the probe, so the mini-bench
#   figure below still describes this scenario. No gold row was added, removed or
#   re-pointed in any group.
#   Changed, and only this: the prompts of steps 1, 2, 3, 5, 6 and 7, each capped at how
#   many places it may visit, plus their `response_richness` floors lowered to stay
#   satisfiable under the caps (step 2 8->4, step 3 4->4 unchanged, step 6 6->4,
#   step 7 6->4). One sentence was added to `description` making "answer once, refer back,
#   never re-list" a session-wide rule; it runs FORWARD only, and step 4 is the first step
#   that enumerates dependents, so nothing above it can be referred back to in its place.
#   The rubric's map_quality and specificity questions on the six changed steps were
#   rewritten to stop rewarding the exhaustiveness their prompts now forbid; step 4's four
#   criteria and the audience paragraph are untouched.
#
#   THE RISK THIS SHORTENING CARRIES, NAMED IN ADVANCE. Steps 1, 2, 3 and 5 are what
#   spends context and wall BEFORE the discriminator, and the standing budget-pressure
#   hypothesis is that the arriving-tired condition is part of why step 4 discriminates.
#   Cutting them cuts that pressure, so a baseline that arrives at step 4 fresher may
#   assemble more of the set than the 1/12 the mini-bench measured. That is not settled
#   here and it is the first thing to read in the next validation's baseline transcript.
#   Cutting them was still the only move available: the alternative is a session that
#   never reaches step 7, and cannot-finish-at-budget is a result, not a wall to raise.
#
#   THE SECOND RISK: "DO NOT RE-LIST" READ BACKWARDS. Steps 6 and 7 now forbid repeating
#   the audit, and an arm that plans the whole answer before writing it could in principle
#   trim step 4 itself on the grounds that it will not get to reuse the list. Step 4 pushes
#   the other way and it pushes harder - it demands a closed set, forbids "and a few
#   similar cases", and charges MORE words for a candidate ruled out than for one kept -
#   so the expected effect is nil. It is written down because it is the one way this
#   rewrite could move the discriminator without touching its wording, and the check is
#   mechanical: step 4's cited count in the next run's sense transcripts against the 12 of
#   12 the mini-bench measured.
#
# THE INVENTORY READ-BACK ON THE SHORTENED PROMPT (done by hand, as the law requires)
#   Read back step by step, no phrase identifies a single gold row's file. The nearest
#   thing to a leak is step 7's "the areas the dependents fall into", which tells the arm
#   the answer HAS areas - but that clause is inherited from cycle 4 and attempt 1 word for
#   word, it names no area, and step 7 runs AFTER the discriminator, so nothing it says can
#   reach step 4. Steps 2, 3 and 5 describe jobs and kinds ("where the hierarchy is walked
#   to disambiguate one level from another", "a reference stored earlier re-checked against
#   what is actually there"), which is mechanism, and all three feed NON-SCORING groups.
#   The rendered prompt was also grepped for paths, extensions, class names, tool names and
#   counts: the only hits are the scenario title and two step names, all of which carry the
#   word "category" and nothing else.
#
# THE MINI-BENCH THAT AUTHORISED THIS EXPANSION
#   results/loop/discourse/minibench.md, verdict PROCEED, quoted:
#     baseline `dependents` 1/12 = 0.083   sense 12/12 = 1.000   delta +0.917
#     baseline wall 317 of 531, exit 0, valid True, watchdog None - it stopped because it
#     was done searching, not because it ran out of clock, so 0.083 is a real floor.
#     baseline route: 24 tool calls, 17 of them searches; the last third spent in

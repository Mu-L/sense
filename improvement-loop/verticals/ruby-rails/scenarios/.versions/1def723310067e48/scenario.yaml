#   files. Ten of the twelve scored rows below are outside the app tree entirely
#   (migrations/, script/, lib/tasks/*.rake and plugin rake/onceoff trees), so the 0.82 is
#   measured over a tree this gold set mostly does not live in.
#
# EVERY SCORED ROW IS IN THE SHOWN BLAST PAYLOAD (RUN, NOT ASSUMED)
#   python3 bench/lib/mcp_probe.py $CLONE \
#     '[{"name":"sense_blast","arguments":{"symbol":"Category","file":"app/models/category.rb"}}]'
#   Bare `symbol: Category` comes back `"ambiguous": true` over 5 matches, so the file is
#   passed. Re-run in this session: the shown payload carries 60 direct_callers over 54
#   files, `truncated: true`, and all twelve dependent rows and all four anchors below
#   appear in it by file and by symbol. No min_confidence was passed.
#
# MEMORIZATION (bench/lib/memorization_probe.py, quoted, re-run this session)
#   {"ok": true, "ran": true, "recall": 0.2,
#    "reason": "closed-book recall 0.2 < 0.3 - not recited", "truth_n": 230, "said_n": 157}
#   What it did recite is contract-centre method names (`find_by_slug_path`, `ensure_slug`,
#   `SLUG_REF_SEPARATOR`) - all of them anchors here, none of them scored. No dependent
#   row's file or line is in the recited set.
#
# THE RISK THIS DRAFT CARRIES, NAMED IN ADVANCE
#   The whole move is one paragraph of step 2, so if closure discipline is not what the arm
#   was missing, this cycle buys nothing and lands at +0.42 again. Two ways that happens.
#   First, the arm may comply by padding: reconciling a long candidate list costs output
#   budget, and an arm that spends it accounting for near-misses may pin fewer real rows than
#   cycle 7's did. Second, the reconciliation clause is new wording in a prompt whose earlier
#   paragraphs are measured, so it could shift how the plain arm answers too and lift the
#   0.3333 floor. Both are visible in the next run's transcripts; neither is settled here.
#
# WHAT THE EXPANSION ADDED, AND WHAT IT WAS FORBIDDEN TO TOUCH
#   Step 4 is the probe's step 2 byte-identical, and the `dependents` group is unchanged -
#   twelve rows, same ids, same lines. Nothing was added to it: gold added here has never
#   faced a baseline, and putting it in the scored group would dilute a measured number with
#   untested rows.
#   Steps 1, 3, 5, 6 and 7 are cycle 4's seven-step session wording verbatim
#   (discourse.yaml.session-7step-cycle4.bak), and step 2 is the probe's step 1 verbatim, so
#   the only new prose in this file is this header. That matters for the measurement: by the
#   time step 4 runs, both arms have spent three steps of wall and context, which is the
#   session pressure the banked mastodon cell's step-4 ask sits under.
#   New gold, both groups NON-SCORING and both carried from the cycle-4 session:
#     `write-path` (4 rows) - step 3's answer.
#     `guards`     (3 rows) - step 5's answer.
#   Every one of those seven lines was re-opened against this clone in this session and is
#   quoted in its relation. Cycle 4's fourth guard row was on
#   plugins/discourse-data-explorer/lib/discourse_data_explorer/parameter.rb, which is
#   already the file behind the scoring row `d:data-explorer-parameter`; two gold rows on
#   one file breaks the one-item-per-FILE rail and would let a step-5 citation feed a scored
#   group, so it was dropped rather than re-pointed.
#   No `specs` group was added. The standing law measured spec rows on the banked Status
#   control at "mentioned 2/2 in 8 of 10 runs, cited 0/2 in 10 of 10": step 7 asks for specs
#   that must be updated OR ADDED, and an added file has no line to cite, so such a row can
#   never score at path:line. Step 7 still asks for them; gold does not pretend to grade it.
# ============================================================================

name: Discourse work session - audit the category contract before a rework
repo: discourse
contract_symbol: Category
contract_file: app/models/category.rb

description: |
  You are a maintainer about to rework the class that represents one of this forum's
  top-level containers - the thing topics are filed under, that carries its own
  permissions, settings and hierarchy, and that half the product reaches for whenever it
  needs to know where something belongs or who is allowed to see it. The rework will change
  what that class hands back to the code that asks it questions, and it will change the
  shape of what it stores. Work the ticket end to end in one session: orient, map the
  contract and the path every incoming request leans on, trace how one of these records is
  built up and taken apart, audit everywhere else in the codebase that would have to be
  reviewed or changed with it, trace the guards that confirm a real and current record,
  rank the blast radius, and finish with the map a teammate could land the change from.
  Throughout, an answer that points at a place must give an exact file:line a teammate
  could jump straight to, plus one phrase on why it matters. A bare filename does not
  count, a set of names offered together with one shared reason and no location on any of
  them does not count, and a missed dependent is a regression shipped. Answer each step
  once and move on: a later step refers back to a place an earlier one already located,
  by name, and never re-lists it. You are being read by a teammate who has your whole
  answer in front of them, so restating a list you have already written is wasted budget
  that a later step needs.

steps:
  - name: Orient in the codebase
    prompt: >
      Task: orient yourself, briefly. In a short paragraph plus a handful of file:line
      references, what is this project, how is the code organized, and where does the
      class that stands for the container topics are filed under sit - the one the rest of
      the system keeps having to ask about - along with the shared pieces its behaviour is
      assembled from? Name only the places the later steps will actually need: this is a
      map, not a survey, and a tour of the tree costs budget the ticket needs. Hand the
      next agent a map so they can act with small, targeted lookups, not a fresh
      exploration of the codebase. No Explore agents.
    checks:
      - type: response_richness
        value: "3"
        required: true
        description: Project shape and the contract's home located at file:line
      - type: mcp_tool_used
        value: sense_search
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_conventions
        required: false
        layer: adoption

  - name: Map the category contract
    prompt: >
      Task: map the shape of the contract, tightly. Start with the one part of this
      class's job that every incoming request leans on: getting hold of one of these
      records when all the system has is the human-readable path the visitor typed, which
      may name a parent and a child, may be an old path that has since been retired, and
      may not name one of these at all. Trace that one path end to end, and give the single
      clearest place that does each job along it: where such a path is turned into one of
      these records, where the hierarchy is walked to disambiguate one level from another,
      where the stored path is kept in step when the record is renamed, and where a path
      that turns out to point somewhere else is redirected or refused. One place per job,
      one line each: the file:line, the name of the routine it lives in, and one phrase on
      what it contributes to that path. Do not enumerate every caller of any of them - the
      ticket's enumeration comes later, and this step is only the map it starts from. A
      place named without the routine it lives in does not count, and neither does a
      routine named without the file:line where it is defined.
    checks:
      - type: response_richness
        value: "4"
        required: true
        description: Resolution path traced through the routines that make it up, each located
      - type: mcp_tool_used
        value: sense_graph
        required: false
        layer: adoption

  - name: Trace how one of these records is built up and taken apart
    prompt: >
      Task: trace the lifecycle, briefly. Follow one of these records from being brought
      into existence to being taken apart again, and say what runs around those two
      moments. Give the places one of these is created, the place one is destroyed, and
      the work that runs around them - a few representative places, correctly marked, is
      the whole answer here, not a catalogue. One line each: the file:line, the name of the
      routine it lives in, and whether it runs inline, in the request or task that
      triggered it, or is handed off to run once that call has finished. Where something is
      handed off, say what it is handed - the record itself, or something it can be looked
      up from again - because that is what a rework of the contract has to keep working.
      Do not recite the declarations that register this work; show the code that picks it
      up.
    checks:
      - type: response_richness
        value: "4"
        required: true
        description: Creation and teardown layers located, each marked inline or handed off
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_graph
        required: false
        layer: adoption

  - name: Audit every dependent of the category contract
    prompt: >
      Task: this is the core of the ticket, and you are working it with the budget the
      first part already cost you. Widen back out from that one path to the class as a
      whole, as a single subject, and find EVERY place in the codebase that would have to
      be reviewed or changed with it, so the rework cannot silently break one. Most of what
      you are looking for is not doing this class's job at all: it is in the middle of some
      other job entirely, it reaches for this class exactly once to settle a question that
      other job needs answered, and the routine it does that from is named after the other
      job and never after this one. So the answer you owe is not where the dependency sits
      but WHOSE behaviour changes: for every dependent, name the routine the dependency is
      inside, give its file:line, and say in one phrase what that routine would start
      getting wrong if the class stopped handing back what it hands back today. Work it as
      a closed set, and that is the part being marked. Assemble your candidates first, all
      of them, before you write any of them up; then go through that list in the order you
      assembled it and finish each one - routine, file:line, consequence - before you look
      at the next. The candidate you turned up last is worth exactly what the first one was
      worth, so do not order the write-up by how interesting or how certain a place is, and
      do not let the end of the list turn into prose: "and a few similar cases", "other
      places follow the same pattern", or a closing paragraph that gestures at a remainder
      is the same as leaving those places out. If you examine a candidate and decide it is
      not really a dependent, it still gets its file:line and one clause saying why you
      ruled it out - discarding a place costs you more words than keeping it, on purpose.
      Finish by reconciling: say how many candidates you assembled and how many you wrote up
      individually above, and if those two numbers are not the same, list every candidate
      that is missing, each at its file:line. A file:line with no routine named around it
      does not count, a routine you cannot state the consequence for does not count, and a
      missed dependent is a regression shipped.
    checks:
      - type: response_richness
        value: "6"
        required: true
        description: Every dependent located at file:line with its own consequence named
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption

  - name: Trace the guards that confirm a real, current record
    prompt: >
      Task: work runs against one of these records all over the codebase, and some of what
      that work is handed is not one at all, or names one that is no longer there. Show how
      the code satisfies itself, before it acts, that what it holds really is one of these
      and that it really still exists. There are three kinds of guard to cover and ONE
      example of each is enough - a second example of a kind you have already shown is
      worth nothing here: an incoming thing checked for being the right kind of thing at
      all; a name or an identifier that resolves to nothing turned into a refusal at the
      boundary rather than an error further down; and a reference that was stored earlier
      re-checked against what is actually there before it is trusted. One line each: the
      file:line, the enclosing routine, and one phrase on what it protects the caller from.
    checks:
      - type: response_richness
        value: "3"
        required: true
        description: Each guard located at file:line with the routine and what it protects
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_graph
        required: false
        layer: adoption

  - name: Assess the blast radius of the contract change
    prompt: >
      Task: you are about to change what this class hands back. Rank the risk. Do NOT
      re-list what you have already located above - a ranking that repeats the audit back
      is not a ranking and it costs budget the last step needs. Name only the places most
      likely to break, in risk order, one line each, and say what puts each where it is:
      separate the ones that would fail loudly and immediately from the ones that would
      keep running and quietly return something different, which are the expensive ones.
      Use file:line and name the routine that carries each risk, not just the file it is
      in. Then say in a sentence or two what must be re-verified afterwards. A missed
      high-risk dependent is the one that pages someone.
    checks:
      - type: response_richness
        value: "4"
        required: true
        description: Dependents ranked by risk, each located at file:line with its routine
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption

  - name: Produce the change + verification map
    prompt: >
      Task: finish with the map for landing this safely, and again do not repeat the audit
      back. Three things only: the pieces of the contract itself you will edit, each at its
      file:line and the routine it lives in; then the areas the dependents fall into, and
      for each area how many you found there and the one in it you would review first, at
      its file:line - the area line stands in for the rest, which you have already written
      out; then the tests that would have to be updated or added to cover the behaviour
      that moves. A teammate reading this map together with what you have already written
      should be able to land the change without re-exploring the codebase.
    checks:
      - type: response_richness
        value: "4"
        required: true
        description: Edit list, dependents by area and the tests that move, all located
      - type: no_grep
        value: no_grep
        required: false
        layer: adoption
      - type: mcp_tool_used
        value: sense_blast
        required: false
        layer: adoption

scoring:
  weights:
    correctness: 0.7
    efficiency: 0.3

gold:
  # ---- ANCHORS: the contract centre and its obvious write path. Both arms reach these and
  # ---- they do not decide anything. Carried from cycle 4, every line re-opened and
  # ---- re-read against the clone before this draft was written.
  - id: contract-model
    group: contract
    match: [app/models/category.rb]
    relation: "app/models/category.rb:1083 `def self.find_by_slug_path(slug_path)` - the contract under rework and the class-level entry point every slug-path lookup bottoms out in; :1103 `def self.find_by_slug_path_with_id` is the trailing-id variant that falls back to it at :1110, :985 `def self.query_category(slug_or_id, parent_category_id)` is the one-level lookup the hierarchy walk is built from, :627 `def ensure_slug` keeps the stored slug in step across a rename, and :16 `SLUG_REF_SEPARATOR = \":\"` is the separator the ref form is built from"
  - id: c:categories-controller
    group: contract
    match: [app/controllers/categories_controller.rb]
    relation: "app/controllers/categories_controller.rb:394 `category = Category.find_by_slug_path(params[:slug_path].split(\"/\"))` inside `CategoriesController#find` (def at :387) - the HTTP front door onto the slug-path lookup, raising `Discourse::NotFound` at :395 when it comes back blank"
  - id: c:hierarchical-search
    group: contract
    match: [app/services/category/query/hierarchical_search.rb]
    relation: "app/services/category/query/hierarchical_search.rb:53 `scope = Category.from(\"allowed_categories\").select(:id)` inside `Category::Query::HierarchicalSearch#matched_scope` (def at :52) - walks the parent/child hierarchy to disambiguate one level from another"
  - id: c:permalink
    group: contract
    match: [app/models/permalink.rb]
    relation: "app/models/permalink.rb:82 `return category.relative_url if category` inside `Permalink#target_url` (def at :78) - the retired-path case: an old URL that no longer resolves is redirected through the permalink record's category association declared at :6"

  # ---- WRITE PATH / TEARDOWN: NON-SCORING. Step 3's answer. Four rows, one per file, each
  # ---- re-opened and re-read at the line below against this clone in this session. These
  # ---- never faced a baseline, so they decide nothing; they exist so the judge can see
  # ---- whether step 3 was worked at all.
  - id: w:seed-categories
    group: write-path
    match: [seed_data/categories.rb]
    relation: "lib/seed_data/categories.rb:135 `Category.new(` inside `SeedData::Categories#create_category` (def at :116), saved inline at :148 `category.save!` - the creation end of the lifecycle on a brand-new site: the record is built, permissions are set on it at :147 `category.set_permissions(permissions)` before the save, and everything the after_create callbacks hang off that save (the definition topic at app/models/category.rb:126 `after_create :create_category_definition`, the permalink cleanup at :127 `after_create :delete_category_permalink`) runs in the same call"
  - id: w:import-export-importer
    group: write-path
    match: [import_export/importer.rb]
    relation: "lib/import_export/importer.rb:110 `category = Category.new(cat_attrs)` inside `ImportExport::Importer#import_categories` (def at :80), saved inline at :119 `category.save!` - the other creation path; :123 `post = category.topic.ordered_posts.first` then reads back the definition topic that the after_create callback must already have built, so this caller depends on that part of the write path running inline and not later"
  - id: w:destroy-task
    group: write-path
    match: [services/destroy_task.rb]
    relation: "app/services/destroy_task.rb:178 `category.destroy` inside `DestroyTask#category_topic_destroyer` (def at :175) - the teardown end: the topics inside are destroyed first at :176 `destroy_topics_in_category(category.id, destroy_system_topics)` and only then the container itself, which fires the after_destroy chain declared at app/models/category.rb:132-138 (`trash_category_definition`, `clear_related_site_settings`, `reset_topic_ids_cache`, `clear_subcategory_ids`, `publish_category_deletion`, `remove_site_settings`). A rework that changes what destroy leaves behind is felt here first"
  - id: w:automation-event
    group: write-path
    match: [automation/plugin.rb]
    relation: "plugins/automation/plugin.rb:180 `on(:category_created) do |category|` (and `on(:category_edited)` at :184) - the handed-off half: app/models/category.rb:158-160 fires these from `after_commit ... on: :create/:update/:destroy`, so they run only once the transaction has landed, and the handler at plugins/automation/lib/discourse_automation/event_handlers.rb:210 `def self.handle_category_created_edited(category, action)` passes the RECORD itself into `automation.trigger!` at :221, which forks inline or into the background at plugins/automation/app/models/discourse_automation/automation.rb:156-157 depending on whether the script is a background one"

  # ---- GUARDS: NON-SCORING. Step 5's answer. Three rows, one per file, each re-opened and
  # ---- re-read at the line below against this clone in this session. All three sit AFTER
  # ---- the discriminator in step order, so nothing here can hand step 4 a dependent.
  # ---- Cycle 4's fourth guard row lived on the data-explorer parameter file, which already

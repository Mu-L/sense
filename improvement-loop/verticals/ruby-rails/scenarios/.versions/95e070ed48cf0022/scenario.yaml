name: Chatwoot work session - audit the conversation-record contract before a rework
repo: chatwoot
contract_symbol: Conversation
contract_file: app/models/conversation.rb
# TWO-STEP PROBE SCENARIO (plans/01-author.md), CYCLE 4 on this repo - a RE-QUESTION routed
# back from a measured mini-bench. The anchor is UNCHANGED (`Conversation`, per ITERATE ON
# THE QUESTION, KEEP THE ANCHOR); step 1 is unchanged from cycles 2 and 3 on purpose, so
# that one variable is held fixed. THIS CYCLE CHANGES EXACTLY ONE THING: step 2's wording.
# Every gold row is byte-identical to cycle 3, because cycle 3's diagnosis measured the
# gold and the payload SOUND and named the prompt as the only defect (minibench.md:
# "The blast payload is sound and the anchor is sound ... The rewrite is a prompt rewrite").
# Nothing here is a verdict: the next phase runs both arms at the real wall and decides.
#
# Single-prompt session bench (bench/drivers/bench-sense-local.sh): every step is presented
# in ONE prompt and worked in order. Rendered to the agent: the description + each step's
# name and prompt ONLY (checks and gold are NEVER shown). Everything rendered is kept
# NEUTRAL - it states the task, never the answer's shape, file paths, class or method
# names, counts, or which tool to reach for.
#
# ------------------------------------------------------------------------------------
# TRAJECTORY - every cycle on this repo, and which side of the window each fell on
# ------------------------------------------------------------------------------------
# The window is BOTH conditions at once: plain arm <= 0.50 AND ours >= plain + 0.50.
#
#   cycle 1  "enclosing-routine audit", gold = 18 token-carrying files
#            results/loop/chatwoot/cycles.jsonl:
#              {"cycle": 1, "attempt": 1, "phase": "minibench", "verdict": "REQUESTION",
#               "baseline_dependents": 1.0, "sense_dependents": 0.0, ...}
#            (`sense_dependents: 0.0` is run-1, `valid: false / harness_crash`, 0 sense
#             calls - void. The VALID sense run-2 scored 1.00, quoted in minibench.1.md:
#               "dependents": {"total": 18, ..., "cited_recall": 1.0}   <- baseline run-1
#               "dependents": {"total": 18, ..., "cited_recall": 1.0}   <- sense run-2)
#            SIDE OF THE WINDOW: **baseline far too HIGH** (1.00, i.e. 0.50 above the
#            ceiling the bar allows). Delta 0.00 followed by arithmetic.
#            KILLED BY: one boundary-matched `rg` for the class name (112 hits) plus a
#            twenty-line Ruby script that walked upward from each hit to its enclosing
#            `def`/`class`. 12 tool calls, 190 s of a 225 s wall.
#
#   cycle 2  "never names it", gold = 16 files where the capital token does not occur
#            results/loop/chatwoot/cycles.jsonl:
#              {"cycle": 2, "attempt": 2, "phase": "minibench", "verdict": "REQUESTION",
#               "baseline_dependents": 0.75, "sense_dependents": 0.6875, ...}
#            SIDE OF THE WINDOW: **baseline still too HIGH** (0.75, i.e. 0.25 above the
#            bar), and delta NEGATIVE at -0.0625. Recall caps at 1.00, so a baseline at
#            0.75 capped the attainable delta at +0.25 before the pair ran.
#            KILLED BY: the ask listed FOUR hiding mechanisms, and minibench.md shows the
#            baseline running one grep per bullet -
#              12. grep -rn "SimpleDelegator\|method_missing\|delegate_missing_to\|def_delegators" ...
#              17. grep -rn "has_many :conversations\|has_one :conversation\|has_many :conversation" ...
#              18. grep -rn "\.conversations\b" ...
#              19. grep -rn "def initialize(conversation\|def perform(conversation\|(conversation)" ...
#            Token-darkness at the CAPITAL token was not darkness at all: 11 of the 16
#            gold files carry the lowercase word `conversation`, and the association name
#            and the parameter name are both plain greppable tokens.
#
#   cycle 3  "caller of a toucher, in a file that never names the record", gold = the 15
#            rows kept verbatim below
#            results/loop/chatwoot/cycles.jsonl:
#              {"cycle": 3, "attempt": 3, "phase": "minibench", "verdict": "REQUESTION",
#               "baseline_dependents": 0.0, "sense_dependents": 0.1333, ...}
#            SIDE OF THE WINDOW: **the OTHER side. Baseline passed cleanly at 0.000, and
#            OUR ARM did not reach** - 2 of 15, delta +0.133 against a bar of +0.50.
#            KILLED BY: one clause in the ask, not by the tool and not by the gold. Step 2
#            said the dependent's file "names the go-between while never naming the record
#            at all". The sense arm obeyed it literally and said so in its answer -
#              "Every entry below was verified two ways: the file contains ZERO
#               occurrences of `conversation` (any case), and the named go-between does
#               touch `Conversation`."
#            `grep -ic conversation` over the fifteen gold files returns 0 for exactly two
#            of them (contact_identify_action.rb, contact_merges_controller.rb) and 1..29
#            for the other thirteen. So an arm honouring the clause has a CEILING of
#            2 of 15 = 0.133, and 0.133 is precisely what it scored: it was correct against
#            the prompt and wrong against the gold. All fifteen rows were in the shown
#            blast payload; the arm had them and excluded thirteen on purpose.
#            The baseline's 0.000 is NOT evidence the set is expensive - minibench.md:
#            "The baseline scored zero dependents not because the set is expensive but
#            because the ask sent it somewhere else." It was running `grep -c "onversation"`
#            hunting for files with a ZERO count, i.e. reading the same wrong clause.
#
# TRAJECTORY IN ONE LINE: 1.00 (baseline side), 0.75 (baseline side), 0.00/0.133 (our side).
# AIM AT THE WINDOW, NOT AT THE OPPOSITE OF THE LAST FAILURE. **This draft corrects from
# the OUR-ARM-TOO-LOW side, and it moves exactly as far as the defect: it deletes every
# claim about what text a dependent's file does or does not contain, and changes nothing
# else.** That restores our arm's ceiling from 2/15 to 15/15 while keeping the structural
# demand - a hand-off, and the go-between named - that cycle 3 measured the baseline
# failing to satisfy. It does NOT swing back toward cycles 1-2 by widening the ask to "find
# everything", which is what put the baseline at 1.00 and 0.75.
#
# WHAT THIS DRAFT DOES **NOT** CLAIM: that the baseline will repeat 0.000. Its 0.000 was
# earned under the deleted clause, so it does not carry forward. The honest expectation is
# somewhere between cycle 2's 0.75 (whole-class enumeration, four grep bullets) and cycle
# 3's 0.000 (misdirected), and only the run says where. Risk (a) below is the live one.
#
# ------------------------------------------------------------------------------------
# THE SUPERSEDED QUESTION, AND THE NUMBER THAT KILLED IT
# ------------------------------------------------------------------------------------
# Cycle 3 asked: "find the caller of a toucher - the file names the go-between WHILE NEVER
# NAMING THE RECORD AT ALL". KILLED BY sense 0.133 (2 of 15) against a bar of +0.50, with
# the ceiling for a compliant arm arithmetically 2 of 15. The italicised clause is the
# whole defect and it is gone from step 2 below; the sentence that replaces it says
# outright that whether the record's name appears in a file decides nothing either way.
# The previous yaml is kept at scenarios/chatwoot.yaml.caller-of-a-toucher-cycle3.bak and
# the rubric at scenarios/chatwoot.rubric.yaml.caller-of-a-toucher-cycle3.bak.
# (Cycle 2's, superseded before it: scenarios/chatwoot.yaml.never-names-it-cycle2.bak.)
#
# ROWS THE BASELINE HAS TAKEN, MEASURED, NOT ESTIMATED - `inverse_frequency.py`, cycle 2's
# scenario version in isolation (chatwoot, 2 runs: baseline x1, sense x1):
#     never cited by any arm : 5  (c:assoc-message, d:assignment-endpoint,
#                                  d:contact-identify, d:contact-merge-api,
#                                  d:widget-last-seen)
#     cited by every run     : 18  <- free rows, they dilute the group
# Re-gold from what the baseline has missed CONSISTENTLY. Four of the five never-cited
# rows are `dependents`, and THREE OF THOSE FOUR ARE THE SAME STRUCTURE: the file makes a
# call to some other object, and it is that object - not this file - that touches the
# record. `d:contact-identify` and `d:contact-merge-api` both route through
# `ContactMergeAction`; `d:assignment-endpoint` routes through
# `Conversations::AssignmentService`. The blast payload labels exactly that structure and
# nothing else does: they are `indirect_callers` rows, carrying `via` and `hops`.
# That coincidence is what this cycle is built on.
#
# n CAVEAT, stated rather than hidden: cycle 2 is n=1 per arm, below the ~5-runs-per-arm
# floor the ranking wants, and cycle 1's ranking (3 runs) had ZERO never-cited rows. So
# "the baseline has never reached the second ring" rests on ONE baseline run. It is the
# only measurement that exists, it is quoted above, and it is the reason for this draft -
# it is not a settled fact and the next phase is what settles it.
#
# ------------------------------------------------------------------------------------
# THE AXIS
# ------------------------------------------------------------------------------------
# WHAT THE ANSWER IS, THAT IS NOT A LIST OF THE PLACES A NAME APPEARS:
#   the answer is a set of two-link CALL PATHS - for each row, a caller, the go-between it
#   routes through, and the location of the hand-off. An occurrence list has one column;
#   this has three, and the middle one is an EDGE, which a text search does not have a
#   column for. A search for the record's name returns the go-betweens, which are the
#   ANCHORS here and do not score; the scored set is the ring one step OUTSIDE that search
#   result, and no single search can print it, because getting from a go-between to its
#   callers is a reverse lookup, one per go-between, and which of the sixty-odd
#   record-touching symbols deserve that lookup is itself a judgement.
#
# THE MECHANISM SENTENCE, singular, which the next phase measures: a dependent reaches the
# record only at second hand - its own line hands the work to another object, and it is
# that object, not this code, that touches the record. Deliberately ONE mechanism and not
# an alternation: cycle 2's four-mechanism sentence was four greps in prose and the
# transcript shows the baseline running them in order.
#
# WHAT THE MECHANISM IS **NOT**, written out because cycle 3 confused the two and lost the
# cell on it: it is NOT token-darkness. Hand-off DISTANCE (is the work done here or passed
# on?) and TEXT ABSENCE (does the word appear in this file?) are different sets, and on
# this gold they overlap in two files out of fifteen. Thirteen of the fifteen scored files
# DO write the record's name somewhere, and they are gold anyway - TOKEN-DARKNESS IS NOT
# THE MECHANISM, and the banked +0.53 rails cell has 16 of 16 gold files carrying the
# anchor token. Step 2 below therefore states, in the prompt itself, that the presence or
# absence of the name in a file neither qualifies nor disqualifies it, and that the test is
# the PINNED LINE: does that line do the work on the record, or pass it to something that
# will? No sentence in this scenario asks the arm to check what a file contains.
#
# HOW THE PAYLOAD SERVES IT (quoted from the mcp_probe output under SEAM PROFILE): ONE
# `sense_blast` call returns `indirect_callers` as 20 rows carrying `via` and `hops` -
#   {"symbol":"ContactIdentifyAction#merge_contact","via":"ContactMergeAction#perform",
#    "hops":3,"ref":"app/actions/contact_identify_action.rb:118"}
# - which is the deliverable's exact shape (caller + go-between + location) handed over
# labelled. Nine of the fifteen scored rows below are in that list verbatim; the other
# six are `direct_callers` rows whose pinned line is itself a hand-off. All fifteen are in
# the shown payload, confirmed:
#   gold_confidence_check.py $YAML Conversation --file app/models/conversation.rb --group dependents
#     gold rows: 15   shown: 15   missing: 0   PASS
#
# THE HONEST RISKS, stated before the run, per QUOTE IT OR YOU HAVE NOT VERIFIED IT:
#  a. THE GO-BETWEENS ARE FEW AND THEIR NAMES ARE PLAIN. The fifteen rows route through
#     about eight distinct objects (a contact-merge action, a contact-identify action, a
#     permission filter service, an assignment service, an auto-assignment service, an
#     activity job, a push presenter, the channel message builders). A baseline that
#     identifies those eight and runs one grep per name can in principle reverse-look-up
#     the ring in eight commands. That is the single biggest threat to this draft and it
#     is not screened away here: what it must first do is decide WHICH of the 60+
#     record-touching symbols are worth a reverse lookup, and step 1 spends budget
#     elsewhere on purpose. Only the run decides.
#  b. THE ASK CANNOT BE ENFORCED BY THE SCORER. `gold.py:_cited` credits a gold path
#     followed by any line number, so an arm that dumps every dependent it can find scores
#     every row it happens to cover, restriction honoured or not. The bet is that the
#     covering search is the WRONG search here, not that the arm is forbidden others.
#  c. THE SENSE ARM PAYS AN AMBIGUITY HOP, on the record so the next phase does not read it
#     as a defect. `sense_blast` on the bare symbol returns no payload:
#       {"ambiguous": true, "matches": 4, "hint": "Multiple symbols named \"Conversation\"
#        exist - retry this tool with the `file` parameter ... e.g. file:
#        \"app/models/conversation.rb\""}
#     The hint names the retry verbatim, so the cost is one extra call, but the arm must
#     make it. `gold_confidence_check.py` needs the same `--file` disambiguator.
#  d. FIVE OF THE FIFTEEN ROWS WERE CITED BY BOTH ARMS IN CYCLE 2 (d:assignment-concern,
#     d:activity-concern, d:push-payload, d:contact-attachments, d:contact-conversations).
#     They are FREE by the measured ranking and they are kept anyway, because dropping
#     them leaves ten rows and the group floor is twelve. They put a floor of roughly
#     5/15 = 0.33 under the baseline before it does any work. That floor is inside the
#     window (<= 0.50) but it leaves the baseline only two more rows of slack, and it is
#     named here so the next cycle re-golds from the right place.
#  e. THE FLOOR AND THE BAR, arithmetically: 15 rows. The bar needs baseline <= 0.50
#     (<= 7 rows) and sense >= baseline + 0.50 (>= 8 rows clear). Sense reaching 14 of 15
#     against a baseline holding only the 5 free rows is 0.93 - 0.33 = +0.60. That is the
#     shot. A baseline that also reverse-looks-up three more go-between callers lands at
#     0.53 and the cell is dead by the bar before the sense arm helps.
#  f. OUR ARM MAY OVER-RESTRICT AGAIN - the cycle-3 failure mode, and the ONE this draft
#     exists to fix. Cycle 3 measured the sense arm holding all fifteen rows in its shown
#     payload and shipping two, because the ask gave it an exclusion test it could apply
#     mechanically. Step 2 still carries an exclusion ("if the line does the work itself it
#     is out of scope") and an arm could over-apply it to a hand-off it judges too direct.
#     The mitigation is in the wording, not in a screen: the exclusion is now stated as a
#     property of the LINE and is immediately followed by the sentence that a file's text
#     rules nothing in or out. FIRST THING FOR THE NEXT PHASE TO READ if sense lands low:
#     count how many of the fifteen the arm names in its answer versus excludes on purpose,
#     the way minibench.md did. A low score with the rows named and rejected is a prompt
#     defect again; a low score with the rows never named is the tool not reaching.
#
# ------------------------------------------------------------------------------------
# SEAM PROFILE - recorded, never adjudicated (NO GREP SCREEN IS A GATE, IN ANY FORM)
# ------------------------------------------------------------------------------------
#   python3 bench/lib/seam_hunt.py $CLONE Conversation --propose --file app/models/conversation.rb
#     app caller files : 59   (total incl test/non-app: 61)
#     SCATTER (dirs)   : 40
#     GREP-NOISE       : 'Conversation' in 61 app files   PRECISION=0.97  (lower=grep-hostile)
#     VERDICT          : SCATTERED + grep-clean
#   plan step 2 wants three candidates profiled. Every class anchor in this repo profiles
#   near or above 1.00 - near-transcription by the calibration on the record (0.078
#   preceded a +1.00 cell; 0.78 was a deliberate control tie; ~0.94 handed a baseline
#   17 of 18 in one grep):
#     Message  --file app/models/message.rb : 35 caller files, SCATTER 27, PRECISION=0.97
#     Contact  --file app/models/contact.rb : 31 caller files, SCATTER 23, PRECISION=1.11
#     Account  --file app/models/account.rb : 57 caller files, SCATTER 38, PRECISION=0.93
#   Narrower contracts INSIDE the same type were profiled too, looking for a grep-hostile
#   one, and none has a pool:
#     display_id               : 32 caller files, SCATTER 25, PRECISION=0.91
#     last_activity_at         : 11 caller files, SCATTER  9, PRECISION=0.58
#     unread_incoming_messages :  1 caller file,  SCATTER  1, PRECISION=0.33
#     toggle_status / push_event_data / can_reply? : 0 resolved callers
#     sense_blast Conversation#toggle_status -> 0 direct, 0 indirect, 0 files
#     sense_blast AssignmentHandler          -> 0 direct, 20 indirect, 2 files
#   PRECISION RANKS, IT NEVER KILLS: it ranks `Conversation` no worse than any alternative
#   and it is the only symbol here with a pool (75 distinct files across 40 areas in the
#   shown payload). The response to 0.97 is not a different anchor - it is a question whose
#   answer sits outside what that 0.97 grep returns.
#
#   grep counts recorded for the header, decided nothing:
#     rg -l --pcre2 '(?<![:\w])(::)?Conversation(?![a-zA-Z_])' app enterprise lib -g '*.rb' -> 77 files / 112 hits
#     rg -li 'conversation' app enterprise lib -g '*.rb'                                     -> 391 files / 3154 hits
#     rg -n 'has_many :conversations|belongs_to :conversation\b|has_one :conversation\b' app enterprise -> 15 lines
#   Of the 15 scored rows, two files contain the word `conversation` ZERO times in any case
#   (`app/actions/contact_identify_action.rb`,
#    `app/controllers/api/v1/accounts/actions/contact_merges_controller.rb`) and both are
#   rows no arm has ever cited. The rest do contain it; darkness is NOT the axis this time
#   and cycle 2 is the measurement that says so.
#
# ------------------------------------------------------------------------------------
# THE RANKING (plan step 0c)
# ------------------------------------------------------------------------------------
#   python3 bench/lib/inverse_frequency.py chatwoot <headline-model results roots>
#     .../claude-opus-5/validation                  -> no scored runs for chatwoot
#     .../claude-opus-5/minibench (cycle-1 version) -> 3 runs; 0 never-cited, 0 free
#     .../claude-opus-5/minibench (cycle-2 version) -> 2 runs; 5 never-cited, 18 free
# Quoted in full under THE SUPERSEDED QUESTION above. The three never-cited `dependents`
# rows that share the second-hand structure are carried forward as d:contact-identify,
# d:contact-merge-api and d:assignment-endpoint. The eighteen free rows from cycle 2 are
# dropped except the five named in risk (d) that the twelve-row floor forces back in.
#
# ------------------------------------------------------------------------------------
# THE RETENTION LISTING (plan step 0b) - the strongest kind is off the menu
# ------------------------------------------------------------------------------------
#   python3 bench/lib/ring_sweep.py $CLONE --top 12
#     Account / ApplicationJob / Conversation / ApplicationRecord / ApiClient / Base /
#     BaseController / User / GlobalConfigService / Inbox / InstallationConfig / Message
#       : rows 0, files 0, vias 0, under bar   (every one of the twelve)
#     0 candidate(s) above the bar.
# Re-run in this cycle, reproducing the 2026-08-03 result on the two other Ruby repos.
# "What HOLDS X" is unanswerable in this stack, so this draft does not ask it.
#
# ------------------------------------------------------------------------------------
# MEMORIZATION (plan step 5)
# ------------------------------------------------------------------------------------
#   python3 bench/lib/memorization_probe.py $CLONE Conversation --json /tmp/chatwoot.mem.json
#     "recall": 0.306, "hits_n": 11, "truth_n": 36, "samples": [0.278, 0.278, 0.306]
#     "reason": "closed-book recall 0.306 (11 members named) >= 0.3 - recited, both arms
#                already know it"
# The probe measures recall of the ANCHOR's own member names. MEMORIZATION IS A GOLD-TIME
# CONSTRAINT, NEVER AN ADMISSION VERDICT: no gold row below is a member of `Conversation`.
# Every scored row is a hand-off line in a different file, in a different tree, and no
# amount of recited knowledge about the record's columns produces the caller of a
# go-between at `path:line`.
#
# ------------------------------------------------------------------------------------
# WHAT WAS REJECTED AFTER OPENING THE FILE (plan step 4)
# ------------------------------------------------------------------------------------
# Six files the payload offered as second-ring were opened and are NOT gold, because no
# line in them depends on the record once read:
#   app/controllers/api/v1/accounts/agent_bots_controller.rb - the whole file is agent-bot
#     CRUD; the edge is via `AgentBot`'s own association and nothing on the page turns on
#     the record.
#   app/controllers/api/v1/accounts/inbox_csat_templates_controller.rb - WhatsApp template
#     CRUD via `CsatTemplateUtilityAnalysisService`; no conversation link in either file.
#   app/channels/room_channel.rb - reaches `Contact` for a presence broadcast; two hops
#     from the record and nothing in the file turns on it.
#   app/models/user_session.rb - `should_update_activity?` reads its OWN `last_activity_at`
#     column. Name collision, not a dependency.
#   enterprise/app/models/company.rb + enterprise/app/models/enterprise/concerns/contact.rb
#     - `record_activity_at!` rolls up CONTACT's `last_activity_at` into the company. Same
#     column name, different record.
#   enterprise/app/services/captain/llm/faq_generator_service.rb - prompt assembly; no link.
# DO NOT TAKE A CREDIT FROM A SCRIPT TALLY: these six are what the tally would have taken.
description: |
  You are a maintainer about to rework the record that stands for a single back-and-forth
  between a customer and the support team - the one the whole product is organised around,
  that the rest of the system keeps having to ask about. The rework will change what that
  record hands back to the code that asks it questions. Before you touch it you have to
  know two things: how the system gets hold of the right one of these when a reply arrives
  from outside and all it holds are the headers that came with it, and then which code
  would change behaviour under the rework even though nothing on its own line goes near
  the record. Throughout, an answer that points at a place must give an exact file:line a
  teammate could jump straight to, plus one phrase on why it matters. A bare filename does
  not count, and a missed dependent is a regression shipped.
steps:
- name: Map the conversation-record contract
  prompt: "Task: orient, and be thorough - the rest of the ticket is built on this. Start
    with the one part of this record's job that the whole inbound-mail side leans on:
    getting hold of the right one of these when a message arrives from outside and all the
    system holds are the headers that came with it. Trace that path end to end. Show where
    an arriving message is decided to belong to this path at all, the piece that runs the
    candidate matches in order, each separate way a match is attempted and what identifier
    it keys off, the fallback that starts a fresh record when none of them matched, and the
    point where a record that was only prepared is finally made permanent. For each one
    give the file:line, the name of the routine it lives in, and one phrase on what it
    contributes to that path. Then say, in a few sentences, what a rework would have to
    preserve for that path to keep working. A place named without the routine it lives in
    does not count, and neither does a routine named without the file:line where it is
    defined.
    "
  checks:
  - type: response_richness
    value: '8'
    required: true
    description: Inbound matching path traced through the routines that make it up, each located
  - type: mcp_tool_used
    value: sense_graph
    required: false
    layer: adoption
- name: Audit every dependent of the conversation-record contract
  prompt: "Task: this is the core of the ticket, and you are working it with the budget the
    first part already cost you. Widen back out from that one path to the record class as a
    whole - but what I need from you is one specific ring of code, so read this before you
    start. The code that does the work on this record itself is not what I am asking for. I
    already have it and so will whoever does the rework, and listing it back to me is not
    the job. What I need is the ring one step outside that: the places that would change
    behaviour under this rework even though the line that breaks does no work on the record
    at all. Such a line hands the work to some other object, and it is that object - not
    this place - that reaches the record. A caller of a toucher. Now the part people get
    wrong: whether the record's name happens to appear somewhere in a file tells you
    nothing either way, so do not use that to rule anything in or out, and do not go
    looking for files that stay quiet about it. What decides is the line you pin. If that
    line does the work on the record itself, it belongs to the inner ring and is out of
    scope however far from the record it sits. If it passes the work to something else that
    does the work, it is exactly what I want, however loudly the rest of its file talks
    about the record. Find those places, be exhaustive across every tree in this codebase,
    and group them by area. For each one give the exact file:line where the hand-off is
    made, name what it hands the work to, and give one phrase on what that place would
    start getting wrong once the record stops handing back what it hands back today. A bare
    filename does not count, a place you cannot name the go-between for does not count, and
    a missed dependent is a regression shipped.
    "
  checks:
  - type: response_richness
    value: '6'
    required: true
    description: Second-ring callers, each located at file:line with its go-between and consequence named
  - type: no_grep
    value: no_grep
    required: false
    layer: adoption
  - type: mcp_tool_used
    value: sense_blast
    required: false
    layer: adoption
scoring:
  weights:
    correctness: 0.70
    efficiency: 0.30
# Gold is the must-find audit of what depends on the conversation record. TWO groups:
#   - `contract` (18, NON-SCORING anchors): the class file; the eight files of the
#     inbound-mail matching path (step 1's targets); four of the fifteen association
#     declarations that one association grep returns in a single command; and the five
#     GO-BETWEENS themselves. The go-betweens are the obvious write path
#     by construction: they are what a name search returns, both arms reach them, and they
#     must NOT score, because scoring them would score the search.
#   - `dependents` (15, THE DISCRIMINATOR): one row per FILE, across 13 distinct
#     directories in two trees (`app`, `enterprise`). Not one is on the matching path step
#     1 traces, and not one appears in the `contract` group. Every row appears in the shown
#     `sense_blast` payload quoted in the header; every line below was opened and read by
#     hand, because the payload pins the enclosing definition and the hand-off line differs
#     on most rows.
# THE PROPERTY THAT DEFINES THIS GROUP, stated plainly: the pinned line is a HAND-OFF - it
# names another object and passes the work to it, and that other object is what touches the
# record. Nine rows are `indirect_callers` in the payload, labelled with `via` and `hops`;
# six are `direct_callers` whose pinned line is a hand-off the resolver attributed to this
# file directly. Each row's `relation` names the go-between explicitly.

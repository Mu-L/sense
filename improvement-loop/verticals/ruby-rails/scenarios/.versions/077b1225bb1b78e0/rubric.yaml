# Per-scenario rubric for the LLM judge layer.
#
# Four criteria per step, weights summing to 1.0: map_quality 0.40 / specificity 0.25
# / justification 0.20 / uncertainty 0.15.
#
# CYCLE 8, SEVEN-STEP SESSION (plans/03-expand.md). This is the cycle-4 session rubric
# (discourse.rubric.yaml.session-7step-cycle4.bak) with two steps replaced by the cycle-8
# probe rubric's, verbatim: "Map the category contract" and "Audit every dependent of the
# category contract". The second of those is the discriminator, so its four questions and
# the audience paragraph are the ones the mini-bench was judged under and are not touched.
# The cycle-8 two-step probe rubric is kept at discourse.rubric.yaml.probe-2step-cycle8.bak.
#
# WHY map_quality carries the most weight on the discriminator: this scenario's axis is
# SCOPE, not darkness. Every dependent in the scored group is a one-touch call site inside a
# routine named after some other job, and the twelve of them are spread across twelve
# distinct areas in five separate trees - the application's scheduled jobs, its rake tasks,
# its import scripts, its migration tooling, and five bundled plugins. A search route has to
# decide where to point before it can enumerate, and every measured baseline route on this
# repo pointed at a subset of the application tree. Breadth across areas is what is scored.
#
# WHY specificity demands the enclosing routine: every scored row is a call inside a def
# (or, for the narrative-bot row, inside a Proc in a state table), so the routine is
# demanded for all of them, and it is the part a search result does not print.
#
# SEVEN steps, names verbatim and in the order of scenarios/discourse.yaml (the judge pairs
# by name). Earlier rubrics: cycle 7 at discourse.rubric.yaml.periphery-cycle7.bak, cycle 6
# at .holder-widest-cycle6.bak, cycle 5 at .holder-subset-cycle5.bak, cycle 4's probe at
# .probe-2step-cycle4.bak and its session at .session-7step-cycle4.bak.
audience: 'An AI coding agent that will use this answer to safely rework the Discourse category

  class - the container topics are filed under, carrying its own permissions, settings and

  hierarchy. Score for that agent, not a human reader and not a docs page. A perfect answer

  leaves the agent able to change that class knowing two things: how the rest of the system

  gets hold of one of these records when all it holds is the human-readable path out of a

  URL - traced through the routines that make that path up - and every other place that

  would have to be reviewed or changed with the class, each pinned to an exact file:line

  with the consequence of the change on that place stated. The dependents that matter are

  not the code named after this class. They are single touches inside routines doing some

  other job entirely - optimising uploads during a migration, appending imported records in

  sort order, deciding whether two records being merged are the same one, deciding whether

  an incoming import record already exists, walking every record to re-feed a search index,

  finding the records whose search rows are stale, migrating one plugin''s data into

  another, skipping a stored integration rule that no longer resolves, casting a user-typed

  query parameter, narrowing an embedding suggestion to what a user may post in, expanding

  a configured parent into its descendants, staging a bot tutorial - and they are scattered

  across the application''s scheduled jobs, its rake tasks, its import scripts, its

  migration tooling and its bundled plugins. A weak answer covers the application tree

  thoroughly and treats the rest of the repository as if it were not there; or collapses a

  run of dependents into one line with a shared reason and no location on any of them; or

  gives file:line with nothing said about what would break, which leaves the agent knowing

  where the name appears and not what its change would do.

  '
steps:
- name: Orient in the codebase
  criteria:
    map_quality:
      weight: 0.4
      question: 'Does the answer give a usable map of the project - what it is, how the tree is laid
        out,

        where the class under rework sits, and what its behaviour is assembled from (the concerns

        mixed in, the associations it declares, the settings it reads)? The test is whether the

        next step can act from this map with small targeted lookups instead of starting over.

        '
    specificity:
      weight: 0.25
      question: 'Are the claims anchored to paths, and the class and its assembled pieces to file:line?
        A

        tour of the directory names with no file:line anywhere is not specific.

        '
    justification:
      weight: 0.2
      question: 'Does the orientation say why each part of the map matters to the ticket, rather
        than

        reciting the directory layout of a Rails application in general?

        '
    uncertainty:
      weight: 0.15
      question: 'Does it separate what it read from what it assumed from a conventional layout? A
        Rails

        tree invites confident guessing; saying which parts were actually opened is worth more.

        '
- name: Map the category contract
  criteria:
    map_quality:
      weight: 0.4
      question: 'Is the slug-path resolution path traced end to end as one connected path, rather

        than listed as places the class is mentioned? A strong answer reaches the

        class-level entry point every lookup bottoms out in, the trailing-id variant, the

        one-level lookup the hierarchy walk is built from, the hierarchy walk itself, the

        HTTP front door, the rename path that keeps a stored slug in step, and the

        retired-path redirect. Credit is for showing how they connect, not for the count.

        Could the next step act from this map with small targeted lookups rather than a

        fresh exploration?

        '
    specificity:
      weight: 0.25
      question: 'Does every place carry an exact file:line AND the name of the routine it lives

        in? A bare filename is not specific. A file:line with no routine named around it

        is not specific - the maintainer asked whose code it is, not where the character

        offset falls. A routine named without the file:line where it is defined is not

        specific either.

        '
    justification:
      weight: 0.2
      question: 'Does each place carry one phrase on what it contributes to the resolution path -

        which input form it accepts, what it disambiguates, what it falls back to, why it

        refuses? Do the closing sentences say what a rework must preserve in terms of

        behaviour, rather than restating the method names?

        '
    uncertainty:
      weight: 0.15
      question: 'Does the answer separate what it verified by reading from what it inferred from
        a

        name? Guessing at a fallback it never opened is worse than saying it did not

        check. Is completeness claimed without saying how it was established?

        '
- name: Trace how one of these records is built up and taken apart
  criteria:
    map_quality:
      weight: 0.4
      question: 'Is the lifecycle traced as a sequence - the decision that one is needed, its creation,
        the renames and re-descriptions that follow, and its teardown - with what runs around each
        moment? A strong answer separates two timings and does not collapse them: what runs inline
        in the call that saved or destroyed the record, and what is handed off to run once that call
        has finished. Reciting the callback declarations in order is not the answer; saying which
        of them the caller can depend on having already happened is.

        '
    specificity:
      weight: 0.25
      question: 'Does every layer carry a file:line and the routine it lives in, including the handed-off
        ones - the code that picks the work up, not just the line that dispatches it?

        '
    justification:
      weight: 0.2
      question: 'For each hand-off, does the answer say WHAT is handed over - the record itself,
        or an identifier to be looked up again later - and why that matters to a contract change?
        A deferred consumer that re-resolves by id can find the record gone; one holding the record
        cannot. That distinction is the point of the step.

        '
    uncertainty:
      weight: 0.15
      question: 'Does the answer flag the parts of the lifecycle it could not follow - work dispatched
        by a

        registered name rather than a direct call is easy to miss, and saying so is worth more

        than an unqualified claim that the lifecycle is fully covered.

        '
- name: Audit every dependent of the category contract
  criteria:
    map_quality:
      weight: 0.4
      question: 'THE DISCRIMINATOR, and it is BREADTH OF AREA. Does the audit reach dependents

        outside the part of the repository that serves web requests, or does it cover the

        application thoroughly and stop there? The dependents that decide this step are

        single touches inside routines named after some other job, and they sit as much in

        the migration tooling, the import scripts, the maintenance and plugin rake tasks,

        the one-off jobs and the bundled plugins as in the application itself. An answer

        that is dense in one tree and silent in the others has enumerated inside one search

        scope and mistaken that for the codebase. Is the answer organised by area with each

        area worked to the end, and are areas it could not finish declared as unfinished

        rather than quietly summarised? Re-listing the class''s own surface, or the join

        models named after it, is not this question.

        '
    specificity:
      weight: 0.25
      question: 'Does EVERY dependent carry its own exact file:line AND the name of the routine

        the dependency sits inside? Every dependent in scope here is a call inside a

        routine, so a file:line with no routine named around it is not specific, and a

        routine named without a file:line is not specific either. Several dependents named

        together on one line as a set that shares a reason is the failure this criterion

        exists to catch: however correct the shared reason is, it is one item, not a set

        of located dependents, and it should be scored as one. A bare filename does not

        count.

        '
    justification:
      weight: 0.2
      question: 'Does each dependent carry one phrase on what that place would start getting wrong

        if the class changed under it? The consequence must be about that place''s own job

        - what breaks for the uploads being optimised, the import being appended or merged,

        the search index being rebuilt or swept, the plugin data being migrated, the stored

        integration rule being skipped, the saved query parameter being cast, the

        suggestion being narrowed, the template list being expanded, the tutorial being

        staged - not a restatement of the line of code.

        '
    uncertainty:
      weight: 0.15
      question: 'Does the answer say how it convinced itself the audit is exhaustive, and name

        where it is likely still thin? An unqualified claim of completeness over a

        codebase this size is overconfidence. Naming an area it knows it did not finish,

        and what it left there, is worth more than a confident list that quietly stops.

        '
- name: Trace the guards that confirm a real, current record
  criteria:
    map_quality:
      weight: 0.4
      question: 'Does the answer cover the distinct KINDS of guard rather than many instances of
        one kind?

        The kinds are: a type check on something that may not be one of these at all; a lookup by

        user-supplied name or identifier turned into a refusal at the boundary instead of a nil

        handed downstream; and a reference stored earlier re-checked against what is actually

        there before it is trusted. Missing a whole kind costs more than missing an instance.

        '
    specificity:
      weight: 0.25
      question: 'Does each guard carry a file:line and its enclosing routine? A validation named
        by its

        method alone, or a bare file, is not specific.

        '
    justification:
      weight: 0.2
      question: 'Does each guard carry one phrase on what it protects the caller from - what would
        reach

        the next layer and fail there if the guard were removed - rather than restating the

        condition in words?

        '
    uncertainty:
      weight: 0.15
      question: 'Does the answer distinguish guards it read from guards it expects a framework to
        provide?

        Assuming a validation exists because a Rails model usually has one is the failure here.

        '
- name: Assess the blast radius of the contract change
  criteria:
    map_quality:
      weight: 0.4
      question: 'Is this a RANKING that adds something to the audit, or the audit relisted? A strong
        answer

        separates dependents that would fail loudly and immediately from those that would keep

        running and quietly return something different, and says what drives the split. The quiet

        ones are the expensive ones and a ranking that does not surface them has not done the

        step. Ranking everything as high risk is not a ranking.

        '
    specificity:
      weight: 0.25
      question: 'Is each risk pinned to the routine that carries it, at a file:line, rather than
        to the

        file it sits in? A ranked list of filenames is not this step''s answer.

        '
    justification:
      weight: 0.2
      question: 'Does each rank carry its reason - why this one breaks first, why that one degrades

        silently, what has to be re-verified afterwards and how? A ranking with no stated driver

        is an ordering the maintainer cannot check.

        '
    uncertainty:
      weight: 0.15
      question: 'Does the answer say which parts of the radius it is least sure of, and name what
        it would

        have to look at to firm them up? Confident totals over a codebase this size are the tell.

        '
- name: Produce the change + verification map
  criteria:
    map_quality:
      weight: 0.4
      question: 'Is this a map a teammate could land the change from without re-exploring - the pieces
        of

        the contract itself that get edited, every dependent grouped by area, and the test surface

        that has to move with it? Completeness against everything found earlier in the session is

        what is measured; a map that quietly drops areas the audit reached is the failure.

        '
    specificity:
      weight: 0.25
      question: 'Do the edits and the dependents carry file:line and the enclosing routine? The tests
        are

        the exception: a test that must be ADDED has no line yet, so naming the file it belongs in

        is the correct form there and is not penalised.

        '
    justification:
      weight: 0.2
      question: 'Does the map say what each edit is for and what each test would be covering - the

        behaviour that moves - rather than listing paths under headings?

        '
    uncertainty:
      weight: 0.15
      question: 'Does it state what it is not sure survives the change, and what it would want checked

        first? A plan claiming to be complete over the whole radius, with no residual risk named,

        is overconfident.

        '

name: Mastodon work session - audit the content model's storage contract before a rework
repo: mastodon
contract_symbol: Status
contract_file: app/models/status.rb
# Single-prompt session bench (bench/drivers/bench-sense-local.sh): all steps are presented
# in ONE prompt and worked in order. Rendered to the agent: the description + each step's
# name and prompt ONLY (checks/gold are NEVER shown). Everything rendered is kept NEUTRAL -
# it states the task, never the answer's shape, file paths, class names, counts, or which
# tool to reach for.
#
# WHY THIS SEAM (authored 2026-08-01, first mastodon scenario in this vertical).
#
# The bar is CITED recall - `path:line`. Two adversary probes at this pin establish the
# discriminator, and they FAILED DIFFERENTLY, which is why the axis holds:
#   - The benched-baseline profile: finds the set, cannot pin it.
#   - This session's probe (frontier, grep+read, 23 tool calls, graded at path:line):
#     pinned 67 distinct files with ~135 exact line citations - it reported that `grep -n`
#     gives locations FREE - and still reached only 4 of the 16 scattered dependents (0.25).
#     It went DEEP on the contract centre (status.rb's association graph, the teardown
#     pipeline, serializers, policies, all correctly pinned) and never reached the
#     periphery: the retention vacuum, the annual-report presenter, the FASP backfill,
#     the CLI cache recount, the search-index importers.
# At session budget an agent goes deep on the centre OR wide across the periphery, never
# both. The gold below is built from the periphery the probe did not reach.
#
# Every `dependents` row was hand-audited this session by reading its exact line (the blast
# payload gives the enclosing `def`, NOT the line that touches Status - the def line is not
# the dependency). `REST::InstanceSerializer#configuration` was CUT as noise: it reads the
# constant `Status::MEDIA_ATTACHMENTS_LIMIT`, which is not a teardown dependency.
#
# NO measured delta is claimed here: this scenario has never been run.
description: 'You are a maintainer about to rework how a status is stored, referenced and
  cleaned up - the storage contract of the central content model users post. Before touching
  it, you need a complete audit of what depends on that contract today, so the rework cannot
  silently break a dependent. Work through the tasks below one at a time; each builds on what
  you learned in the previous one. Every location you report must be an exact file:line a
  teammate could jump straight to - a filename alone is not an answer.'
steps:
- name: Orient in the codebase
  prompt: "Task: orient yourself. In a few sentences plus exact file:line references, what is
    this project, how is the code organized, and where does the central content model sit -
    the thing users post that feeds, notifications, federation and moderation all revolve
    around - along with the shared pieces mixed into it? Hand the next agent a map so they can
    act with small targeted lookups, not a fresh exploration. No Explore agents.
    "
  checks:
  - type: word
    value: Status
    required: true
  - type: response_richness
    value: '3'
    required: false
  - type: mcp_tool_used
    value: sense_search
    required: false
    layer: adoption
- name: Map the contract and what is mixed into it
  prompt: "Task: map the contract you are about to change. What does the model expose, what
    shared behavior is mixed into it, and what does a teammate need to know before changing
    how it is stored? Give file:line for the model and for each shared piece.
    "
  checks:
  - type: response_richness
    value: '4'
    required: true
  - type: contains
    value: status.rb
    required: false
  - type: mcp_tool_used
    value: sense_graph
    required: false
    layer: adoption
- name: Trace the write and teardown paths
  prompt: "Task: trace how one of these records is created and how it is torn down. Start
    where it is first persisted, follow what happens on removal, and name what is cleaned up
    versus deliberately left behind. Give file:line for each layer and the order they run.
    "
  checks:
  - type: word
    value: destroy
    required: false
  - type: response_richness
    value: '4'
    required: true
- name: Audit every dependent of the storage contract
  prompt: "Task: this is the core of the ticket. Find EVERY place in the codebase that depends
    on how this record is stored, referenced or cleaned up, so the rework cannot silently
    break one. Be exhaustive and group them by area. Do NOT stop at the model and its
    obvious write path - the risk lives in the places that reach these records from far away:
    background maintenance and retention, reporting and metrics, moderation, search
    indexing, account lifecycle, import/export, federation, and command-line tooling. Some
    hold only raw ids with no foreign key; some receive the class itself as an argument. For
    each dependent give an exact file:line and one phrase on HOW it uses the record. A
    filename with no line number does not count. A missed dependent is a regression shipped.
    "
  checks:
  - type: response_richness
    value: '6'
    required: true
    description: Enumerated the scattered periphery with exact locations, not just the centre
  - type: no_grep
    value: no_grep
    required: false
    layer: adoption
  - type: mcp_tool_used
    value: sense_blast
    required: false
    layer: adoption
- name: Assess the blast radius of the storage change
  prompt: "Task: you are about to change how these records are stored and cleaned up. Assess
    the full blast radius: which dependents are most likely to break, which fail silently
    rather than loudly, and what must be re-verified after the change. Cover every area you
    found, including the ones far from the model. Use file:line and rank by risk.
    "
  checks:
  - type: response_richness
    value: '6'
    required: true
  - type: mcp_tool_used
    value: sense_blast
    required: false
    layer: adoption
- name: Produce the change + verification map
  prompt: "Task: produce the complete map for landing this safely: what you will edit, every
    dependent that must be reviewed or touched grouped by area, and the tests that must be
    updated or added. Use exact file:line throughout, so a teammate could land the change
    from your map alone.
    "
  checks:
  - type: response_richness
    value: '6'
    required: true
  - type: contains
    value: spec
    required: false
scoring:
  weights:
    correctness: 0.70
    efficiency: 0.30
# GOLD. One row per FILE. Three groups:
#   contract   - the model and its mixed-in pieces. Both arms reach these. NOT scoring.
#   write-path - the obvious create/teardown services. Grep-easy. NOT scoring.
#   dependents - THE DISCRIMINATOR: the scattered periphery the path:line probe never
#                reached, 16 rows across 11 areas. Each line below was read this session.
gold:
  - {id: contract-model,   group: contract,   match: [app/models/status.rb], relation: "the Status model itself - the storage contract under change"}
  - {id: c:visibility,     group: contract,   match: [concerns/status/visibility.rb], relation: "Status::Visibility - the visibility scoping the contract must preserve"}
  - {id: c:threading,      group: contract,   match: [concerns/status/threading_concern.rb], relation: "Status::ThreadingConcern - reply-thread walks over in_reply_to_id"}
  - {id: c:snapshot,       group: contract,   match: [concerns/status/snapshot_concern.rb], relation: "SnapshotConcern - has_many :edits, dependent: :destroy on teardown"}
  - {id: a:statuses-ctrl,  group: write-path, match: [controllers/api/v1/statuses_controller.rb], relation: "creates and destroys statuses over the API"}
  - {id: a:post-service,   group: write-path, match: [services/post_status_service.rb], relation: "PostStatusService builds and persists a status"}
  - {id: a:remove-service, group: write-path, match: [services/remove_status_service.rb], relation: "RemoveStatusService is the canonical teardown path"}
  # -- background maintenance / retention
  - {id: d:vacuum,         group: dependents, match: [vacuum/statuses_vacuum.rb], relation: "statuses_vacuum.rb:35 Status.unscoped.kept - retention vacuum reaches PAST default_scope to prune remote statuses"}
  - {id: d:cli-cache,      group: dependents, match: [lib/mastodon/cli/cache.rb], relation: "cli/cache.rb:48 Status.includes(:status_stat) - CLI recounts cached counters"}
  - {id: d:cli-accounts,   group: dependents, match: [lib/mastodon/cli/accounts.rb], relation: "cli/accounts.rb:582 referencing_account(Status, :account_id) - the CLASS is passed as an ARGUMENT, so the dependency has no method-call trace"}
  # -- reporting / metrics
  - {id: d:annual-report,  group: dependents, match: [annual_reports_presenter.rb], relation: "annual_reports_presenter.rb:17 Status.where(id: flat_map(&:status_ids)) - hydrates a year of statuses from a raw id array"}
  - {id: d:metrics,        group: dependents, match: [measure/instance_statuses_measure.rb], relation: "instance_statuses_measure.rb:23 Status.joins(:account).merge(...).count - admin per-domain status count"}
  - {id: d:relationships,  group: dependents, match: [status_relationships_presenter.rb], relation: "status_relationships_presenter.rb:14 holds a statuses collection to batch-resolve viewer relationships"}
  # -- moderation
  - {id: d:account-warning, group: dependents, match: [app/models/account_warning.rb], relation: "account_warning.rb:46 Status.with_discarded.where(id: status_ids) - warnings hold a raw bigint array, NO foreign key, and must see discarded rows"}
  - {id: d:admin-filter,   group: dependents, match: [admin/status_filter.rb], relation: "admin/status_filter.rb:35 Status.joins(:media_attachments).merge(...) - moderation media filter"}
  # -- search indexing
  - {id: d:index-importer, group: dependents, match: [importer/statuses_index_importer.rb], relation: "statuses_index_importer.rb:78 Status.local.select(raw SQL over reblog_of_id) - bulk index import depends on the column layout"}
  - {id: d:public-index,   group: dependents, match: [importer/public_statuses_index_importer.rb], relation: "public_statuses_index_importer.rb:30 Status.indexable.reorder(nil) - public index scope"}
  # -- account lifecycle / import-export
  - {id: d:account-merge,  group: dependents, match: [concerns/account/merging.rb], relation: "merging.rb:15 Status listed among the classes whose rows are re-pointed when two accounts merge"}
  - {id: d:form-import,    group: dependents, match: [app/models/form/import.rb], relation: "form/import.rb:102 Status.where(uri: import_statuses) - bookmark import resolves statuses by URI"}
  # -- federation
  - {id: d:ap-announce,    group: dependents, match: [activitypub/activity/announce.rb], relation: "announce.rb:14 Status.find_by(account:, reblog: original_status) - a boost is itself a Status row"}
  - {id: d:ap-activity,    group: dependents, match: [app/lib/activitypub/activity.rb], relation: "activity.rb:71 uri_to_resource(uri, Status) - the CLASS is passed as an ARGUMENT to resolve a URI, so no call edge names a Status method"}
  - {id: d:permalink,      group: dependents, match: [app/lib/permalink_redirector.rb], relation: "permalink_redirector.rb:14 Status.find_by(id: second_segment) - resolves a permalink, then gates on distributable?/local?/suspended?"}
  - {id: d:fasp-backfill,  group: dependents, match: [fasp/backfill_request.rb], relation: "fasp/backfill_request.rb:60 Status.indexable - FASP backfill selects content to announce"}

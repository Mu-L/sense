name: Mastodon work session - audit the instance-configuration contract before a rework
repo: mastodon
contract_symbol: Setting
contract_file: app/models/setting.rb
# Single-prompt session bench (run via bench/drivers/bench-sense-local.sh): all steps are
# presented in ONE prompt and worked in order, so context accumulates the way a real
# work session does. Rendered to the agent: the description + each step's name and
# prompt ONLY (checks/gold are NOT shown). Everything rendered is kept NEUTRAL: it
# states the task, never the answer's shape, file paths, class or method names,
# counts, or which tool to reach for.
#
# THE CONTRACT. `Setting` (app/models/setting.rb:43) is Mastodon's instance-level
# key/value store: a fork of rails-settings-cached whose reads go through
# `method_missing` -> `Setting[key]` -> cache -> `settings` row -> config/settings.yml
# default. Every feature that asks "am I switched on?", "what is this instance
# called?" or "how long do I keep this?" reaches it. `sense_blast Setting
# --file app/models/setting.rb` reports 88 direct callers over 41 files and 29 areas,
# risk high, completeness partial (resolved 80, hidden 234).
#
# THE AXIS. `Setting` is method_missing-dispatched, so there is no method to follow
# and no two dependents share a key. Each dependent reaches the contract on ONE line
# inside a feature about something else entirely: a date-of-birth validator computing
# the age floor, the annual-report campaign switch, a controller serving custom CSS,
# a mailer-distribution worker, the Referrer-Policy header, the captcha gate, the
# authorized-fetch helper, the media-retention policy, the bootstrap follow list, the
# NodeInfo discovery document, the peers-search enable switch, and three historical
# data migrations that still read a value they were meant to retire. That is the
# scattered periphery the `dependents` group is curated from: one item per FILE,
# eighteen files over seventeen directories, no two sharing a purpose.
#
# WHY IT IS A CITATION-COST AXIS, NOT A DISCOVERY ONE. Ruby has no import statement,
# so the import-law degenerates here into a token grep, and it was run and RECORDED
# rather than treated as a kill: `grep -rln '\bSetting\.' app lib db` returns 69
# files and covers 41 of 41 resolved caller files. The size condition applies - this
# index holds 17,571 symbols, above the 15k line at which a one-token cover counts as
# a kill - so a covering grep is a hypothesis about the arm, not a proof, and the
# validation pair decides it. The same number (one `grep -rl` covering 16 of 16 gold
# files) sat under the banked +0.72 cell in this vertical and predicted nothing.
# The discriminator is what the grep does NOT give: 526 raw `Setting` hits across the
# repo, an admin-settings surface that dominates the top of any listing, and a line
# per dependent that must be OPENED and read to state which decision the value makes.
#
# THE ADVERSARY PROBE. Recorded, not treated as a gate: `probe_score.py` grades the
# one-shot no-Sense probe COVERED (pool 37 / pinned 37 / coverage 1.000). Per the
# standing law the probe is a LEAD and does not estimate the benched arm in either
# direction (calibration on record: probe 4 of 16 where the arm reached 10; probe 15
# of 16 where the arm reached 2.5), and the probe was one unbudgeted question, not a
# seven-step session at a wall. `dependents` below is therefore NOT built as the
# complement of that probe run; it is selected for citation cost and scatter, and
# `pay_ceiling.py` at validation is the only measurement of what the baseline holds.
#
# MEMORIZATION. `memorization_probe.py` was run per candidate row. It came back
# RECITED for `Trends` (0.417), `Tag` (0.645) and `Account` (0.312), so
# app/models/trends.rb, app/models/tag.rb and app/models/account.rb were CUT from
# gold even though all three are real, shown, in-pool dependents (the trendability
# area is dropped with them). Every surviving row scored `not recited` or declared
# too few members to recite; each is pinned to a line-level structural fact.
description: |
  You are a maintainer about to rework how instance-level configuration is stored and
  read - the settings contract that decides whether a feature is on, what the instance
  calls itself, and how long it keeps things. Before you touch it, audit what depends
  on that contract, completely enough that the rework cannot silently break a
  dependent. Do not stop at the settings admin form, the settings screen and the
  settings command-line tool - those are the obvious half and they are not what is
  being asked for. A dependent counts wherever a configuration value is READ to make a
  decision, and the ones that matter live in features that are not about settings at
  all. For each one give an exact file:line a teammate could jump straight to, plus one
  phrase on which decision it makes with the value it reads. A filename with no line
  number does not count, and a missed dependent is a regression shipped.
steps:
- name: Orient in the codebase
  prompt: "Task: orient yourself. In a few sentences plus file paths, what is this
    project, how is the code organized, and where does the instance-level configuration
    store sit - the key/value contract a feature asks whether it is switched on, what
    the instance is called, or how long data is kept? Hand the next agent a map so they
    can act with small, targeted lookups, not a fresh exploration of the codebase.
    No Explore agents.
    "
  checks:
  - type: word
    value: settings
    required: true
  - type: response_richness
    value: '3'
    required: false
  - type: mcp_tool_used
    value: sense_search
    required: false
    layer: adoption
  - type: mcp_tool_used
    value: sense_conventions
    required: false
    layer: adoption
- name: Map the configuration contract and how a value is read
  prompt: "Task: map the contract you are about to change. How is a configuration value
    declared, where does its default come from, what happens between a caller asking
    for a value and the stored value coming back, and what does a teammate need to know
    about that read path before changing it? Give file:line for the store itself and
    for each layer a read passes through.
    "
  checks:
  - type: word
    value: default
    required: false
  - type: response_richness
    value: '4'
    required: true
  - type: mcp_tool_used
    value: sense_graph
    required: false
    layer: adoption
- name: Trace how a configuration value is written
  prompt: "Task: trace the write side. Follow a change an operator makes to a
    configuration value from the surface they change it on through to the stored value,
    including any other surface that can write one. Give file:line for each layer and
    the order they run.
    "
  checks:
  - type: word
    value: save
    required: false
  - type: response_richness
    value: '3'
    required: true
  - type: mcp_tool_used
    value: sense_graph
    required: false
    layer: adoption
- name: Audit every dependent of the configuration contract
  prompt: "Task: this is the core of the ticket. Find EVERY place in the codebase that
    READS an instance-level configuration value to make a decision, so the rework
    cannot silently break one. Be exhaustive and group them by area. Do not stop at the
    settings admin form, the settings screen or the settings command-line tool - those
    are the obvious half and they are not what is being asked for. The ones that matter
    live in features that are not about configuration at all: validation rules,
    background workers and schedulers, request and API enable/disable gates, response
    headers, the data-retention policy, the onboarding follow list, service-discovery
    documents, static assets served from a stored value, and the historical data
    migrations that still read a value they were meant to retire. For each dependent
    give file:line and one phrase on which decision it makes with the value it reads. A
    filename with no line number does not count, and a missed dependent is a regression
    shipped.
    "
  checks:
  - type: response_richness
    value: '6'
    required: true
    description: Enumerated the scattered one-line-per-feature dependent set, not the settings admin surface
  - type: no_grep
    value: no_grep
    required: false
    layer: adoption
  - type: mcp_tool_used
    value: sense_blast
    required: false
    layer: adoption
- name: Trace the dependents that read the stored record rather than the value
  prompt: "Task: some dependents do not go through the normal read path at all - they
    reach the stored rows directly, or they read a value that was supposed to have been
    retired, or they read a shape of the storage that no longer exists at runtime.
    Find them and explain, for each, what it would take for a storage change to break
    it. Give file:line throughout.
    "
  checks:
  - type: word
    value: migration
    required: false
  - type: response_richness
    value: '4'
    required: true
  - type: mcp_tool_used
    value: sense_blast
    required: false
    layer: adoption
- name: Assess the blast radius of the contract change
  prompt: "Task: you are about to change how configuration values are stored and read.
    Assess the full blast radius: which dependents are at risk, which are most likely
    to break, and what must be re-verified after the change, across every area you
    found. Be complete and use file:line; rank by risk. A missed high-risk dependent is
    the one that pages someone.
    "
  checks:
  - type: response_richness
    value: '6'
    required: true
    description: Ranked the scattered dependents by risk, not just relisted the settings surface
  - type: mcp_tool_used
    value: sense_blast
    required: false
    layer: adoption
- name: Produce the change + verification map
  prompt: "Task: produce the complete map for landing this safely: the pieces of the
    configuration store you will edit, every dependent that must be reviewed or touched
    grouped by area, and the tests or fixtures that must be updated or added. Use
    file:line throughout, so a teammate could land the change from your map alone.
    "
  checks:
  - type: response_richness
    value: '6'
    required: true
  - type: contains
    value: spec
    required: false
scoring:
  weights:
    correctness: 0.70
    efficiency: 0.30
# Gold is the must-find audit of every dependent of the instance-configuration
# contract. Three groups:
#   - `contract` (1, non-discriminator): the store itself. Both arms open it first.
#   - `write-path` (3, non-discriminator): the settings admin form, the settings admin
#     screen and the settings CLI - everything in this group is NAMED for settings and
#     both arms reach it by name. It does NOT score.
#   - `dependents` (18, THE DISCRIMINATOR): the scattered periphery - one item per
#     FILE, seventeen directories, no two sharing a purpose, each reaching the contract
#     on a single line inside a feature about something else. Every row is a
#     `direct_callers` row of `sense_blast Setting --file app/models/setting.rb` at MCP
#     defaults, i.e. it is in the output the Sense arm is SHOWN, truncation included.
#     Every `relation` below was hand-audited by opening the file and reading the line;
#     none was taken from a script tally.
# All targets are file-path matched (full path fragments, never basenames - basename
# matching has awarded credit for the wrong file) so both mention and citation score.
# pergroup.py measures the `dependents` delta - the headline.
gold:
  # the contract itself - both arms reach it (non-discriminator anchor)
  - {id: c:setting-store, group: contract, match: [app/models/setting.rb], relation: "app/models/setting.rb:43 - the Setting store itself, method_missing-dispatched over a cached settings row with a YAML default"}
  # the settings-management surface: named for settings, reached by name by both arms
  # (non-discriminator anchors)
  - {id: w:admin-settings-form, group: write-path, match: [app/models/form/admin_settings.rb], relation: "app/models/form/admin_settings.rb:144 - Form::AdminSettings#save is the write path that persists an operator's edits"}
  - {id: w:admin-settings-controller, group: write-path, match: [app/controllers/admin/settings_controller.rb], relation: "app/controllers/admin/settings_controller.rb:4 - the admin settings screen that drives the form"}
  - {id: w:cli-settings, group: write-path, match: [lib/mastodon/cli/settings.rb], relation: "lib/mastodon/cli/settings.rb:8 - the CLI write path (Registrations#open/#close/#approved) that sets the value from a shell"}
  # THE DISCRIMINATOR (`dependents`): one line per feature, scattered across sixteen
  # directories, each read hand-verified by opening the file.
  - {id: d:min-age-validator, group: dependents, match: [app/validators/date_of_birth_validator.rb], relation: "app/validators/date_of_birth_validator.rb:11 `Setting.min_age.to_i.years` - the configured minimum age becomes the date-of-birth floor a signup is rejected against"}
  - {id: d:annual-report-campaign, group: dependents, match: [app/lib/annual_report.rb], relation: "app/lib/annual_report.rb:20 `return unless Setting.wrapstodon` - the switch that decides whether this year's annual-report campaign exists at all"}
  - {id: d:email-distribution-worker, group: dependents, match: [app/workers/email_distribution_worker.rb], relation: "app/workers/email_distribution_worker.rb:10 `return unless Rails.application.config.x.email_subscriptions && Setting.email_subscriptions` - the instance switch aborts newsletter distribution in the background worker"}
  - {id: d:auto-close-registrations, group: dependents, match: [app/workers/scheduler/auto_close_registrations_scheduler.rb], relation: "app/workers/scheduler/auto_close_registrations_scheduler.rb:15 `return unless Setting.registrations_mode == 'open'` - the scheduler reads the registration mode to decide whether it may flip the instance to approval-only"}
  - {id: d:referrer-policy-header, group: dependents, match: [app/controllers/concerns/web_app_controller_concern.rb], relation: "app/controllers/concerns/web_app_controller_concern.rb:64 `response.set_header('Referrer-Policy', Setting.allow_referrer_origin ? 'strict-origin-when-cross-origin' : 'same-origin')` - the configuration value picks the Referrer-Policy sent on every web-app response"}
  - {id: d:captcha-gate, group: dependents, match: [app/controllers/concerns/auth/captcha_concern.rb], relation: "app/controllers/concerns/auth/captcha_concern.rb:29 `captcha_available? && Setting.captcha_enabled` - decides whether the sign-up captcha step exists"}
  - {id: d:authorized-fetch, group: dependents, match: [app/helpers/authorized_fetch_helper.rb], relation: "app/helpers/authorized_fetch_helper.rb:5 `ENV.fetch('AUTHORIZED_FETCH') { Setting.authorized_fetch && 'true' } == 'true'` - the stored value (unless an env var overrides it) decides whether federation requires a signed fetch"}
  - {id: d:media-retention, group: dependents, match: [app/models/content_retention_policy.rb], relation: "app/models/content_retention_policy.rb:9 `retention_period Setting.media_cache_retention_period` - how many days remote media survives before the vacuum deletes it"}
  - {id: d:bootstrap-follows, group: dependents, match: [app/models/account_suggestions/setting_source.rb], relation: "app/models/account_suggestions/setting_source.rb:46 `Setting.bootstrap_timeline_accounts` - the configured account list new users are suggested/made to follow"}
  - {id: d:nodeinfo-discovery, group: dependents, match: [app/serializers/node_info/serializer.rb], relation: "app/serializers/node_info/serializer.rb:37 `Setting.registrations_mode != 'none' && !Rails.configuration.x.single_user_mode` - the registration mode becomes NodeInfo's advertised openRegistrations flag"}
  - {id: d:peers-search-gate, group: dependents, match: [app/controllers/api/v1/peers/search_controller.rb], relation: "app/controllers/api/v1/peers/search_controller.rb:22 `head 404 unless Setting.peers_api_enabled && !limited_federation_mode?` - the peers-API switch 404s peer search"}
  - {id: d:topic-timeline-auth, group: dependents, match: [app/controllers/api/v1/timelines/topic_controller.rb], relation: "app/controllers/api/v1/timelines/topic_controller.rb:10 `Setting.local_topic_feed_access != 'public'` - the feed-access value decides whether a hashtag/link timeline requires authentication"}
  - {id: d:custom-css-body, group: dependents, match: [app/controllers/custom_css_controller.rb], relation: "app/controllers/custom_css_controller.rb:12 `Setting.custom_css` - the stored value IS the body served at /custom.css"}
  - {id: d:post-status-newsletter, group: dependents, match: [app/services/post_status_service.rb], relation: "app/services/post_status_service.rb:174 `return unless Rails.application.config.x.email_subscriptions && Setting.email_subscriptions &&` - posting a status only queues a newsletter send when the instance switch is on"}
  - {id: d:directory-gate, group: dependents, match: [app/controllers/api/v1/directories_controller.rb], relation: "app/controllers/api/v1/directories_controller.rb:15 `not_found unless Setting.profile_directory` - the profile-directory switch 404s the directory endpoint"}
  - {id: d:min-invite-role-migration, group: dependents, match: [db/post_migrate/20220704024901_migrate_settings_to_user_roles.rb], relation: "db/post_migrate/20220704024901_migrate_settings_to_user_roles.rb:56 `Setting.min_invite_role` - a post-migration still reads the retired min_invite_role value to decide which roles get invite_users"}
  - {id: d:open-registrations-migration, group: dependents, match: [db/migrate/20190314181829_migrate_open_registrations_setting.rb], relation: "db/migrate/20190314181829_migrate_open_registrations_setting.rb:5 `open_registrations = Setting.find_by(var: 'open_registrations')` - reads the settings ROW directly (not the accessor) for the retired open_registrations value to derive registrations_mode"}
  - {id: d:advanced-layout-migration, group: dependents, match: [db/migrate/20190529143559_preserve_old_layout_for_existing_users.rb], relation: "db/migrate/20190529143559_preserve_old_layout_for_existing_users.rb:12 `Setting.unscoped.exists?(thing_type: 'User', thing_id: user.id, var: 'advanced_layout')` - reads the OLD columnar shape of the settings table, which no runtime accessor exposes"}

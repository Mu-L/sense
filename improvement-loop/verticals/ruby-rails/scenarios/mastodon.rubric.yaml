# Per-scenario rubric for the LLM judge layer. NEVER rendered to the agent - it grades
# the answer.
#
# This rubric OPTS INTO the fifth `relationship` (chain-correctness) criterion, so the
# judge runs on judge_prompt.v2.md and EVERY step declares all five. Weights per step
# sum to 1.0.
#
# WHY relationship here: the discriminator is the SCATTERED PERIPHERY, not the contract
# centre. A frontier probe at this pin pinned 67 files with ~135 exact line citations -
# a strong, correct audit of status.rb's association graph, the teardown pipeline,
# serializers and policies - and still reached only 4 of the 16 peripheral dependents.
# So an answer that maps the centre beautifully is NOT a good answer to this ticket, and
# the rubric must not reward it as one. `relationship` measures the orthogonal axis:
# does the answer state HOW each dependent touches the record (prunes it, counts it,
# re-points it, resolves it, indexes it), which a name search cannot assemble.
#
# Step names MUST match scenarios/mastodon.yaml exactly (the judge pairs by name).

audience: |
  An AI coding agent that will use this answer to safely rework how a status is stored,
  referenced and cleaned up, with only small targeted follow-up lookups, not a fresh
  exploration of the codebase. Score for that audience, not a human reader and not a
  docs page. The deliverable is an audit a teammate could act on without re-exploring,
  so an exact `file:line` is the unit of a correct answer: a filename with no line
  number is an incomplete finding, not a complete one - grade it as such, however
  confident the surrounding prose sounds. A perfect answer leaves the agent able to
  change the storage contract knowing every dependent that must be reviewed AND how
  each one is connected, including the ones far from the model; a weak answer forces
  the agent to re-read the codebase before it can act safely.

steps:
  - name: Orient in the codebase
    criteria:
      map_quality:
        weight: 0.35
        question: |
          Does the answer identify the central content model and locate it with
          file:line, and sketch how the app is organised (models / services / workers /
          lib / presenters) well enough that the next step can do targeted lookups
          rather than a fresh exploration?
      specificity:
        weight: 0.20
        question: |
          Are locations exact (file:line), not bare filenames or vague areas ("the
          model layer")?
      justification:
        weight: 0.15
        question: |
          Does the answer explain WHY the codebase is shaped this way - what the
          central record is for and what revolves around it - rather than only naming
          the directories?
      uncertainty:
        weight: 0.10
        question: |
          Does it flag what it has not yet examined, instead of presenting a partial
          orientation as complete?
      relationship:
        weight: 0.20
        question: |
          Does it state how the named pieces relate to the central record, rather than
          listing them side by side?

  - name: Map the contract and what is mixed into it
    criteria:
      map_quality:
        weight: 0.35
        question: |
          Does it name the model plus the shared pieces mixed into it (visibility
          scoping, reply threading, edit snapshots) with file:line for each, and say
          what a teammate must preserve when changing how it is stored?
      specificity:
        weight: 0.20
        question: Are the model and every shared piece pinned to an exact file:line?
      justification:
        weight: 0.15
        question: |
          Does it explain why each piece is part of the storage contract, not merely
          that it is mixed in?
      uncertainty:
        weight: 0.10
        question: |
          Does it say which parts of the contract it could not establish, rather than
          implying the map is exhaustive?
      relationship:
        weight: 0.20
        question: |
          For each piece, does the answer state HOW it participates in the contract
          (what it scopes, what it walks, what it destroys), rather than only naming it?

  - name: Trace the write and teardown paths
    criteria:
      map_quality:
        weight: 0.35
        question: |
          Does it trace creation through to persistence and removal through to cleanup,
          with file:line for each layer - including what is deliberately NOT cleaned up?
      specificity:
        weight: 0.20
        question: Exact locations for each layer, and is the ordering claim supported?
      justification:
        weight: 0.15
        question: |
          Does it explain why the teardown is staged the way it is, and why some rows
          are left behind?
      uncertainty:
        weight: 0.10
        question: |
          Does it mark the parts of the path it inferred rather than read?
      relationship:
        weight: 0.20
        question: |
          Is the causal chain correct - what triggers what, in what order - rather than
          a list of files that appear in the write path?

  - name: Audit every dependent of the storage contract
    criteria:
      map_quality:
        weight: 0.40
        question: |
          THE DECIDING CRITERION. Does the answer reach the dependents that sit FAR
          from the model, each with an exact file:line? The areas that matter are
          background maintenance and retention, reporting and metrics, moderation,
          search indexing, account lifecycle, import/export, federation, and
          command-line tooling.

          Two shapes are especially load-bearing and an answer that misses both has not
          done the audit: (a) code holding only raw ids with NO foreign key, which must
          also see soft-deleted rows; (b) code that receives the CLASS ITSELF as an
          argument, so no call edge names one of its methods.

          Grade coverage of that periphery. An answer that maps the model, its
          associations and its obvious create/teardown services thoroughly - and stops
          there - is INCOMPLETE for this ticket no matter how precise those locations
          are. Do not award map_quality for depth at the centre.
      specificity:
        weight: 0.25
        question: |
          Is every dependent pinned to an exact file:line a teammate could jump to?
          Count a bare filename as not found.
      justification:
        weight: 0.10
        question: |
          Does it say why each area was searched, so the agent can tell a complete
          sweep from a lucky one?
      uncertainty:
        weight: 0.05
        question: |
          Does it name the areas it did NOT reach, rather than presenting the list as
          exhaustive?
      relationship:
        weight: 0.20
        question: |
          For each dependent, is the stated relationship correct - how that code
          actually touches the record (prunes it, counts it, re-points it, resolves it,
          indexes it)?

  - name: Assess the blast radius of the storage change
    criteria:
      map_quality:
        weight: 0.30
        question: |
          Does the risk assessment span the same breadth, including the
          far-from-the-model dependents, rather than re-listing the centre?
      specificity:
        weight: 0.15
        question: Is each risk tied to an exact file:line?
      justification:
        weight: 0.25
        question: |
          Does it distinguish dependents that fail LOUDLY from ones that fail SILENTLY
          (a stale count, a skipped prune, a broken backfill), and rank by risk with
          reasons rather than by proximity to the model?
      uncertainty:
        weight: 0.10
        question: |
          Does it say which risks it is unsure of, and what it would need to check?
      relationship:
        weight: 0.20
        question: |
          Is the failure mode it predicts consistent with how that dependent actually
          uses the record?

  - name: Produce the change + verification map
    criteria:
      map_quality:
        weight: 0.35
        question: |
          Could a teammate land the change from this map alone - what to edit, every
          dependent to review grouped by area, and the tests to update or add - all
          with file:line?
      specificity:
        weight: 0.20
        question: Exact locations throughout, including the tests?
      justification:
        weight: 0.15
        question: |
          Does it explain the order of work and why each dependent needs review, rather
          than emitting an undifferentiated checklist?
      uncertainty:
        weight: 0.10
        question: |
          Does it mark what still needs verification before the change is safe?
      relationship:
        weight: 0.20
        question: |
          Does the map connect each edit to the dependents it affects, rather than
          listing edits and dependents separately?

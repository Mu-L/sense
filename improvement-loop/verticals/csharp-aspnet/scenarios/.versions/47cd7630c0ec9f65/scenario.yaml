  relation: "bitwarden_license/src/Commercial.Core/AdminConsole/Services/ProviderService.cs:699 `var token = _providerDeleteTokenDataFactory.Protect(new ProviderDeleteTokenable(provider, 1));` - in InitiateDeleteAsync; constructs the provider-delete kind and fixes its life at 1 hour by the second constructor argument"

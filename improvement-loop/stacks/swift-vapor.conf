# swift-vapor stack profile - what the repo hunt and the in-vertical screen need.

stack: Package.swift:vapor|hummingbird|swift-nio|fluent

hunt: --language swift --topic vapor --stars ">300"
hunt: --language swift --topic server-side-swift --stars ">200"
hunt: --language swift --size ">20000" --stars ">500"
hunt: --language swift --topic self-hosted --stars ">200"

framework: vapor/vapor
framework: vapor/fluent
framework: hummingbird-project/hummingbird
framework: apple/swift-nio
framework: PerfectlySoft/Perfect
framework: pointfreeco/swift-composable-architecture

# Applications we want benched by name: seeded by declaration, screened on
# reachable, maintained and language only, and slotted by SIZE like any other
# app (see ../stacks/README.md, `repo:`). Picked from this stack's own hunt
# output on 2026-08-13: popular, actively pushed, and applications rather than
# libraries or tutorials. Not `framework:` - that role is barred from the big
# slot, so declaring an app framework-role costs the slot it should fill.
repo: SwiftPackageIndex/SwiftPackageIndex-Server
repo: orlandos-nl/MongoKitten
repo: GraphQLSwift/GraphQL
repo: vapor/console-kit

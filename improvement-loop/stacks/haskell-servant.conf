# haskell-servant stack profile - what the repo hunt and the in-vertical screen need.

stack: cabal.project:packages|optional-packages|source-repository-package

hunt: --language haskell --topic haskell --stars ">500"
hunt: --language haskell --size ">20000" --stars ">300"
hunt: servant --language haskell --stars ">200"
hunt: --language haskell --topic self-hosted --stars ">200"

framework: haskell-servant/servant
framework: yesodweb/yesod
framework: snapframework/snap
framework: obsidiansystems/obelisk
framework: haskell/aeson

# Applications we want benched by name: seeded by declaration, screened on
# reachable, maintained and language only, and slotted by SIZE like any other
# app (see ../stacks/README.md, `repo:`). Picked from this stack's own hunt
# output on 2026-08-13: popular, actively pushed, and applications rather than
# libraries or tutorials. Not `framework:` - that role is barred from the big
# slot, so declaring an app framework-role costs the slot it should fill.
repo: PostgREST/postgrest
repo: simplex-chat/simplex-chat
repo: digitallyinduced/ihp
repo: simonmichael/hledger
repo: unisonweb/unison

# clojure-ring stack profile - what the repo hunt and the in-vertical screen need.

stack: deps.edn:ring/ring|compojure|io.pedestal|metosin/reitit|http-kit

hunt: --language clojure --topic clojure --stars ">500"
hunt: --language clojure --size ">20000" --stars ">300"
hunt: --language clojure --topic web --stars ">200"
hunt: --language clojure --topic self-hosted --stars ">200"

framework: ring-clojure/ring
framework: weavejester/compojure
framework: pedestal/pedestal
framework: metosin/reitit
framework: duct-framework/duct
framework: seancorfield/next-jdbc

# Applications we want benched by name: seeded by declaration, screened on
# reachable, maintained and language only, and slotted by SIZE like any other
# app (see ../stacks/README.md, `repo:`). Picked from this stack's own hunt
# output on 2026-08-13: popular, actively pushed, and applications rather than
# libraries or tutorials. Not `framework:` - that role is barred from the big
# slot, so declaring an app framework-role costs the slot it should fill.
repo: metabase/metabase
repo: penpot/penpot
repo: logseq/logseq
repo: babashka/babashka
repo: riemann/riemann

# elixir-phoenix stack profile - what the repo hunt and the in-vertical screen need.

stack: mix.exs::phoenix|:phoenix_live_view|:ecto_sql|:plug_cowboy

hunt: --language elixir --topic phoenix --stars ">500"
hunt: phoenix --language elixir --stars ">1000"
hunt: --language elixir --size ">20000" --stars ">300"
hunt: --language elixir --topic self-hosted --stars ">500"

framework: phoenixframework/phoenix
framework: elixir-lang/elixir
framework: elixir-ecto/ecto
framework: ash-project/ash
framework: absinthe-graphql/absinthe
framework: nerves-project/nerves

# Applications we want benched by name: seeded by declaration, screened on
# reachable, maintained and language only, and slotted by SIZE like any other
# app (see ../stacks/README.md, `repo:`). Picked from this stack's own hunt
# output on 2026-08-13: popular, actively pushed, and applications rather than
# libraries or tutorials. Not `framework:` - that role is barred from the big
# slot, so declaring an app framework-role costs the slot it should fill.
repo: plausible/analytics
repo: firezone/firezone
repo: livebook-dev/livebook
repo: supabase/realtime
repo: thechangelog/changelog.com

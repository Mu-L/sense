# ruby-rails stack profile - what the repo hunt and the in-vertical screen need.

stack: Gemfile:gem "rails"|gem 'rails'|gem "railties"|gem 'railties'|gem "activesupport"|gem 'activesupport'|gem "actionpack"|gem 'actionpack'

hunt: --language ruby --topic rails --stars ">1000"
hunt: rails --language ruby --stars ">2000"
hunt: --language ruby --size ">40000" --stars ">300"
hunt: --language ruby --topic self-hosted --stars ">1000"

framework: rails/rails
framework: solidusio/solidus
framework: spree/spree
framework: decidim/decidim
framework: thoughtbot/administrate

# Applications we want benched by name: seeded by declaration, screened on
# reachable, maintained and language only, and slotted by SIZE like any other
# app (see ../stacks/README.md, `repo:`). Picked from this stack's own hunt
# output on 2026-08-13: popular, actively pushed, and applications rather than
# libraries or tutorials. Not `framework:` - that role is barred from the big
# slot, so declaring an app framework-role costs the slot it should fill.
repo: discourse/discourse
repo: mastodon/mastodon
repo: chatwoot/chatwoot
repo: forem/forem
repo: gitlabhq/gitlabhq

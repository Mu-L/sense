# rust-axum stack profile - what the repo hunt and the in-vertical screen need.

stack: Cargo.toml:axum|tower-http|actix-web|tokio = |tokio.workspace

hunt: --language rust --topic axum --stars ">500"
hunt: --language rust --topic web-framework --stars ">1000"
hunt: --language rust --size ">40000" --stars ">500"
hunt: --language rust --topic self-hosted --stars ">1000"

framework: tokio-rs/axum
framework: tokio-rs/tokio
framework: actix/actix-web
framework: rwf2/Rocket
framework: poem-web/poem
framework: SeaQL/sea-orm
framework: launchbadge/sqlx

# Applications we want benched by name: seeded by declaration, screened on
# reachable, maintained and language only, and slotted by SIZE like any other
# app (see ../stacks/README.md, `repo:`). Picked from this stack's own hunt
# output on 2026-08-13: popular, actively pushed, and applications rather than
# libraries or tutorials. Not `framework:` - that role is barred from the big
# slot, so declaring an app framework-role costs the slot it should fill.
repo: synctv-org/synctv
repo: tranxuanthang/lrclib
repo: lennart-k/rustical
repo: matze/wastebin

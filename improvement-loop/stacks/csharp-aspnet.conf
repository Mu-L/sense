# csharp-aspnet stack profile - what the repo hunt and the in-vertical screen need.

stack: Directory.Packages.props:Microsoft.AspNetCore|Microsoft.EntityFrameworkCore|Microsoft.Extensions.DependencyInjection

hunt: --language c# --topic aspnetcore --stars ">500"
hunt: --language c# --size ">40000" --stars ">300"
hunt: --language c# --topic self-hosted --stars ">500"
hunt: aspnetcore --language c# --stars ">1000"

framework: dotnet/aspnetcore
framework: dotnet/efcore
framework: abpframework/abp
framework: OrchardCMS/OrchardCore
framework: dotnet/maui

# Applications we want benched by name. The marker above is Central Package
# Management, which is optional in .NET and unevenly adopted: bitwarden/server
# carries Directory.Build.props and no Directory.Packages.props, so the marker
# screen rejected it outright while 18 of its .csproj files declare
# Microsoft.AspNetCore. Listing beats widening the marker here, because a wider
# marker also admits every .NET desktop app that happens to reference the same
# packages.
#
# ServiceStack and Umbraco are framework-ROLE by taxonomy and were declared so
# until the C# bootstrap. They are listed as applications instead because the
# framework role is barred from the big slot, and these are the two largest C#
# codebases in the pool: as frameworks they could only ever stand in a medium
# slot, which is how the big slot went unfilled. Move either line back to
# `framework:` if the slate should treat it as a pillar rather than an app.
repo: bitwarden/server
repo: ServiceStack/ServiceStack
repo: Umbraco/Umbraco-CMS

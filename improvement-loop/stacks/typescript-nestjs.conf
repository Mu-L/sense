# typescript-nestjs stack profile - what the repo hunt and the in-vertical screen need.

stack: package.json:@nestjs/core|@nestjs/common|@nestjs/platform-express

hunt: --language typescript --topic nestjs --stars ">1000"
hunt: nestjs --language typescript --stars ">2000"
hunt: --language typescript --size ">40000" --stars ">500"
hunt: --language typescript --topic self-hosted --stars ">1000"

framework: nestjs/nest
framework: typeorm/typeorm
framework: mikro-orm/mikro-orm
framework: adonisjs/core
framework: redwoodjs/redwood
framework: trpc/trpc

# Applications we want benched by name: seeded by declaration, screened on
# reachable, maintained and language only, and slotted by SIZE like any other
# app (see ../stacks/README.md, `repo:`). Picked from this stack's own hunt
# output on 2026-08-13: popular, actively pushed, and applications rather than
# libraries or tutorials. Not `framework:` - that role is barred from the big
# slot, so declaring an app framework-role costs the slot it should fill.
repo: immich-app/immich
repo: twentyhq/twenty
repo: vendurehq/vendure
repo: ghostfolio/ghostfolio
repo: amplication/amplication

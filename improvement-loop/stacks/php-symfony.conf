# php-symfony stack profile - what the repo hunt and the in-vertical screen need.

stack: composer.json:symfony/framework-bundle|symfony/dependency-injection|symfony/http-kernel|api-platform/core

hunt: --language php --topic symfony --stars ">500"
hunt: symfony --language php --stars ">2000"
hunt: --language php --size ">40000" --stars ">300"
hunt: --language php --topic self-hosted --stars ">1000"

framework: symfony/symfony
framework: api-platform/api-platform
framework: api-platform/core
framework: Sylius/Sylius
framework: sulu/sulu
framework: contao/contao
framework: laminas/laminas-mvc

# Applications we want benched by name: seeded by declaration, screened on
# reachable, maintained and language only, and slotted by SIZE like any other
# app (see ../stacks/README.md, `repo:`). Picked from this stack's own hunt
# output on 2026-08-13: popular, actively pushed, and applications rather than
# libraries or tutorials. Not `framework:` - that role is barred from the big
# slot, so declaring an app framework-role costs the slot it should fill.
repo: getgrav/grav
repo: wallabag/wallabag
repo: kimai/kimai
repo: Volmarg/personal-management-system

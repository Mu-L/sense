# java-spring stack profile - what the repo hunt and the in-vertical screen need.

stack: pom.xml:spring-boot-starter|org.springframework|spring-boot-dependencies

hunt: --language java --topic spring-boot --stars ">1000"
hunt: spring --language java --stars ">2000"
hunt: --language java --size ">40000" --stars ">300"
hunt: --language java --topic self-hosted --stars ">500"

framework: spring-projects/spring-boot
framework: spring-projects/spring-framework
framework: spring-projects/spring-security
framework: spring-projects/spring-data-jpa
framework: quarkusio/quarkus
framework: micronaut-projects/micronaut-core
framework: apache/dubbo
framework: alibaba/spring-cloud-alibaba

# dart-flutter stack profile - what the repo hunt and the in-vertical screen need.

stack: pubspec.yaml:flutter:|sdk: flutter|get_it|riverpod

hunt: --language dart --topic flutter --stars ">1000"
hunt: --language dart --size ">20000" --stars ">500"
hunt: --language dart --topic self-hosted --stars ">300"
hunt: flutter --language dart --stars ">2000"

framework: flutter/flutter
framework: fluttercommunity/plus_plugins
framework: rrousselLabs/riverpod
framework: fluttercommunity/get_it
framework: flutter/packages

# Applications we want benched by name: seeded by declaration, screened on
# reachable, maintained and language only, and slotted by SIZE like any other
# app (see ../stacks/README.md, `repo:`). Picked from this stack's own hunt
# output on 2026-08-13: popular, actively pushed, and applications rather than
# libraries or tutorials. Not `framework:` - that role is barred from the big
# slot, so declaring an app framework-role costs the slot it should fill.
repo: localsend/localsend
repo: AppFlowy-IO/AppFlowy
repo: KRTirtho/spotube
repo: ente/ente
repo: Predidit/Kazumi

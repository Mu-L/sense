# go-cloudnative stack profile - what the repo hunt and the in-vertical screen need.

stack: go.mod:github.com/spf13/cobra|google.golang.org/grpc|github.com/hashicorp/|k8s.io/apimachinery|go.uber.org/zap

hunt: --language go --topic cloud-native --stars ">1000"
hunt: --language go --size ">40000" --stars ">500"
hunt: --language go --topic self-hosted --stars ">1000"
hunt: --language go --topic kubernetes --stars ">1000"

framework: gin-gonic/gin
framework: labstack/echo
framework: gofiber/fiber
framework: go-kratos/kratos
framework: grpc/grpc-go
framework: spf13/cobra
framework: go-kit/kit

# Applications we want benched by name: seeded by declaration, screened on
# reachable, maintained and language only, and slotted by SIZE like any other
# app (see ../stacks/README.md, `repo:`). Picked from this stack's own hunt
# output on 2026-08-13: popular, actively pushed, and applications rather than
# libraries or tutorials. Not `framework:` - that role is barred from the big
# slot, so declaring an app framework-role costs the slot it should fill.
repo: goharbor/harbor
repo: milvus-io/milvus
repo: argoproj/argo-workflows
repo: juicedata/juicefs
repo: open-policy-agent/opa

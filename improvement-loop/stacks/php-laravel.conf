# php-laravel stack profile - what the repo hunt and the in-vertical screen need.
# Declared, never inferred: a hunt the script invents each run is a hunt whose
# "the pool is exhausted" claim nobody can re-check.

# The in-vertical screen. `<manifest>:<needle>|<needle>...`, matched as ANY, at
# the repo root or one/two levels down. Both forms are needed: a Laravel APP
# requires laravel/framework, a Laravel PACKAGE requires illuminate/*.
stack: composer.json:laravel/framework|illuminate/support|illuminate/contracts

# The hunt. One `gh search repos` ARGUMENT LIST per line (raw gh flags, not a
# query string: a pure-qualifier search collapses to a single search term and
# gh rejects it). Run in order, results merged and de-duplicated. Cover more
# than one AXIS, not more than one wording: a
# name-recall hunt and a topic hunt find the same famous repos, while sorting by
# repo SIZE finds the large applications nobody can name. Measured: the
# name-and-topic hunt produced exactly ONE big non-framework app across 28
# candidates; adding the size axis found three more, including the one that
# filled the big slot's backup.
hunt: --language php --topic laravel --stars ">1000"
hunt: laravel --language php --stars ">2000"
hunt: --language php --size ">40000" --stars ">300"
hunt: --language php --topic self-hosted --stars ">1000"

# Framework-ROLE repos: something others build ON, eligible for the framework
# slot and never for the big slot (the pillar rule keeps the framework from
# being the campaign's sole win). This is DECLARED because it is not derivable:
# composer.json `type` is unset for laravel/framework, filament, statamic and
# flarum, and `project` for october and winter, so it does not separate the two.
# Anything the hunt finds that is not listed here is screened as an application.
framework: laravel/framework
framework: filamentphp/filament
framework: statamic/cms
framework: octobercms/october
framework: flarum/flarum
framework: flarum/framework
framework: wintercms/winter
framework: area17/twill
framework: aimeos/aimeos-laravel

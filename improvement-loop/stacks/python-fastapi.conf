# python-fastapi stack profile - what the repo hunt and the in-vertical screen need.

stack: pyproject.toml:fastapi|starlette|litestar

hunt: --language python --topic fastapi --stars ">1000"
hunt: fastapi --language python --stars ">2000"
hunt: --language python --size ">40000" --stars ">300"
hunt: --language python --topic self-hosted --stars ">1000"

framework: fastapi/fastapi
framework: encode/starlette
framework: pydantic/pydantic
framework: fastapi/sqlmodel
framework: litestar-org/litestar
framework: strawberry-graphql/strawberry

# Applications we want benched by name: seeded by declaration, screened on
# reachable, maintained and language only, and slotted by SIZE like any other
# app (see ../stacks/README.md, `repo:`). Picked from this stack's own hunt
# output on 2026-08-13: popular, actively pushed, and applications rather than
# libraries or tutorials. Not `framework:` - that role is barred from the big
# slot, so declaring an app framework-role costs the slot it should fill.
repo: polarsource/polar
repo: MODSetter/SurfSense
repo: Zeyi-Lin/HivisionIDPhotos
repo: vastsa/FileCodeBox

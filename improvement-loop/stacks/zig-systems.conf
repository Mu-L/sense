# zig-systems stack profile - what the repo hunt and the in-vertical screen need.

stack: build.zig:addExecutable|addModule|b.dependency|addStaticLibrary

hunt: --language zig --topic zig --stars ">300"
hunt: --language zig --size ">10000" --stars ">300"
hunt: zig --language zig --stars ">500"
hunt: --language zig --topic self-hosted --stars ">100"

framework: ziglang/zig
framework: zigzap/zap
framework: karlseguin/http.zig
framework: zigtools/zls

# Applications we want benched by name: seeded by declaration, screened on
# reachable, maintained and language only, and slotted by SIZE like any other
# app (see ../stacks/README.md, `repo:`). Picked from this stack's own hunt
# output on 2026-08-13: popular, actively pushed, and applications rather than
# libraries or tutorials. Not `framework:` - that role is barred from the big
# slot, so declaring an app framework-role costs the slot it should fill.
repo: lightpanda-io/browser
repo: riverwm/river
repo: mitchellh/libxev
repo: fairyglade/ly
repo: PixelGuys/Cubyz

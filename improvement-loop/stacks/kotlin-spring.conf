# kotlin-spring stack profile - what the repo hunt and the in-vertical screen need.

stack: build.gradle.kts:org.springframework.boot|spring-boot-starter|kotlin("plugin.spring")

hunt: --language kotlin --topic spring-boot --stars ">500"
hunt: spring --language kotlin --stars ">1000"
hunt: --language kotlin --size ">40000" --stars ">300"
hunt: --language kotlin --topic self-hosted --stars ">500"

framework: spring-projects/spring-boot
framework: spring-projects/spring-framework
framework: ktorio/ktor
framework: JetBrains/Exposed
framework: http4k/http4k

# Applications we want benched by name: seeded by declaration, screened on
# reachable, maintained and language only, and slotted by SIZE like any other
# app (see ../stacks/README.md, `repo:`). Picked from this stack's own hunt
# output on 2026-08-13: popular, actively pushed, and applications rather than
# libraries or tutorials. Not `framework:` - that role is barred from the big
# slot, so declaring an app framework-role costs the slot it should fill.
repo: gotson/komga
repo: lavalink-devs/Lavalink
repo: zalando/zally
repo: getsentry/sentry-java

version: "2"

linters:
  enable:
    - errcheck
    - staticcheck
    - govet
    - gosec
    - ineffassign
    - unconvert
    - gocritic
    - exhaustive
    - unused
    - misspell
    - dupword
    - revive
    - nolintlint
    - depguard
    - gocyclo
    - gocognit
  settings:
    # Two branching linters, no line-counting one. gocyclo/gocognit measure
    # the branching that makes code hard to read and test; funlen is
    # deliberately NOT enabled (raw line count punishes flat switches and
    # table literals). Thresholds are the cycle's TARGET, not today's worst —
    # today's violators carry an inline //nolint:goc... ledger pointing at the
    # pitch that retires them. grep -rn 'nolint:goc' is the burndown.
    gocyclo:
      # golangci-lint reports complexity STRICTLY greater than min-complexity,
      # so 15 == "over 15" (flags 16+).
      min-complexity: 15
    gocognit:
      min-complexity: 30
    exhaustive:
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true
      require-specific: true
    depguard:
      # Goal 5 (no side effects), enforced at compile time: the verified
      # pure-core packages may not reach for effects. They take bytes and
      # return data; effects live at the edges (scan, watch, search's
      # ripgrep, dead/eval's analyzers, the ONNX shell). This set is locked
      # at today's import-clean state and GROWS as later pitches clean more
      # packages — never add a package that legitimately shells out.
      rules:
        pure-core:
          files:
            - "**/internal/extract/**"
            - "**/internal/blast/**"
            - "**/internal/conventions/**"
            - "**/internal/mcpio/**"
            - "**/internal/model/**"
          deny:
            - pkg: os/exec
              desc: "pure-core must not shell out; inject the effect at the edge"
            - pkg: net
              desc: "pure-core must not touch the network; inject the effect at the edge"
            - pkg: syscall
              desc: "pure-core must not call syscalls directly; inject the effect at the edge"
            - pkg: github.com/fsnotify/fsnotify
              desc: "pure-core must not watch the filesystem; that is the watch package's job"
        # The sense-lab boundary. The bench may reach Sense ONLY through the MCP
        # server, because that is the channel the benched agent actually had.
        # Querying the index directly would measure a channel no agent has, and
        # nothing about that failure would be visible in a result.
        # The lab's pure core. Scoring takes bytes and returns numbers, and it
        # must keep doing so: the moment recall can fail because a checkout is
        # missing, every number the instrument produces depends on the state of
        # a disk. Grounding is the one piece needing a repository, and it lives
        # in lab/internal/ground, at the edge.
        #
        # score and plan ONLY. transcript and scenario read files by design, so
        # listing them here would describe an aspiration rather than a fact, and
        # a rule that is already false where it points will not be believed when
        # it matters. `os` is denied as well as `os/exec`, because the property
        # is "does not touch a disk", and a rule that stopped only the shell
        # would not hold it.
        lab-pure:
          files:
            - "**/lab/internal/score/**"
            - "**/lab/internal/plan/**"
            - "**/lab/internal/judge/**"
            - "**/lab/internal/tally/**"
            - "**/lab/internal/gate/**"
            - "**/lab/internal/phase/**"
            - "**/lab/internal/loop/**"
          deny:
            - pkg: os
              desc: "the lab's pure core must not read a disk; recall may not depend on the state of one"
            - pkg: os/exec
              desc: "the lab's pure core must not shell out; grounding lives in lab/internal/ground"
            - pkg: net
              desc: "the lab's pure core must not touch the network"
            - pkg: syscall
              desc: "the lab's pure core must not call syscalls directly"
        lab-boundary:
          files:
            - "**/lab/**"
          deny:
            - pkg: github.com/luuuc/sense/internal
              desc: "sense-lab must reach Sense through the MCP server, never by importing sense/internal"
  exclusions:
    paths:
      - bench/lib/test_fixtures
    rules:
      # gocyclo/gocognit: gate production branching only. Table-driven tests
      # are legitimately long and branchy; their complexity is not what the
      # 27-05→12 split/extractor pitches retire, so it stays out of the ledger.
      - linters: [gocyclo, gocognit]
        path: _test\.go
      # gocyclo/gocognit: scoped to the packages cycle 27 actually refactors,
      # symmetric with the per-file coverage gate (see 27-00 honest boundary).
      # The long tail below has no in-cycle split owner; its //nolint ledger
      # would never burn down, so it is left ungated until a follow-up cycle
      # claims it. Shrink this list as each package is brought into scope.
      - linters: [gocyclo, gocognit]
        path: (cmd/sense|internal/(benchmark|cli|freshen|hook|ignore|mcpio|summary))/
      # depguard/lab-pure: the property is about the PRODUCTION core, which must
      # not depend on the state of a disk. Its tests legitimately read checked-in
      # fixtures, and forbidding that would only push the reads into a helper
      # package and prove nothing.
      - linters: [depguard]
        path: lab/internal/(score|plan|judge|tally|gate|phase|loop)/.*_test\.go
      # dupword: SQL NULL repetitions and embedded Ruby/test fixtures are fine
      - linters: [dupword]
        path: _test\.go
      - linters: [dupword]
        path: cmd/sense/main\.go
      # gosec: test files legitimately use weak RNG, broad perms, variable paths
      - linters: [gosec]
        path: _test\.go
      # gosec: benchmark fixtures use weak RNG and broad file ops
      - linters: [gosec]
        path: internal/benchmark/
      # gosec: suppress rules that are false positives for a CLI tool
      - linters: [gosec]
        text: "G118:"
      - linters: [gosec]
        text: "G202:"
      - linters: [gosec]
        text: "G204:"
      - linters: [gosec]
        text: "G301:"
      - linters: [gosec]
        text: "G302:"
      - linters: [gosec]
        text: "G304:"
      - linters: [gosec]
        text: "G306:"
      - linters: [gosec]
        text: "G602:"
      - linters: [gosec]
        text: "G703:"
      # revive: don't require doc comments on every export — CLI tool, not a library
      - linters: [revive]
        text: "exported: "
      - linters: [revive]
        text: "package-comments: "
      # revive: blank imports are used for side-effect registration (SQLite driver, extractors)
      - linters: [revive]
        text: "blank-imports: "
      # revive: indent-error-flow is noisy in CLI command handlers
      - linters: [revive]
        text: "indent-error-flow: "

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # Settle imports into stdlib / external / internal (github.com/luuuc/sense)
      # groups so future diffs stay stable.
      local-prefixes:
        - github.com/luuuc/sense
  exclusions:
    paths:
      - bench/lib/test_fixtures
